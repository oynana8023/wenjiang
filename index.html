    var d = new Date(ts || Date.now());
    var hh = ('0' + d.getHours()).slice(-2);
    var mm = ('0' + d.getMinutes()).slice(-2);
    return hh + ':' + mm;
  }

  function ago(ts) {
    if (!ts) return '未更新';
    var s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return '刚刚';
    if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
    if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
    return Math.floor(s / 86400) + ' 天前';
  }

  /* 客户端分类：原文元信息拿不到时也要有个像样的标签，不靠服务端 */
  var CATS = [
    ['科技数码', /(AI|人工智能|大模型|芯片|手机|苹果|iPhone|华为|小米|鸿蒙|安卓|iOS|发布|系统|相机|电池|屏幕|显卡|机器人|算力|算法|卫星|SpaceX|马斯克|电脑|平板|耳机|智能|科技|数码|App|软件)/i],
    ['财经商业', /(股价|市值|融资|营收|财报|上市|IPO|裁员|涨价|降价|价格|消费|市场|经济|品牌|电商|直播带货|销量|亏损|投资|基金|黄金|房|贷款|利率)/],
    ['汽车出行', /(汽车|新车|车型|车企|比亚迪|特斯拉|理想|蔚来|小鹏|问界|续航|智驾|充电|电池车|油价|航班|高铁|地铁)/],
    ['娱乐影视', /(电影|剧集|电视剧|综艺|明星|歌手|演唱会|票房|导演|主演|官宣|恋爱|结婚|离婚|塌房|演员|网剧|动画)/],
    ['体育赛事', /(比赛|冠军|夺冠|球队|球员|联赛|奥运|世界杯|篮球|足球|国足|NBA|CBA|中超|网球|乒乓|马拉松|运动员)/],
    ['游戏电竞', /(游戏|版本|玩家|主机|电竞|开服|手游|Steam|任天堂|索尼|PlayStation|关卡|联机)/],
    ['教育职场', /(高考|考研|考公|招聘|薪资|裁员|职场|大学生|就业|学校|老师|专业|毕业|简历)/],
    ['健康医疗', /(医院|医生|疾病|药品|疫苗|医保|健康|减肥|睡眠|养生|癌症|流感|体检)/],
    ['社会民生', /(警方|通报|事故|天气|台风|暴雨|高温|寒潮|交通|快递|物业|小区|火灾|失联|救援|游客|收费|新规)/]
  ];

  var SRC_CAT = {
    weibo: '全网热点', zhihu: '问答热议', toutiao: '资讯热点', baidu: '全网热搜',
    douyin: '短视频热点', bilibili: '社区热门', '36kr': '商业创投',
    sspai: '数字生活', ithome: '科技数码', geekpark: '科技前沿'
  };

  function catOf(title, srcId) {
    var t = String(title || '');
    var best = '', score = 0;
    for (var i = 0; i < CATS.length; i++) {
      var m = t.match(new RegExp(CATS[i][1].source, 'gi'));
      var n = m ? m.length : 0;
      if (n > score) { score = n; best = CATS[i][0]; }
    }
    return score >= 1 ? best : (SRC_CAT[srcId] || '热点');
  }

  function sourceName(id) {
    for (var i = 0; i < window.WJLive.SOURCES.length; i++) {
      if (window.WJLive.SOURCES[i].id === id) return window.WJLive.SOURCES[i].name;
    }
    return id;
  }

  /* ---------------- 通用块 ---------------- */

  function brand() {
    return '<div class="brand"><div class="mark">匠</div><div class="bt"><b>文匠</b><small>rewrite studio</small></div></div>';
  }

  function quotaPill(state) {
    var left = Math.max(0, state.quota.total - state.quota.used);
    return '<button class="quota" data-act="open-quota">' + ic('zap', 12) +
      ' 今日剩余 <b>' + left + '</b> / ' + state.quota.total + '</button>';
  }

  function liveBadge(src) {
    if (!src || !src.ok) return '<span class="badge plain">未连接</span>';
    if (src.via === 'live') return '<span class="badge live"><i class="dot" style="width:4px;height:4px;box-shadow:none"></i>实时</span>';
    return '<span class="badge sample">快照</span>';
  }

  function rankRow(item, i, srcId) {
    return '<button class="rank' + (i < 3 ? ' top' : '') + '" data-act="hot-item" data-src="' + esc(srcId) + '" data-i="' + i + '">' +
      '<span class="no">' + (i + 1 < 10 ? '0' + (i + 1) : i + 1) + '</span>' +
      '<span class="body"><span class="t">' + esc(item.title) + '</span>' +
      '<span class="m">' + (item.hot ? '<span class="hot">' + fmtHot(item.hot) + '</span>' : '') +
      '<span>' + esc(sourceName(srcId)) + '</span></span></span>' +
      '<span class="go">' + ic('edit', 13) + '</span></button>';
  }

  function emptyState(icon, title, desc, action) {
    return '<div class="empty"><div class="ei">' + ic(icon, 22) + '</div><b>' + esc(title) + '</b><p>' + desc + '</p>' +
      (action || '') + '</div>';
  }

  /* ---------------- 首页 ---------------- */

  function home(state) {
    var active = state.hot.active || 'weibo';
    var src = state.hot.bySrc[active];
    var list = (src && src.items) || [];
    var updated = state.hot.updatedAt;

    var h = '<div class="hero">';
    h += '<div class="hero-row"><i class="dot ' + (src && src.ok ? 'pulse' : 'off') + '"></i>' +
      '<span class="eyebrow">' + (state.hot.loading ? '正在抓取热榜' : '实时热榜 · 已接入 ' + (state.hot.okCount || 0) + ' 个源') + '</span></div>';
    h += '<h1 class="h1">把热榜<br>写成<em>你的</em>稿</h1>';
    h += '<p class="lead">粘一条链接，选一种语气，拿到可以直接发布的成稿。原文、观点、配图，一次给全。</p>';
    h += '<div class="hero-stat">' +
      '<span>更新 <b>' + (updated ? fmtTime(updated) : '—') + '</b></span>' +
      '<span><b>' + list.length + '</b> 条在榜</span>' +
      '<span>今日 <b>' + state.works.length + '</b> 篇</span></div>';

    h += '<div class="entries">';
    h += '<button class="entry primary" data-act="start" data-mode="link">' +
      '<span class="ico">' + ic('link', 18) + '</span>' +
      '<span class="etxt"><b>链接二创</b><span>粘贴公众号、头条、新闻链接，自动取正文</span></span>' +
      '<span class="arrow">' + ic('right', 16) + '</span></button>';
    h += '<button class="entry" data-act="start" data-mode="text">' +
      '<div class="ico">' + ic('text', 16) + '</div>' +
      '<div class="etxt"><b>文案改写</b><span>已有稿子，换风格换平台</span></div></button>';
    h += '<button class="entry" data-act="start" data-mode="merge">' +
      '<div class="ico">' + ic('layers', 16) + '</div>' +
      '<div class="etxt"><b>双素材融合</b><span>两篇合一，做出信息增量</span></div></button>';
    h += '</div></div>';

    /* 热榜 */
    h += '<section class="sec">';
    h += '<div class="sec-head"><div class="h2">此刻在榜</div>' +
      liveBadge(src) +
      '<button class="sec-more" data-act="tab" data-tab="rank">全部 ' + ic('right', 12) + '</button></div>';

    h += '<div class="hscroll" style="margin-bottom:10px">' +
      window.WJLive.SOURCES.map(function (s) {
        return '<button class="chip' + (s.id === active ? ' on' : '') + '" data-act="hot-src" data-src="' + s.id + '">' +
          esc(s.name) + '</button>';
      }).join('') + '</div>';

    if (state.hot.loading && !list.length) {
      h += '<div class="panel" style="padding:16px">' +
        '<div class="sk" style="width:82%;margin-bottom:12px"></div>' +
        '<div class="sk" style="width:64%;margin-bottom:12px"></div>' +
        '<div class="sk" style="width:74%;margin-bottom:12px"></div>' +
        '<div class="sk" style="width:56%"></div></div>';
    } else if (list.length) {
      h += '<div class="panel stagger">' +
        list.slice(0, 6).map(function (it, i) { return rankRow(it, i, active); }).join('') + '</div>';
    } else {
      h += emptyState('alert', '这个源暂时没抓到',
        '可能是接口限流或网络不通。换个源，或点右上角刷新。',
        '<button class="btn btn-soft mt-m" data-act="hot-reload">' + ic('refresh', 15) + ' 重新抓取</button>');
    }
    h += '</section>';

    /* 最近作品 */
    if (state.works.length) {
      h += '<section class="sec"><div class="sec-head"><div class="h2">最近</div>' +
        '<button class="sec-more" data-act="tab" data-tab="works">作品库 ' + ic('right', 12) + '</button></div>';
      h += '<div class="rows stagger">' + state.works.slice(0, 3).map(function (w, i) {
        return '<button class="row" data-act="open-work" data-id="' + w.id + '" style="--i:' + i + '">' +
          '<span class="ri">' + ic('book', 15) + '</span>' +
          '<span class="rt"><b>' + esc(w.title || '未命名') + '</b>' +
          '<small>' + esc(w.styleName) + ' · ' + w.words + ' 字 · ' + ago(w.at) + '</small></span>' +
          '<span class="chev">' + ic('right', 15) + '</span></button>';
      }).join('') + '</div></section>';
    }

    h += '<div class="note mt-l">' + ic('shield', 14) +
      '<div>热榜来自公开接口，<b>带「实时 / 快照」标签</b>与抓取时间。时政类条目不进入榜单' +
      (src && src.blocked ? '（本页已过滤 <b>' + src.blocked + '</b> 条）' : '') +
      '，站内没有编造的新闻。</div></div>';

    h += '<div class="ver">WENJIANG · ' + (state.version || 'v2.0') + '</div>';
    return '<div class="screen">' + h + '</div>';
  }

  /* ---------------- 热榜页 ---------------- */

  function rank(state) {
    var active = state.hot.active || 'weibo';
    var src = state.hot.bySrc[active];
    var list = (src && src.items) || [];

    var h = '<div class="screen">';
    h += '<div style="padding-top:6px"><div class="eyebrow">Live board</div>' +
      '<h1 class="h1" style="font-size:27px">热榜</h1></div>';

    h += '<div class="hscroll mt-m">' +
      window.WJLive.SOURCES.map(function (s) {
        var st = state.hot.bySrc[s.id];
        return '<button class="chip' + (s.id === active ? ' on' : '') + '" data-act="hot-src" data-src="' + s.id + '">' +
          esc(s.name) + '<span class="c">' + (st && st.items ? st.items.length : '·') + '</span></button>';
      }).join('') + '</div>';

    h += '<div style="display:flex;align-items:center;gap:10px;margin:16px 0 6px">' +
      liveBadge(src) +
      '<span class="sec-sub">' + (src && src.at ? fmtTime(src.at) + ' 抓取 · ' + ago(src.at) : '—') + '</span>' +
      '<div class="spacer"></div>' +
      '<button class="mini-btn" data-act="hot-reload">' + ic('refresh', 13) + ' 刷新</button></div>';

    if (state.hot.loading && !list.length) {
      h += '<div class="panel" style="padding:16px">' + new Array(6).fill('<div class="sk" style="margin-bottom:14px"></div>').join('') + '</div>';
    } else if (list.length) {
      h += '<div class="rank-list">' + list.map(function (it, i) { return rankRow(it, i, active); }).join('') + '</div>';
      if (src && src.via === 'snapshot') {
        h += '<div class="note warn mt-m">' + ic('clock', 14) +
          '<div>这是<b>定时快照</b>，不是此刻实时值。生成时间 ' + fmtTime(src.at) + '，GitHub Action 每 15 分钟刷新一次。</div></div>';
      }
    } else {
      h += emptyState('alert', '没抓到数据', '换个源试试，或稍后刷新。接口偶尔会限流。',
        '<button class="btn btn-soft mt-m" data-act="hot-reload">' + ic('refresh', 15) + ' 重试</button>');
    }

    h += '<div class="note mt-l">' + ic('globe', 14) +
      '<div>数据来自微博、知乎、头条、百度、抖音、B 站等公开榜单接口，仅保留标题与热度值，不做任何加工。抓取失败会明确显示，不会用假数据填充。</div></div>';

    /* 公众号：微信不提供公开热文榜，这里只做「贴链接取正文」 */
    h += '<div class="card mt-s" style="padding:16px">' +
      '<div style="font-size:14px;font-weight:600">公众号没有公开热榜</div>' +
      '<div class="sec-sub" style="margin-top:6px;line-height:1.65">微信不对外提供公众号热文榜，市面上号称「公众号热榜」的多是二手抓取。要看某篇公众号文章，把链接贴进来，点解析就能取到正文。</div>' +
      '<button class="btn btn-soft btn-block mt-m" data-act="wx-parse">' + ic('link', 15) + ' 粘贴公众号链接解析</button></div>';

    h += '</div>';
    return h;
  }

  /* ---------------- 创作页 ---------------- */

  function compose(state) {
    var c = state.compose;
    var h = '<div class="screen tight">';
    h += '<div style="padding-top:6px"><div class="eyebrow">New piece</div>' +
      '<h1 class="h1" style="font-size:27px">新建一篇</h1></div>';

    h += '<div class="seg mt-m" data-seg="mode">' +
      '<span class="thumb"></span>' +
      ['link|链接', 'text|文案', 'merge|双素材'].map(function (x) {
        var p = x.split('|');
        return '<button data-act="mode" data-mode="' + p[0] + '" class="' + (c.mode === p[0] ? 'on' : '') + '">' + p[1] + '</button>';
      }).join('') + '</div>';

    if (c.mode === 'link') {
      h += '<div class="field mt-m"><div class="field-head"><span class="lbl">Source URL</span>' +
        '<span class="cnt">' + (c.link1 ? '已粘贴' : '公众号 / 头条 / 新闻站') + '</span></div>' +
        '<textarea class="tall" data-field="link1" placeholder="https://mp.weixin.qq.com/s/...">' + esc(c.link1) + '</textarea>' +
        '<div class="foot"><button class="mini-btn" data-act="paste">' + ic('copy', 12) + ' 从剪贴板</button>' +
        (c.link1 ? '<button class="mini-btn" data-act="clear-compose">' + ic('close', 12) + ' 清空</button>' : '') +
        '<button class="mini-btn" data-act="start" data-mode="text">' + ic('text', 12) + ' 直接粘全文</button>' +
        '<div class="spacer"></div><span class="sec-sub">支持多数服务端渲染页面</span></div></div>';
    } else if (c.mode === 'text') {
      h += '<div class="field mt-m"><div class="field-head"><span class="lbl">Raw text</span>' +
        '<span class="cnt"><span data-cnt="text1">0</span> 字</span></div>' +
        '<textarea class="tall" data-field="text1" placeholder="把原文粘进来，至少 30 字。观点、数据、案例都可以。">' + esc(c.text1) + '</textarea>' +
        '<div class="foot"><button class="mini-btn" data-act="example">' + ic('sparkle', 12) + ' 用示例素材</button>' +
        (c.text1 ? '<button class="mini-btn" data-act="clear-compose">' + ic('close', 12) + ' 清空</button>' : '') +
        '<div class="spacer"></div><span class="sec-sub">不会上传到任何服务器</span></div></div>';
    } else {
      h += '<div class="field mt-m"><div class="field-head"><span class="lbl">Material A</span>' +
        '<span class="cnt"><span data-cnt="text1">0</span> 字</span></div>' +
        '<textarea data-field="text1" placeholder="第一篇素材：事实、数据、时间线">' + esc(c.text1) + '</textarea></div>';
      h += '<div class="field mt-s"><div class="field-head"><span class="lbl">Material B</span>' +
        '<span class="cnt"><span data-cnt="text2">0</span> 字</span></div>' +
        '<textarea data-field="text2" placeholder="第二篇素材：不同角度、补充案例">' + esc(c.text2) + '</textarea></div>';
      h += '<div class="note mt-s">' + ic('layers', 13) +
        '<div>融合两篇的主旨与新事实，输出第三篇。这是产生<b>信息增量</b>的做法，不是换词洗稿。</div></div>';
    }

    /* 风格 */
    h += '<div class="sec"><div class="sec-head"><div class="h2" style="font-size:15px">风格</div>' +
      '<span class="sec-sub" data-style-tip>' + esc(styleDesc(c.style)) + '</span></div>';
    h += '<div class="hscroll" style="padding-bottom:2px">' + D.STYLES.map(function (s) {
      return '<button class="stylecard' + (c.style === s.key ? ' on' : '') + '" data-act="style" data-style="' + s.key + '">' +
        '<i>' + ic(s.icon, 15) + '</i><b>' + esc(s.short) + '</b><span>' + esc(s.tone) + '</span></button>';
    }).join('') + '</div></div>';

    /* 强度 */
    h += '<div class="sec"><div class="sec-head"><div class="h2" style="font-size:15px">改写强度</div>' +
      '<span class="sec-sub">' + esc(strengthDesc(c.strength)) + '</span></div>';
    h += '<div class="seg" data-seg="strength"><span class="thumb"></span>' +
      D.STRENGTHS.map(function (s) {
        return '<button data-act="strength" data-strength="' + s.key + '" class="' + (c.strength === s.key ? 'on' : '') + '">' + esc(s.name) + '</button>';
      }).join('') + '</div></div>';

    /* 平台 */
    h += '<div class="sec"><div class="sec-head"><div class="h2" style="font-size:15px">发布平台</div>' +
      '<span class="sec-sub">影响段落长度与语气</span></div>';
    h += '<div class="hscroll">' + D.PLATFORMS.map(function (p) {
      return '<button class="chip' + (c.platform === p.key ? ' on' : '') + '" data-act="platform" data-platform="' + p.key + '">' + esc(p.name) + '</button>';
    }).join('') + '</div></div>';

    /* 高级 */
    h += '<div class="sec"><button class="row" data-act="toggle-adv" style="border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface)">' +
      '<span class="ri">' + ic('settings', 15) + '</span>' +
      '<span class="rt"><b>更多控制</b><small>' + (c.adv ? '已展开' : '自定义要求 · 去 AI 味 · 保真') + '</small></span>' +
      '<span class="chev" style="transform:rotate(' + (c.adv ? '90' : '0') + 'deg);transition:transform .3s">' + ic('right', 15) + '</span></button>';

    if (c.adv) {
      h += '<div class="field mt-s"><div class="field-head"><span class="lbl">Extra instruction</span></div>' +
        '<textarea style="min-height:64px" data-field="extra" placeholder="例如：结尾加一句提问；不要出现「赋能」「闭环」这类词">' + esc(c.extra) + '</textarea></div>';

      h += '<div class="rows mt-s">' +
        rowSwitch('sparkle', '去 AI 味', '删掉模板腔与排比句', c.deai, 'deai') +
        rowSwitch('shield', '事实保真', '数字、人名、引语不改', c.faithful, 'faithful') +
        '</div>';
    }
    h += '</div>';

    h += '<div style="height:24px"></div></div>';

    /* 底部 CTA */
    var left = Math.max(0, state.quota.total - state.quota.used);
    h += '<div class="dock"><div class="dock-row" style="margin-bottom:8px;align-items:center">' +
      quotaPill(state) +
      '<div class="spacer"></div>' +
      '<span class="sec-sub">' + esc(styleName(c.style)) + ' · ' + esc(strengthName(c.strength)) + '</span></div>' +
      '<button class="btn btn-primary btn-lg btn-block" data-act="generate"' + (left <= 0 ? ' disabled' : '') + '>' +
      ic('sparkle', 17) + (left <= 0 ? '今日额度已用完' : '开始改写') + '</button></div>';

    return h;
  }

  function rowSwitch(icon, title, desc, on, act) {
    return '<div class="row"><span class="ri">' + ic(icon, 14) + '</span>' +
      '<span class="rt"><b>' + title + '</b><small>' + desc + '</small></span>' +
      '<button class="sw' + (on ? ' on' : '') + '" data-act="toggle" data-key="' + act + '"></button></div>';
  }

  function styleName(k) {
    for (var i = 0; i < D.STYLES.length; i++) if (D.STYLES[i].key === k) return D.STYLES[i].name;
    return '';
  }
  function styleDesc(k) {
    for (var i = 0; i < D.STYLES.length; i++) if (D.STYLES[i].key === k) return D.STYLES[i].tone;
    return '';
  }
  function strengthName(k) {
    for (var i = 0; i < D.STRENGTHS.length; i++) if (D.STRENGTHS[i].key === Number(k)) return D.STRENGTHS[i].name;
    return '';
  }
  function strengthDesc(k) {
    for (var i = 0; i < D.STRENGTHS.length; i++) if (D.STRENGTHS[i].key === Number(k)) return D.STRENGTHS[i].desc;
    return '';
  }

  /* ---------------- 结果页 ---------------- */

  function result(state) {
    var r = state.result;
    if (!r) return '<div class="screen">' + emptyState('alert', '没有结果', '回到创作页重新生成。') + '</div>';
    var tab = state.resultTab || 'body';
    var C = 2 * Math.PI * 27;

    var h = '<div class="screen tight">';
    h += '<div class="score-row">';
    h += '<div class="ring"><svg viewBox="0 0 62 62">' +
      '<circle class="bgc" cx="31" cy="31" r="27" fill="none" stroke-width="3.5"/>' +
      '<circle class="fgc" cx="31" cy="31" r="27" fill="none" stroke-width="3.5" ' +
      'stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + C.toFixed(1) + '" data-score="' + r.score + '"/>' +
      '</svg><span class="val">0</span></div>';
    var lvl = r.score >= 60 ? ['较大', 'live'] : r.score >= 45 ? ['中等', 'plain'] : ['偏小', 'sample'];
    h += '<div class="score-meta"><div class="t">改写幅度' +
      '<span class="badge ' + lvl[1] + '">' + lvl[0] + '</span></div>' +
      '<div class="d">' + r.score + '% 的文字与原文不重合；另有 ' + (r.sim || 0) + '% 是连续 12 字以上的重合片段。' +
      '本机统计，与平台判定无关。</div></div></div>';

    if ((!r.modelName || r.modelName === '本机引擎') && r.words > 600) {
      h += '<div class="note mt-s">' + ic('alert', 14) +
        '<div>这篇 ' + r.words + ' 字。本机引擎对长文只能做轻度改写，段落几乎照原顺序走；<b>接模型后差别会很明显</b>。</div></div>';
    }
    if (!r.modelName || r.modelName === '本机引擎') {
      h += '<button class="note mt-s" data-act="open-model" style="width:100%;text-align:left;align-items:center">' +
        ic('cpu', 14) + '<div style="flex:1">当前用的是<b>本机规则引擎</b>。接一个自己的模型，改写幅度通常能再高一大截。<span style="color:var(--acc)">去配置 →</span></div></button>';
    }

    h += '<div class="metrics">' +
      '<div class="metric"><div class="k">字数</div><div class="v">' + r.words + '</div></div>' +
      '<div class="metric"><div class="k">重合率</div><div class="v">' + (r.sim || 0) + '<small>%</small></div></div>' +
      '<div class="metric"><div class="k">重复句</div><div class="v">' + r.dupes + '</div></div></div>';

    h += '<div style="display:flex;align-items:center;gap:8px;margin-top:18px">' +
      '<span class="badge ai">AI 生成</span><span class="sec-sub">' + esc(r.styleName) + ' · ' + esc(r.platformName) + ' · ' + esc(r.modelName || '本机引擎') + '</span></div>';

    if (tab === 'body') {
      h += '<h1 class="result-title">' + esc(r.title) + '</h1>';
      h += '<div class="prose mt-m">' + window.WJEngine.mdToHtml(r.body) + '</div>';
      h += '<div class="note mt-m">' + ic('shield', 14) +
        '<div>发布时建议勾选平台的「AI 辅助创作」声明。<b>复制全文会自动附带声明</b>（可在「我的」关闭）。</div></div>';
    } else if (tab === 'titles') {
      h += '<div class="sec-head mt-m"><div class="h2" style="font-size:15px">标题候选</div><span class="sec-sub">点一下替换</span></div>';
      h += '<div class="panel" style="padding:2px 16px">' + r.titles.map(function (t, i) {
        return '<button class="ttl' + (t === r.title ? ' on' : '') + '" data-act="pick-title" data-t="' + i + '">' +
          '<span class="idx">' + (i + 1) + '</span><span class="txt">' + esc(t) + '</span>' +
          '<span class="cp">' + ic('copy', 14) + '</span></button>';
      }).join('') + '</div>';
    } else if (tab === 'orig') {
      h += '<div class="sec-head mt-m"><div class="h2" style="font-size:15px">原文对照</div>' +
        '<span class="sec-sub">' + esc(r.sourceTitle || '输入素材') + '</span></div>';
      h += '<div class="prose" style="font-size:14px;color:var(--ink-2)">' +
        String(r.source).split(/\n+/).filter(Boolean).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') + '</div>';
    } else {
      h += images(state);
    }

    h += '<div style="height:20px"></div></div>';

    /* 底部 */
    h += '<div class="dock">';
    h += '<div class="hscroll" style="margin-bottom:10px;padding-right:0">' +
      ['body|成稿', 'titles|标题', 'orig|原文', 'images|配图'].map(function (x) {
        var p = x.split('|');
        return '<button class="chip' + (tab === p[0] ? ' on' : '') + '" data-act="rtab" data-tab="' + p[0] + '">' + p[1] + '</button>';
      }).join('') + '</div>';
    h += '<div class="dock-row">' +
      '<button class="btn btn-soft" style="flex:0 0 52px;padding:0" data-act="more">' + ic('more', 18) + '</button>' +
      '<button class="btn btn-soft" style="flex:0 0 52px;padding:0" data-act="redo">' + ic('refresh', 17) + '</button>' +
      '<button class="btn btn-primary" style="flex:1" data-act="copy-all">' + ic('copy', 16) + ' 复制全文</button></div></div>';

    return h;
  }

  /* ---------------- 配图区 ---------------- */

  function images(state) {
    var r = state.result;
    var s = state.settings;
    var imgProv = (s.providers || []).filter(function (p) { return p.imageModel && p.base && p.key; });
    var h = '<div class="sec-head mt-m"><div class="h2" style="font-size:15px">配图</div>' +
      '<span class="sec-sub">' + (imgProv.length ? imgProv.length + ' 个出图模型可用' : '未配置出图模型') + '</span></div>';

    /* 真实配图：能用原文的就别生成，至少保真 */
    if (r.cover) {
      h += '<div class="coverbox"><img src="' + esc(r.cover) + '" alt="">' +
        '<span class="cbtag">封面 · 原文配图</span></div>';
    }

    if (r.realImages && r.realImages.length) {
      h += '<div class="sec-head mt-m" style="margin-bottom:8px"><div class="h2" style="font-size:13px">原文配图</div>' +
        '<span class="sec-sub">取自原文页面，真实可考</span></div>';
      h += '<div class="imgrid real">' + r.realImages.map(function (src) {
        return '<div class="im"><img src="' + esc(src) + '" alt="" loading="lazy">' +
          '<div class="imtools">' +
          '<button data-act="use-real-image" data-url="' + esc(src) + '">设为封面</button>' +
          '<button data-act="copy" data-text="' + esc(src) + '">复制地址</button>' +
          '</div></div>';
      }).join('') + '</div>';
      h += '<div class="note mt-s">' + ic('shield', 14) +
        '<div>这些是文章自己的图，做资讯号时优先用它，比 AI 生成更站得住脚。点「设为封面」会放进成稿。</div></div>';
    } else if (r.url && !r.realTried) {
      h += '<div class="sk" style="height:76px;border-radius:12px;margin-top:10px"></div>';
    } else if (r.url) {
      h += '<div class="note mt-s">' + ic('image', 14) +
        '<div>这篇原文没有可用的配图（或站点把图片交给了脚本加载），所以走下面的提示词方案。</div></div>';
    }

    if (r.images && r.images.length) {
      h += '<div class="sec-head mt-m" style="margin-bottom:8px"><div class="h2" style="font-size:13px">已生成</div>' +
        '<span class="sec-sub">' + esc(r.imageBy || '出图模型') + '</span></div>';
      h += '<div class="imgrid">' + r.images.map(function (src) {
        return '<div class="im"><img src="' + esc(src) + '" alt=""></div>';
      }).join('') + '</div>';
      h += '<div class="dock-row mt-s"><button class="btn btn-soft btn-block" data-act="gen-image">' +
        ic('image', 15) + ' 再生成一组</button></div>';
      return h;
    }

    if (state.imgLoading) {
      h += '<div class="imgrid"><div class="im" style="display:grid;place-items:center"><div class="sk" style="width:60%;height:8px"></div></div>' +
        '<div class="im" style="display:grid;place-items:center"><div class="sk" style="width:60%;height:8px"></div></div></div>';
      return h;
    }

    h += '<div class="note mt-m">' + ic('wand', 14) +
      '<div>' + (imgProv.length
        ? '没有合适的原图时，用已配置的出图模型生成一张；也可以直接复制下面的提示词去即梦、豆包、MJ。'
        : '没有可用的出图模型。<b>下面是为这篇稿子写好的提示词</b>，复制到即梦、豆包、Midjourney 都能用。') + '</div></div>';

    var vs = window.WJEngine.visuals(r.body, { title: r.title, style: r.styleKey });
    h += '<div class="mt-m">' + vs.map(function (v, i) {
      return '<div class="pcard"><div class="ph"><b>' + esc(v.name) + '</b>' +
        '<span class="tg">' + esc(v.ratio) + '</span>' +
        '<button class="mini-btn" data-act="copy-prompt" data-i="' + i + '">' + ic('copy', 12) + ' 复制</button></div>' +
        '<div class="pt">' + esc(v.prompt) + '</div></div>';
    }).join('') + '</div>';

    h += '<div class="dock-row mt-s">' +
      '<button class="btn btn-soft btn-block" data-act="gen-image">' + ic('image', 15) +
      (imgProv.length ? ' 直接生成封面' : ' 生成封面') + '</button></div>';
    return h;
  }

  /* ---------------- 作品库 ---------------- */

  function works(state) {
    var h = '<div class="screen">';
    h += '<div style="padding-top:6px"><div class="eyebrow">Archive</div>' +
      '<h1 class="h1" style="font-size:27px">作品库</h1></div>';

    if (!state.works.length) {
      return h + emptyState('book', '还没有作品', '生成第一篇后，会自动归档在这里，带原创度和原文对照。',
        '<button class="btn btn-primary mt-m" data-act="tab" data-tab="home">去创作</button>') + '</div>';
    }

    h += '<div class="rows mt-m stagger">' + state.works.map(function (w, i) {
      return '<div class="row" style="--i:' + i + '">' +
        '<button class="row" style="padding:0;border:0;background:none;width:auto;flex:0 0 auto" data-act="open-work" data-id="' + w.id + '">' +
        '<span class="ri">' + ic('book', 15) + '</span></button>' +
        '<button class="rt" style="text-align:left" data-act="open-work" data-id="' + w.id + '">' +
        '<b>' + esc(w.title || '未命名') + '</b>' +
        '<small>' + esc(w.styleName) + ' · ' + esc(w.platformName || '') + ' · ' + w.words + ' 字 · ' + ago(w.at) + '</small></button>' +
        '<span class="rv" style="color:' + (w.score >= 80 ? 'var(--acc)' : 'var(--ink-3)') + '">' + w.score + '</span>' +
        '<button class="iconbtn" data-act="work-menu" data-id="' + w.id + '">' + ic('more', 16) + '</button></div>';
    }).join('') + '</div>';

    h += '<div class="note mt-l">' + ic('shield', 14) +
      '<div>作品只存在这台设备的浏览器里。换设备不会同步，清除浏览器数据会丢失。</div></div>';
    h += '<div class="ver">' + state.works.length + ' pieces</div></div>';
    return h;
  }

  /* ---------------- 我的 ---------------- */

  function me(state) {
    var s = state.settings;
    var totalWords = state.works.reduce(function (a, b) { return a + (b.words || 0); }, 0);
    var left = Math.max(0, state.quota.total - state.quota.used);

    var h = '<div class="screen">';
    h += '<div style="padding-top:6px"><div class="eyebrow">Studio</div>' +
      '<h1 class="h1" style="font-size:27px">我的</h1></div>';

    h += '<div class="card pad-lg mt-m" style="display:flex;align-items:center;gap:14px">' +
      '<div class="avatar">匠</div>' +
      '<div style="flex:1"><div style="font-size:15px;font-weight:600">本地创作者</div>' +
      '<div class="sec-sub" style="margin-top:3px">' + state.works.length + ' 篇 · ' + totalWords + ' 字 · ' + (s.model ? '已接入模型' : '本机引擎') + '</div></div>' +
      '<button class="iconbtn solid" data-act="theme" aria-label="外观">' + ic(state.theme === 'light' ? 'sun' : 'moon', 16) + '</button></div>';

    /* 额度 */
    h += '<div class="card mt-s" style="padding:14px 16px">' +
      '<div style="display:flex;align-items:center;gap:10px">' +
      '<span class="sec-sub">今日额度</span><div class="spacer"></div>' +
      '<span class="mono" style="font-size:12px"><b>' + left + '</b> <span class="muted">/ ' + state.quota.total + '</span></span></div>' +
      '<div class="bar"><i style="width:' + Math.round((left / state.quota.total) * 100) + '%"></i></div>' +
      '<div style="display:flex;align-items:center;gap:8px;margin-top:11px">' +
      '<span class="sec-sub">每日 0 点重置</span><div class="spacer"></div>' +
      '<button class="mini-btn" data-act="open-quota">' + ic('zap', 12) + ' 补充额度</button></div></div>';

    /* 模型 */
    h += '<div class="sec"><div class="sec-head"><div class="h2" style="font-size:15px">生成引擎</div>' +
      '<span class="sec-sub">' + (s.base ? 'OpenAI 兼容' : '未配置') + '</span></div>';
    h += '<div class="rows">';
    h += '<button class="row" data-act="open-model"><span class="ri">' + ic('cpu', 15) + '</span>' +
      '<span class="rt"><b>大模型配置</b><small>' + esc(s.model || '未选择模型，使用本机规则引擎') + '</small></span>' +
      '<span class="chev">' + ic('right', 15) + '</span></button>';
    h += '<button class="row" data-act="open-image-model"><span class="ri">' + ic('image', 15) + '</span>' +
      '<span class="rt"><b>出图模型</b><small>' + esc(s.imageModel || '未配置，只用提示词方案') + '</small></span>' +
      '<span class="chev">' + ic('right', 15) + '</span></button>';
    h += '</div></div>';

    /* 偏好 */
    h += '<div class="sec"><div class="sec-head"><div class="h2" style="font-size:15px">偏好</div></div>';
    h += '<div class="rows">';
    h += '<button class="row" data-act="open-style"><span class="ri">' + ic('sparkle', 15) + '</span>' +
      '<span class="rt"><b>默认风格</b></span><span class="rv">' + esc(styleName(s.defaultStyle)) + '</span>' +
      '<span class="chev">' + ic('right', 15) + '</span></button>';
    h += rowLike('shield', '复制时附带 AI 声明', s.declare ? '已开启' : '已关闭', 'toggle', 'declare', true, s.declare);
    h += '<button class="row" data-act="install-app"><span class="ri">' + ic('download', 15) + '</span>' +
      '<span class="rt"><b>装到主屏幕</b><small>全屏打开、断网可用</small></span>' +
      '<span class="chev">' + ic('right', 15) + '</span></button>';
    var themeName = state.theme === 'light' ? '浅色' : state.theme === 'dark' ? '深色' : '跟随系统';
    h += '<button class="row" data-act="theme"><span class="ri">' + ic(state.theme === 'light' ? 'sun' : 'moon', 15) + '</span>' +
      '<span class="rt"><b>外观</b><small>当前：' + themeName + '</small></span>' +
      '<span class="rv">' + themeName + '</span>' +
      '<span class="chev">' + ic('right', 15) + '</span></button>';
    h += '</div></div>';

    /* 说明 */
    h += '<div class="sec"><div class="sec-head"><div class="h2" style="font-size:15px">关于</div></div>';
    h += '<div class="rows">';
    h += '<button class="row" data-act="open-data"><span class="ri">' + ic('globe', 15) + '</span>' +
      '<span class="rt"><b>数据来源与标注规则</b><small>哪些是实时数据，哪些是示例</small></span>' +
      '<span class="chev">' + ic('right', 15) + '</span></button>';
    var _pbs = window.WJLive.parseBases ? window.WJLive.parseBases() : [window.WJLive.parseBase()].filter(Boolean);
    var _pbName = !_pbs.length ? '已关闭'
      : (_pbs.length === 1 && _pbs[0] === window.WJLive.CLOUD_DEFAULT ? '云端（默认）'
        : _pbs.length + ' 条通道');
    h += '<button class="row" data-act="parse-service"><span class="ri">' + ic('wand', 15) + '</span>' +
      '<span class="rt"><b>解析服务</b><small>粘贴链接取正文用的后端</small></span>' +
      '<span class="rv">' + _pbName + '</span>' +
      '<span class="chev">' + ic('right', 15) + '</span></button>';

    h += '<button class="row" data-act="open-compliance"><span class="ri">' + ic('shield', 15) + '</span>' +
      '<span class="rt"><b>合规说明</b><small>AI 标识、原创声明、平台规则</small></span>' +
      '<span class="chev">' + ic('right', 15) + '</span></button>';
    h += '<button class="row" data-act="open-about"><span class="ri">' + ic('help', 15) + '</span>' +
      '<span class="rt"><b>关于文匠</b><small>版本 ' + (state.version || 'v2.0') + '</small></span>' +
      '<span class="chev">' + ic('right', 15) + '</span></button>';
    h += '<button class="row" data-act="clear-all"><span class="ri" style="color:var(--danger)">' + ic('trash', 15) + '</span>' +
      '<span class="rt"><b style="color:var(--danger)">清除本机数据</b><small>作品、额度、配置全部重置</small></span></button>';
    h += '</div></div>';

    h += '<div class="ver">WENJIANG ' + (state.version || 'v2.0') + ' · 本地优先</div>';
    h += '</div>';
    return h;
  }

  function rowLike(icon, title, value, act, key, hasChev, on) {
    return '<div class="row"><span class="ri">' + ic(icon, 15) + '</span>' +
      '<span class="rt"><b>' + title + '</b></span>' +
      (act === 'toggle'
        ? '<button class="sw' + (on ? ' on' : '') + '" data-act="toggle" data-key="' + key + '"></button>'
        : '<span class="rv">' + value + '</span>' + (hasChev ? '<span class="chev">' + ic('right', 15) + '</span>' : '')) +
      '</div>';
  }

  return {
    ic: ic, esc: esc, fmtHot: fmtHot, fmtTime: fmtTime, ago: ago,
    brand: brand, quotaPill: quotaPill, sourceName: sourceName, catOf: catOf,
    styleName: styleName, strengthName: strengthName,
    home: home, rank: rank, compose: compose, result: result, works: works, me: me,
    emptyState: emptyState, liveBadge: liveBadge
  };
})();

</script>
<script>
/* assets/js/app.js */
/* ============================================================
   文匠 AI — 应用层：状态、路由、事件、生成流程
   ============================================================ */
(function () {
  'use strict';

  var D = window.WJData, E = window.WJEngine, L = window.WJLive, U = window.WJUI;

  var VERSION = 'v2.2.1';
  var DAILY = 20;
  var KEY = 'wj.v2';

  var app = document.getElementById('app');
  var topbar = document.getElementById('topbar');
  var viewHost = document.getElementById('viewHost');
  var dockHost = document.getElementById('dockHost');
  var navEl = document.getElementById('nav');
  var fabEl = document.getElementById('fab');
  var layerEl = document.getElementById('layer');
  var toastEl = document.getElementById('toast');

  var viewEl = null;

  var state = {
    route: 'home',
    theme: 'auto',
    version: VERSION,
    quota: { used: 0, total: DAILY, day: dayKey() },
    works: [],
    settings: {
      base: '', key: '', model: '', imageModel: '',
      providers: [], activeId: '',
      models: [], defaultStyle: 'news', deai: true, faithful: true, declare: true
    },
    hot: { bySrc: {}, active: 'weibo', loading: false, updatedAt: 0, okCount: 0 },
    compose: {
      mode: 'link', link1: '', text1: '', text2: '',
      style: 'news', strength: 2, platform: 'toutiao',
      extra: '', deai: true, faithful: true, adv: false, sourceTitle: '', sourceUrl: ''
    },
    result: null,
    resultTab: 'body',
    genLoading: false,
    genStep: 0,
    genNote: '',
    imgLoading: false,
    busy: false
  };

  function dayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }

  /* ---------------- 持久化 ---------------- */

  function load() {
    try {
      var raw = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (!raw) return;
      if (raw.theme) state.theme = raw.theme;
      if (raw.quota) state.quota = raw.quota;
      if (raw.works) state.works = raw.works;
      if (raw.settings) Object.assign(state.settings, raw.settings);
      if (raw.compose) {
        Object.assign(state.compose, raw.compose);
        state.compose.link1 = '';
        state.compose.text1 = '';
        state.compose.text2 = '';
        state.compose.mode = state.compose.mode || 'link';
      }
    } catch (e) { /* ignore */ }
    if (state.quota.day !== dayKey()) {
      state.quota = { used: 0, total: DAILY, day: dayKey() };
    }
    state.compose.style = state.compose.style || state.settings.defaultStyle || 'news';
    migrateProviders();
  }

  /* ---------------- 多服务商 ---------------- */

  function uid() {
    return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  }

  /* 老版本只有一组 base/key/model，升上来时包成一个服务商 */
  function migrateProviders() {
    var s = state.settings;
    if (!Array.isArray(s.providers)) s.providers = [];
    if (!s.providers.length && (s.base || s.key || s.model)) {
      s.providers.push({
        id: uid(),
        name: hostName(s.base) || '我的服务商',
        base: s.base || '',
        key: s.key || '',
        models: s.models || [],
        model: s.model || '',
        imageModel: s.imageModel || '',
        at: Date.now()
      });
    }
    var ps = s.providers;
    if (!s.activeId || !ps.some(function (p) { return p.id === s.activeId; })) {
      s.activeId = ps.length ? ps[0].id : '';
    }
    /* 老的字段留空，避免两套配置打架 */
    s.base = ''; s.key = ''; s.model = ''; s.imageModel = '';
  }

  function hostName(base) {
    try { return new URL(/^https?:/.test(base) ? base : 'https://' + base).hostname.replace(/^www\./, ''); }
    catch (e) { return ''; }
  }

  function providers() {
    if (!Array.isArray(state.settings.providers)) state.settings.providers = [];
    return state.settings.providers;
  }

  function activeProvider() {
    var ps = providers();
    if (!ps.length) return null;
    for (var i = 0; i < ps.length; i++) if (ps[i].id === state.settings.activeId) return ps[i];
    return ps[0];
  }

  function providerById(id) {
    var ps = providers();
    for (var i = 0; i < ps.length; i++) if (ps[i].id === id) return ps[i];
    return null;
  }

  /* 调用顺序：默认服务商优先，其余按添加顺序排队当备用 */
  function providerChain(kind) {
    var act = activeProvider();
    return providers().filter(function (p) {
      if (!p.base || !p.key) return false;
      return kind === 'image' ? !!p.imageModel : !!p.model;
    }).sort(function (a, b) {
      return (b === act ? 1 : 0) - (a === act ? 1 : 0);
    });
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        theme: state.theme,
        quota: state.quota,
        works: state.works.slice(0, 60),
        settings: state.settings,
        compose: {
          mode: state.compose.mode,
          style: state.compose.style,
          strength: state.compose.strength,
          platform: state.compose.platform,
          deai: state.compose.deai,
          faithful: state.compose.faithful
        }
      }));
    } catch (e) { /* ignore */ }
  }

  /* ---------------- 工具 ---------------- */

  function toast(msg, ms) {
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toastEl.classList.remove('on'); }, ms || 2200);
  }

  function buzz(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms || 8); } catch (e) { /* ignore */ }
  }

  function wait(ms) {
    return new Promise(function (r) { setTimeout(r, ms); });
  }

  async function copy(text, tip) {
    try {
      await navigator.clipboard.writeText(text);
      toast(tip || '已复制');
      buzz(10);
    } catch (e) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); toast(tip || '已复制'); } catch (e2) { toast('复制失败，请长按选中'); }
      document.body.removeChild(ta);
    }
  }

  function esc(s) { return U.esc(s); }

  function remaining() { return Math.max(0, state.quota.total - state.quota.used); }

  function platformName(k) {
    for (var i = 0; i < D.PLATFORMS.length; i++) if (D.PLATFORMS[i].key === k) return D.PLATFORMS[i].name;
    return '';
  }

  /* ---------------- 路由 ---------------- */

  var TITLES = { home: '', rank: '热榜', compose: '新建', result: '成稿', works: '作品库', me: '我的' };
  var NAV_ROUTES = ['home', 'rank', 'works', 'me'];
  var TAB_OF = { home: 'home', rank: 'rank', works: 'works', me: 'me' };

  function go(route, opts) {
    opts = opts || {};
    if (route === 'compose' && opts.mode) {
      state.compose.mode = opts.mode;
    }
    /* 已经在这个标签页了：再点一次就是回顶部，别整页重画 */
    if (route === state.route && !opts.fromHistory && NAV_ROUTES.indexOf(route) > -1 && opts.nav === 'tab') {
      scrollMem[route] = 0;
      if (viewEl) {
        try { viewEl.scrollTo({ top: 0, behavior: 'smooth' }); }
        catch (e) { viewEl.scrollTop = 0; }
      }
      return;
    }
    var dir = opts.nav || (NAV_ROUTES.indexOf(route) > -1 ? 'tab' : 'push');
    if (dir === 'push' && NAV_ROUTES.indexOf(state.route) === -1 && route === 'result') dir = 'push';
    state.route = route;
    render(dir);
    if (opts.replace) history.replaceState({ r: route }, '', '#' + route);
    else history.pushState({ r: route }, '', '#' + route);
  }

  function back() {
    if (window.history.length > 1) history.back();
    else go('home', { nav: 'pop' });
  }

  var scrollMem = { home: 0, rank: 0, works: 0, me: 0 };
  var hscrollMem = {};
  var lastRoute = 'home';

  function render(navDir) {
    var route = state.route;

    /* 记住上一个页面的滚动位置：切标签页、切热榜源都不该把人弹回顶部 */
    var prevRoute = lastRoute;
    var prevTop = viewEl ? viewEl.scrollTop : 0;
    if (viewEl && scrollMem.hasOwnProperty(prevRoute)) scrollMem[prevRoute] = prevTop;
    if (viewEl) {
      var hs0 = viewEl.querySelector('.hscroll');
      if (hs0) hscrollMem[prevRoute] = hs0.scrollLeft;
    }

    var html = '';

    if (state.genLoading) {
      html = loadingHtml();
    } else if (route === 'home') html = U.home(state);
    else if (route === 'rank') html = U.rank(state);
    else if (route === 'compose') html = U.compose(state);
    else if (route === 'result') html = U.result(state);
    else if (route === 'works') html = U.works(state);
    else html = U.me(state);

    var dockHtml = '';
    var idx = html.lastIndexOf('<div class="dock">');
    if (idx > -1) {
      dockHtml = html.slice(idx);
      html = html.slice(0, idx);
    }

    /* 顶栏 */
    topbar.innerHTML = topbarHtml(route);
    topbar.classList.toggle('solid', false);

    /* 视图 */
    viewHost.innerHTML = '<div class="view" id="view"></div>';
    viewEl = document.getElementById('view');
    viewEl.className = 'view ' + (state.genLoading ? 'is-root' :
      navDir === 'push' ? 'is-push' : navDir === 'pop' ? 'is-pop' :
        navDir === 'same' ? 'is-same' : 'is-tab');
    viewEl.innerHTML = html;

    /* 同页重渲染（换热榜源、刷新）原地不动；换标签页回到该页上次的位置 */
    var keep = 0;
    if (navDir === 'same' || (navDir === 'tab' && prevRoute === route)) keep = prevTop;
    else if (navDir === 'tab' || navDir === 'pop') keep = scrollMem[route] || 0;
    viewEl.scrollTop = keep;
    topbar.classList.toggle('solid', keep > 6);
    var hs1 = viewEl.querySelector('.hscroll');
    if (hs1 && hscrollMem[route]) hs1.scrollLeft = hscrollMem[route];
    if (keep) {
      requestAnimationFrame(function () {
        if (!viewEl) return;
        viewEl.scrollTop = keep;
        var hs2 = viewEl.querySelector('.hscroll');
        if (hs2 && hscrollMem[route]) hs2.scrollLeft = hscrollMem[route];
      });
    }
    lastRoute = route;
    viewEl.addEventListener('scroll', onScroll, { passive: true });

    /* 底部 */
    dockHost.innerHTML = dockHtml;
    app.classList.toggle('has-dock', !!dockHtml.trim());
    var showChrome = !state.genLoading && NAV_ROUTES.indexOf(route) > -1;
    navEl.classList.toggle('hide', !showChrome);
    fabEl.classList.toggle('hide', !showChrome);
    navEl.innerHTML = navHtml();
    fabEl.innerHTML = U.ic('plus', 24, 2);
    fabEl.setAttribute('data-act', 'fab');

    syncSegs();
    animateScore();
    syncCounters();
    autosize();
  }

  function topbarHtml(route) {
    var left = '', right = '';
    if (route === 'home') {
      left = U.brand();
      right = '<button class="iconbtn" data-act="hot-reload">' + U.ic('refresh', 17) + '</button>';
    } else if (route === 'compose' || route === 'result') {
      left = '<button class="iconbtn" data-act="back">' + U.ic('left', 18) + '</button>' +
        '<h1 class="static">' + (route === 'compose' ? '新建' : '成稿') + '</h1>';
      right = route === 'compose'
        ? U.quotaPill(state)
        : '<button class="iconbtn" data-act="more">' + U.ic('more', 17) + '</button>';
    } else {
      left = '<h1>' + (TITLES[route] || '') + '</h1>';
      if (route === 'rank') right = '<button class="iconbtn" data-act="hot-reload">' + U.ic('refresh', 17) + '</button>';
      if (route === 'works') right = '<span class="sec-sub">' + state.works.length + ' 篇</span>';
    }
    return left + '<div class="spacer"></div>' + right;
  }

  function navHtml() {
    var items = [
      { k: 'home', i: 'home', t: '首页' },
      { k: 'rank', i: 'fire', t: '热榜' },
      null,
      { k: 'works', i: 'folder', t: '作品' },
      { k: 'me', i: 'user', t: '我的' }
    ];
    return items.map(function (it) {
      if (!it) return '<span></span>';
      var on = state.route === it.k;
      return '<button class="' + (on ? 'on' : '') + '" data-act="tab" data-tab="' + it.k + '">' +
        U.ic(it.i, 21, on ? 1.9 : 1.6) + '<span>' + it.t + '</span></button>';
    }).join('');
  }

  function onScroll() {
    if (!viewEl) return;
    topbar.classList.toggle('solid', viewEl.scrollTop > 6);
  }

  function syncSegs() {
    var segs = document.querySelectorAll('.seg');
    for (var i = 0; i < segs.length; i++) {
      (function (seg) {
        var on = seg.querySelector('button.on');
        var th = seg.querySelector('.thumb');
        if (!on || !th) return;
        th.style.width = on.offsetWidth + 'px';
        th.style.transform = 'translateX(' + (on.offsetLeft - 3) + 'px)';
      })(segs[i]);
    }
  }

  function animateScore() {
    var ring = document.querySelector('.ring .fgc');
    if (!ring) return;
    var score = Number(ring.dataset.score) || 0;
    var C = 2 * Math.PI * 27;
    var val = document.querySelector('.ring .val');
    var id = state.result && state.result.id;
    var instant = state.animatedFor === id;

    if (instant) {
      ring.style.transition = 'none';
      ring.style.strokeDashoffset = String(C * (1 - score / 100));
      if (val) val.textContent = score;
      return;
    }
    state.animatedFor = id;
    requestAnimationFrame(function () {
      setTimeout(function () {
        ring.style.strokeDashoffset = String(C * (1 - score / 100));
        if (val) countTo(val, score, 900);
      }, 80);
    });
  }

  function countTo(el, target, ms) {
    var t0 = performance.now();
    function step(t) {
      var p = Math.min(1, (t - t0) / ms);
      var e = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(target * e);
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function autosize() {
    var tas = document.querySelectorAll('.field textarea');
    for (var i = 0; i < tas.length; i++) {
      (function (ta) {
        ta.style.height = 'auto';
        var h = Math.min(340, Math.max(72, ta.scrollHeight + 4));
        ta.style.height = h + 'px';
      })(tas[i]);
    }
  }

  function syncCounters() {
    var ta = document.querySelector("[data-field='text1']");
    var c1 = document.querySelector("[data-cnt='text1']");
    if (ta && c1) c1.textContent = ta.value.trim().length;
  }

  /* ---------------- 加载态 ---------------- */

  var STEPS = ['读取素材', '拆句与关键词', '结构重组', '语体适配', '原创度自检'];

  function loadingHtml() {
    var h = '<div class="screen">';
    h += '<div style="padding-top:12px"><div class="eyebrow">Crafting</div>' +
      '<h1 class="h1" id="genNote" style="font-size:26px">' + (state.genNote || '正在写') + '</h1></div>';
    h += '<div class="card mt-l"><div class="steps">' + STEPS.map(function (s, i) {
      return '<div class="step" data-step="' + i + '"><span class="si">' + U.ic('check', 11, 2.4) + '</span>' + s + '</div>';
    }).join('') + '</div></div>';
    h += '<div class="mt-l">' +
      '<div class="sk" style="width:92%;height:14px;margin-bottom:14px"></div>' +
      '<div class="sk" style="width:78%;height:14px;margin-bottom:14px"></div>' +
      '<div class="sk" style="width:86%;height:14px;margin-bottom:14px"></div>' +
      '<div class="sk" style="width:64%;height:14px"></div></div>';
    h += '</div>';
    return h;
  }

  function setStep(n) {
    state.genStep = n;
    var list = document.querySelectorAll('.step');
    for (var i = 0; i < list.length; i++) {
      list[i].classList.toggle('done', i < n);
      list[i].classList.toggle('on', i === n);
    }
  }

  /* ---------------- 热榜 ---------------- */

  async function loadHot(srcId) {
    var id = srcId || state.hot.active;
    var existed = state.hot.bySrc[id] && state.hot.bySrc[id].items && state.hot.bySrc[id].items.length;
    /* 已经有数据就别切成骨架屏，否则列表高度塌了，滚动位置会被夹回去 */
    state.hot.loading = !existed;
    if (state.route === 'home' || state.route === 'rank') render('same');
    var r;
    try {
      r = await L.hot(srcId || state.hot.active);
    } catch (e) {
      r = {};
      r[srcId || state.hot.active] = { ok: false, items: [], error: e.message };
    }
    Object.keys(r).forEach(function (k) { state.hot.bySrc[k] = r[k]; });
    recalcHot();
    state.hot.loading = false;
    var act = state.hot.bySrc[state.hot.active];
    if (!act || !act.ok || !act.items.length) {
      var best = pickBestSource();
      if (best) state.hot.active = best;
    }
    if (state.route === 'home' || state.route === 'rank') render('same');
  }

  function recalcHot() {
    var n = 0, latest = 0;
    Object.keys(state.hot.bySrc).forEach(function (k) {
      var s = state.hot.bySrc[k];
      if (s && s.ok && s.items && s.items.length) { n++; if (s.at > latest) latest = s.at; }
    });
    state.hot.okCount = n;
    if (latest) state.hot.updatedAt = latest;
  }

  var renderTimer = null;
  function softRender() {
    if (state.route !== 'home' && state.route !== 'rank') return;
    clearTimeout(renderTimer);
    renderTimer = setTimeout(function () { render('same'); }, 160);
  }

  async function loadAllHot() {
    state.hot.loading = true;
    softRender();
    var ids = L.SOURCES.map(function (s) { return s.id; });
    await Promise.all(ids.map(async function (id) {
      var cur = state.hot.bySrc[id];
      if (cur && cur.ok && cur.items && cur.items.length) return;
      try {
        var r = await L.hot(id);
        if (r && r[id]) state.hot.bySrc[id] = r[id];
      } catch (e) { /* ignore */ }
      var act = state.hot.bySrc[state.hot.active];
      if (!act || !act.ok || !act.items || !act.items.length) {
        var best = pickBestSource();
        if (best) state.hot.active = best;
      }
      recalcHot();
      softRender();
    }));
    state.hot.loading = false;
    recalcHot();
    /* 全部拉完后，切回优先级最高的可用源，避免默认落在 B 站这类娱乐榜 */
    var best = pickBestSource();
    if (best) state.hot.active = best;
    if (state.route === 'home' || state.route === 'rank') render('same');
  }

  function pickBestSource() {
    var order = ['weibo', 'zhihu', 'toutiao', 'baidu', 'douyin', 'bilibili'];
    for (var i = 0; i < order.length; i++) {
      var s = state.hot.bySrc[order[i]];
      if (s && s.ok && s.items && s.items.length) return order[i];
    }
    return '';
  }

  /* ---------------- 生成 ---------------- */

  function validate() {
    var c = state.compose;
    if (c.mode === 'link') {
      if (!/https?:\/\//.test(c.link1.trim())) { toast('先粘一条以 http 开头的链接'); return false; }
      return true;
    }
    if (c.mode === 'text') {
      if (c.text1.trim().length < 30) { toast('还差一点，至少 30 字'); return false; }
      return true;
    }
    if (c.text1.trim().length < 30 || c.text2.trim().length < 30) {
      toast('两篇素材各需要至少 30 字');
      return false;
    }
    return true;
  }

  async function resolveSource() {
    var c = state.compose;
    if (c.mode === 'link' && c.link1.trim().length < 240) {
      var r = await L.parseLink(c.link1, function (label, i, n) {
        state.genNote = '正在取正文 · ' + label + '（' + i + '/' + n + '）';
        var el = document.getElementById('genNote');
        if (el) el.textContent = state.genNote;
      });
      if (r.title) state.compose.sourceTitle = r.title;
      state.compose.sourceUrl = c.link1.trim();
      return r.text;
    }
    if (c.mode === 'merge') {
      return c.text1.trim() + '\n\n' + c.text2.trim();
    }
    return c.text1.trim();
  }

  function aiPrompt(src, c) {
    var style = U.styleName(c.style);
    var plat = platformName(c.platform);
    var strength = c.strength === 1 ? '轻度：保留原结构与观点，只替换表达'
      : c.strength === 2 ? '中度：重组句式与段落，替换措辞，保留全部事实'
        : '深度：重排逻辑与叙述顺序，换叙述视角，但不得新增或篡改事实';
    var sys = '你是一位资深中文内容编辑，擅长把素材改写成可直接发布的成稿。只输出 JSON，不要任何解释。';
    var user = '请把下面的素材改写成【' + style + '】，发布到【' + plat + '】。\n' +
      '改写强度：' + strength + '。\n' +
      (c.deai ? '风格要求：去掉 AI 腔（避免"首先/其次/综上所述/赋能/闭环/值得注意的是"），句子长短交错，允许口语。\n' : '') +
      (c.faithful ? '硬性要求：数字、人名、机构名、直接引语必须与原文一致，不得编造。\n' : '') +
      (c.extra ? '额外要求：' + c.extra + '\n' : '') +
      '输出 JSON：{"title":"主标题","titles":["备选1","备选2","备选3"],"body":"正文，用\\n\\n分段，小标题前加## "}\n' +
      '正文长度 600-1200 字。\n\n素材：\n' + src.slice(0, 6000);
    return [{ role: 'system', content: sys }, { role: 'user', content: user }];
  }

  function parseAI(text) {
    var t = String(text).trim();
    var m = t.match(/\{[\s\S]*\}/);
    if (m) {
      try {
        var o = JSON.parse(m[0]);
        if (o && o.body) {
          return {
            title: String(o.title || '').trim(),
            titles: Array.isArray(o.titles) ? o.titles.map(String) : [],
            body: String(o.body)
          };
        }
      } catch (e) { /* fallthrough */ }
    }
    var lines = t.split('\n').filter(Boolean);
    return { title: (lines[0] || '').replace(/^#+\s*/, '').slice(0, 40), titles: [], body: t };
  }

  async function build(src) {
    var c = state.compose;
    var chain = providerChain('chat');

    if (chain.length) {
      state.genNote = chain.length > 1 ? '模型正在写（' + chain.length + ' 家待命）' : '模型正在写';
      setStep(2);
      try {
        var res = await L.chatChain(chain, aiPrompt(src, c));
        if (res.switched) toast('默认服务商没响应，已自动切到 ' + (res.provider.name || '备用'), 3000);
        var txt = res.text;
        var o = parseAI(txt);
        var body = o.body;
        var titles = (o.titles || []).filter(Boolean).slice(0, 4);
        var title = o.title || titles[0] || '未命名';
        if (titles.indexOf(title) === -1) titles.unshift(title);
        var simA = Math.round(E.similarity(src, body) * 100);
        return {
          title: title,
          titles: titles.slice(0, 4),
          body: body,
          source: src,
          sourceTitle: state.compose.sourceTitle,
          words: E.countWords(body),
          sim: simA,
          dupes: 0,
          score: Math.max(35, Math.min(96, 100 - simA)),
          styleKey: c.style,
          styleName: U.styleName(c.style),
          platformName: platformName(c.platform),
          modelName: (res.provider.name ? res.provider.name + ' · ' : '') + res.model,
          at: Date.now()
        };
      } catch (e) {
        /* 都调不通就退回本机引擎，而不是把人卡在报错页 */
        toast('模型都没调通，已用本机引擎', 3000);
        if (e && e.detail) state.genNote = '模型失败，改用本机引擎';
      }
    }

    state.genNote = '本机引擎正在写';
    var r = E.rewrite(src, {
      style: c.style,
      strength: c.strength,
      platform: c.platform,
      cat: '',
      variant: Math.floor(Math.random() * 9),
      sourceTitle: state.compose.sourceTitle || ''
    });
    return {
      title: r.title,
      titles: r.titles,
      body: r.body,
      source: src,
      sourceTitle: state.compose.sourceTitle,
      words: r.words,
      sim: r.sim,
      dupes: r.dupes,
      score: r.score,
      styleKey: c.style,
      styleName: U.styleName(c.style),
      platformName: platformName(c.platform),
      modelName: '本机引擎',
      at: Date.now()
    };
  }

  async function runGenerate(variant) {
    if (state.busy) return;
    if (!validate()) return;
    if (remaining() <= 0) { openQuotaSheet(); return; }

    state.busy = true;
    state.resultTab = 'body';
    state.genLoading = true;
    state.genStep = 0;
    state.genNote = state.compose.mode === 'link' ? '正在读链接' : '正在读素材';
    state.route = 'result';
    render('push');
    try { history.pushState({ r: 'result' }, '', '#result'); } catch (e) { /* ignore */ }
    buzz(12);

    var src = '';
    try {
      if (state.compose.mode === 'link') setStep(0);
      src = variant && state.result ? (state.result.source || '') : '';
      if (!src) src = await resolveSource();
    } catch (e) {
      state.genLoading = false;
      state.route = 'compose';
      render('pop');
      openParseFail(e);
      state.busy = false;
      return;
    }

    if (src.trim().length < 40) {
      state.genLoading = false;
      state.route = 'compose';
      render('pop');
      toast('素材太短了，再多给一点');
      state.busy = false;
      return;
    }

    var t0 = Date.now();
    for (var i = 1; i <= 3; i++) {
      await wait(300);
      setStep(i);
    }

    var out;
    try {
      out = await build(src);
    } catch (e) {
      state.genLoading = false;
      state.route = 'compose';
      render('pop');
      toast('模型调用失败：' + (e.message || '') + '（已保留本机引擎）');
      state.busy = false;
      return;
    }

    setStep(4);
    await wait(Math.max(0, 1600 - (Date.now() - t0)));

    out.id = 'w' + Date.now();
    out.at = Date.now();
    /* 记住原文地址：配图页要用它去取原文里的真实图片 */
    out.url = String(
      (state.compose.mode === 'link' ? state.compose.link1 : '') ||
      state.compose.sourceUrl || ''
    ).trim();
    state.result = out;
    state.genLoading = false;
    state.quota.used += 1;
    state.works.unshift({
      id: out.id, title: out.title, words: out.words, score: out.score,
      styleName: out.styleName, platformName: out.platformName, at: out.at, data: out
    });
    state.works = state.works.slice(0, 60);
    save();
    render('push');
    state.busy = false;
    buzz(16);
  }

  function bindDrag() {
    var sheet = layerEl.querySelector('.sheet');
    if (!sheet) return;
    var startY = 0, dy = 0, dragging = false;
    sheet.addEventListener('touchstart', function (e) {
      if (e.target.closest('.sheet-body') && layerEl.querySelector('.sheet-body').scrollTop > 0) return;
      dragging = true;
      startY = e.touches[0].clientY;
      dy = 0;
      layerEl.classList.add('drag');
    }, { passive: true });
    sheet.addEventListener('touchmove', function (e) {
      if (!dragging) return;
      dy = Math.max(0, e.touches[0].clientY - startY);
      sheet.style.transform = 'translate3d(0,' + dy + 'px,0)';
    }, { passive: true });
    sheet.addEventListener('touchend', function () {
      if (!dragging) return;
      dragging = false;
      layerEl.classList.remove('drag');
      sheet.style.transform = '';
      if (dy > 90) closeSheet();
    });
  }

  function fmtPublished(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    var pad = function (n) { return ('0' + n).slice(-2); };
    var hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
    var md = (d.getMonth() + 1) + '月' + d.getDate() + '日';
    var diff = Date.now() - d.getTime();
    if (diff >= 0 && diff < 864e5) return '今天 ' + hm;
    if (diff >= 864e5 && diff < 1728e5) return '昨天 ' + hm;
    if (d.getFullYear() === new Date().getFullYear()) return md + ' ' + hm;
    return d.getFullYear() + '年' + md;
  }

  function paintCover(head, srcId) {
    var slot = document.getElementById('hotCover');
    if (!slot) return;
    var ph = function () { slot.innerHTML = coverPlaceholder(srcId, '原文没有可用的头图'); };
    if (!head) return ph();
    var probe = new Image();
    probe.onload = function () {
      /* 不少站点的 og:image 指向 1px 占位图，尺寸不够宁可不显示 */
      if (probe.naturalWidth < 400 || probe.naturalHeight < 200) return ph();
      slot.innerHTML = '<div class="hot-cover"><img src="' + esc(head) + '" alt="" loading="lazy"></div>';
    };
    probe.onerror = ph;
    probe.src = head;
  }

  function fillHotMeta(url, srcId, it, cat) {

    L.meta(url, srcId).then(function (m) {

      if (!m || (!m.head && !m.category && !m.published)) {
        /* 取不到就当没有，但标签照旧显示，别留一片空白 */
        paintCover('', srcId);

      var when = m.published ? ('发布 ' + fmtPublished(m.published)) : (stamp ? ('上榜 ' + stamp) : '');
      var meta = [m.site, m.author].filter(Boolean).join(' · ');
      box2.innerHTML = metaChips(m.category || cat, when, it.hot, meta ? metaChip(meta) : '') +
        (m.desc ? '<p style="margin:9px 0 0;font-size:13px;line-height:1.7;color:var(--ink-2)">' + esc(m.desc) + '</p>' : '');

  async function fetchModels() {
    var st = document.getElementById('modelStatus');
    var list = document.getElementById('modelList');
    if (!draft) return;
    readProviderForm();
    if (!draft.base) { toast('先填 Base URL'); return; }
    if (st) st.textContent = '正在请求 /models …';
    if (list) list.innerHTML = '<div class="sk" style="height:44px;margin-bottom:8px"></div><div class="sk" style="height:44px;margin-bottom:8px"></div><div class="sk" style="height:44px"></div>';
    try {
      var models = await L.listModels({ base: draft.base, key: draft.key });
      draft.models = models;
      if (st) st.innerHTML = '拿到 <b style="color:var(--acc)">' + models.length + '</b> 个模型，点一个选中';
      if (list) list.innerHTML = modelListHtml();
      var chat = models.filter(function (m) { return m.kind === 'chat'; });
      if (chat.length && !draft.model) {
        draft.model = chat[0].id;
        if (list) list.innerHTML = modelListHtml();
      }
      var imgs = models.filter(function (m) { return m.kind === 'image'; });
      if (imgs.length && !draft.imageModel) {
        draft.imageModel = imgs[0].id;
        if (list) list.innerHTML = modelListHtml();

      if (!draft.name) {
        var inp = document.querySelector("[data-mfield='name']");

      if (st) st.innerHTML = '<span style="color:var(--danger)">获取失败：' + esc(e.message || '') + '</span>';
      if (list) list.innerHTML = '<div class="note warn">' + U.ic('alert', 14) +
        '<div>检查 Base URL 是否带 <b>/v1</b>、Key 是否正确，以及这个服务商是否允许浏览器跨域访问。</div></div>';
    }
  }

  function readProviderForm() {
    if (!draft) return;
    var get = function (f) {
      var el = document.querySelector("[data-mfield='" + f + "']");
      return el ? String(el.value || '').trim() : '';
    };
    draft.name = get('name');
    draft.base = get('base');
    var k = document.querySelector("[data-mfield='key']");
    if (k) draft.key = String(k.value || '').trim();
    var mm = document.querySelector("[data-mfield='model']");
    if (mm && String(mm.value || '').trim()) draft.model = String(mm.value).trim();
    if (!draft.name && draft.base) draft.name = hostName(draft.base);
  }

  function saveProvider() {
    readProviderForm();
    if (!draft.base) { toast('先填 Base URL'); return; }
    var ps = providers();
    var i = -1;
    for (var j = 0; j < ps.length; j++) if (ps[j].id === draft.id) i = j;
    var rec = {
      id: draft.id,
      name: draft.name || hostName(draft.base) || '服务商',
      base: draft.base,
      key: draft.key,
      model: draft.model,
      imageModel: draft.imageModel,
      models: draft.models || [],
      at: Date.now()
    };
    if (i > -1) ps[i] = rec;
    else ps.push(rec);
    if (!state.settings.activeId) state.settings.activeId = rec.id;
    save();
    toast(i > -1 ? '已更新' : '已添加 ' + rec.name, 2400);
    openModelSheet();
    render('same');
  }

  async function runParseTest(list) {
    var box = document.getElementById('parse-test');
    if (!box) return [];
    box.innerHTML = '<div style="width:100%" class="sec-sub">正在检测…</div>';
    var rows = await L.checkBases(list);
    rows.sort(function (a, b) { return (b.ok ? 1 : 0) - (a.ok ? 1 : 0) || a.ms - b.ms; });
    box.innerHTML = '<div style="width:100%">' + parseTestHtml(rows) + '</div>';
    return rows;
  }

  var lastFail = null;

  function openParseFail(err) {
    var d = String((err && err.detail) || '');

    lastFail = err && err.url ? { url: err.url, title: err.title || '' } : null;

    var why = offline
      ? '解析服务这会在重启或暂时连不上（免费沙盒实例每隔一阵会重启一次），公共代理在手机网络上基本不通。' +
        '可以直接点下面的<b>再试一次</b>；要长期稳定，去<b>我的 → 解析服务</b>按说明部署自己的 Worker，地址填进去就一劳永逸。'
      : '常见原因：公众号对非微信环境的抓取有限制、正文由脚本动态渲染、或者站点对抓取有风控。' +
        '可以点<b>再试一次</b>，或到<b>我的 → 解析服务</b>点一次「只检测不保存」看哪条通道在线。';

    var detail = d ? '<div class="sec-sub" style="margin-top:10px;word-break:break-all;line-height:1.8;white-space:pre-line">' + esc(d) + '</div>' : '';

    openSheet(
      '<p>' + esc((err && err.message) || '解析失败') + '</p>' +
      '<div class="note mt-s">' + U.ic('info', 14) + '<div>' + why + '</div></div>' + detail,
      {
        title: '这个链接没解析成功',
        foot: (lastFail
          ? '<button class="btn btn-primary btn-block" data-act="retry-parse">' + U.ic('refresh', 16) + ' 再试一次</button>'
          : '') +
          (err && err.url
            ? '<button class="btn btn-soft btn-block" data-act="copy" data-text="' + esc(err.url) + '">' + U.ic('copy', 15) + ' 复制链接</button>' +
              '<button class="btn btn-soft btn-block" data-act="open-url" data-url="' + esc(err.url) + '">' + U.ic('external', 15) + ' 用浏览器打开</button>'
            : '') +
          '<button class="btn btn-ghost btn-block" data-act="to-text">改成粘贴全文（照样能改写）</button>'
      }
    );
  }

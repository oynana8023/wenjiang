      else if (want >= 1200 && nDot < 6) issues.push('分点偏少：' + nDot + ' 条，' + want + ' 字的笔记至少要 6 条');
      if (!/#[^\s#]{1,12}/.test(body)) issues.push('缺少话题标签');
    }
    if (key === 'douyin') {
      var longs = splitSentences(body).filter(function (s) {
        return s.replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g, '').length > 26;
      });
      if (longs.length) issues.push('有 ' + longs.length + ' 句超过 26 字，口播念不顺');
    }
    if (p.sub) {
      var n = (body.match(/^## /gm) || []).length;
      var need = want >= 2400 ? 4 : 3;
      if (n < Math.min(2, need - 1)) issues.push('小标题不足：需要 ' + need + ' 个左右的「## 」小标题');
      else if (want >= 2400 && n < 3) issues.push('小标题不足：' + want + ' 字的长稿要分成 3–5 节');
    }
    if (key === 'coolapk') {
      if (!/(槽点|缺点|不足|问题也)/.test(body)) issues.push('没有写槽点，酷安读者只信有缺点的体验');
      if (!/(谁该买|谁该关注|谁该看|适合谁|值不值|建议再等|可以冲)/.test(body)) issues.push('没有给「买不买」的明确建议');
    }
    if (key === 'bee') {
      if (!/(\d+\s*\/\s*10|打分|评分)/.test(body)) issues.push('没有给评分');
      if (!/[？?]/.test(body)) issues.push('结尾没有提问，社区接不下去');
    }
    if (key === 'zhihu' && !/(第一|其一|1[.、])/.test(body)) issues.push('论据没有分条');
    if (/(值得注意的是|综上所述|毋庸置疑|赋能|闭环|抓手)/.test(body)) issues.push('出现套话或 AI 腔');
    return { ok: issues.length === 0, issues: issues, len: len };
  }

  /* ---------- 句子手术 ----------
     本机引擎以前只做同义词替换，句子骨架还是原文的，所以读起来像
     「把别人的句子换了几个词」。这里补三件事：认出主语、连续同主语时
     换说法、长句断开短句合并。 */

  var SUBJ_HEAD = /^(这|那|它|他|她|我们|他们|目前|如今|现在|近日|昨天|今天|今年|去年|其中|同时|不过|但是|因此|所以|另外|此外)/;
  var SUBJ_RE = /^([^，。；：！？“”]{2,18}?)(?=在|于|将|把|已|正|向|对|与|和|宣布|发布|推出|上线|表示|认为|称|用|靠|能)/;

  function subjectOf(s) {
    var t = String(s).replace(/^[“”「」\s]+/, '');
    var m = t.match(SUBJ_RE);
    if (!m) return '';
    var sub = m[1].trim();
    if (sub.length < 2 || SUBJ_HEAD.test(sub)) return '';
    if (/[0-9]$/.test(sub) && sub.length < 3) return '';
    return sub;
  }

  /* 连续两句同一个主语时，第二句换个说法：代词 / 状语提前 / 省略 */
  function resaySubject(s, sub, k) {
    var at = s.indexOf(sub);
    if (at < 0) return s;
    var rest = s.slice(at + sub.length);
    var pron = /(公司|集团|平台|团队|机构|工厂|门店|品牌|企业|银行|医院|学校|实验室|工作室|政府|协会)$/.test(sub) ? '它' : '它';

    /* 状语提前：「在 Google Cloud Run 上独立部署了…」→「在 Google Cloud Run 上，它独立部署了…」 */
    var loc = rest.match(/^(在|于)([^，。]{2,22}?)(上|里|中|内|下|前|后|时)/);
    if (loc && k % 3 === 0) {
      var tail = rest.slice(loc[0].length);
      if (tail.length >= 6) return loc[1] + loc[2] + loc[3] + '，' + pron + tail;
    }
    if (/^(把|将)/.test(rest) && k % 3 === 1) return pron + rest;
    var conn = ['又', '还', '随后', '接着', '之后'][k % 5];
    var body = rest.replace(/^(在|于)/, '$1');
    return conn + body;
  }

  /* 长句断成两句，短句并成一句：节奏才不会一律 */
  function splitLong(s, rnd) {
    if (s.length <= 46) return [s];
    var best = -1;
    for (var i = 12; i < s.length - 14; i++) {
      if (s.charAt(i) !== '，') continue;
      if (Math.abs(i - s.length / 2) < Math.abs(best - s.length / 2)) best = i;
    }
    if (best < 0) return [s];
    var a = s.slice(0, best), b = s.slice(best + 1);
    if (/[指出表示认为称说介绍透露强调预计提到]$/.test(a)) return [s];
    /* 冒号后面是解释，切开前半句就悬空了：「算了笔账：/ 如果良率…」 */
    if (a.indexOf('：') > -1) return [s];
    /* 时间状语不能单独成句：「2024 年 6 月。」后面没谓语 */
    if (/\d+\s*[年月日号点时分]\s*$/.test(a)) return [s];
    if (/^(而|但|却|则|就|也|还|才|更|并|又|且|或|是)/.test(b)) return [s];
    return [a + '。', b];
  }

  function flow(list, ctx) {
    var out = [], prev = '', run = 0;
    list.forEach(function (raw) {
      var s = transform(raw, ctx);
      splitLong(s, ctx.rnd).forEach(function (piece) {
        if (piece.length < 4) return;
        var sub = subjectOf(piece);
        if (sub && prev && (sub === prev || sub.indexOf(prev) === 0 || prev.indexOf(sub) === 0)) {
          run++;
          piece = resaySubject(piece, sub, run);
        } else if (sub && prev !== sub) {
          run = 0;
        }
        if (sub) prev = sub;
        out.push(piece);
      });
    });
    return out;
  }

  function groupN(arr, n) {
    var out = [];
    for (var i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n));
    return out;
  }

  function judgeLine(a, t1, t2, seed) {
    var k2 = (t2 && t2 !== t1) ? t2 : '';
    var k = Math.abs(seed || 0) % 3;
    if (a.tone === 'positive') {
      return ['对' + t1 + '来说，这是一次实打实的抬升，不是又一次概念炒作。',
        '这一次' + t1 + '拿到的是订单和产能，不是又一场发布会。',
        '短期看是利好，长期还得看' + k2 + '能不能接住。'][k];
    }
    if (a.tone === 'negative') {
      return ['压力已经从' + t1 + '往上顶，' + k2 + '是第一个被挤压的环节。',
        '热闹是' + t1 + '的，代价最后还是要落到' + k2 + '上。',
        '这不是' + t1 + '一家的麻烦，' + k2 + '整条链路都得跟着调整。'][k];
    }
    if (!k2) {
      return ['这件事的关键不在表面，往下还有一层。',
        '把它放回时间线上看，变化才刚开始。',
        t1 + '只是结果，原因在别处。'][k];
    }
    return ['决定走向的不是' + t1 + '本身，而是' + k2 + '。',
      '把' + t1 + '和' + k2 + '放在一起看，事情才清楚。',
      t1 + '只是表面，真正的变量在' + k2 + '。'][k];
  }

  function endLine(a, t1, t2, mode) {
    var k2 = t2 || t1;
    if (mode === 'ask') return '你怎么看' + t1 + '这一步？';
    if (a.tone === 'negative') return t1 + '这关能不能过，要看' + k2 + '什么时候稳住。';
    if (a.tone === 'positive') return '接下来值得盯的是，' + t1 + '这股势头能不能撑过一个季度。';
    return t1 + '会往哪走，未来几个月' + k2 + '会给出答案。';
  }

  /* ---------- 褒贬切分 ----------
     酷安要「优点 / 槽点」、小蜜蜂要「锐评」，都得先知道哪句是在夸、
     哪句是在挑刺。素材本身两种句子都有，不编，只归类。 */
  var NEG_CUE = /(但|不过|问题|限制|风险|代价|压力|贵|慢|差|难|不足|缺点|争议|下滑|亏损|裁员|担心|挑战|门槛|并不|只有|仍然|挤压|内卷|退潮|故障|投诉)/;
  var POS_CUE = /(增长|提升|突破|领先|便宜|下降|改善|降低|提高|成功|机会|优势|利好|省下|加快|翻倍|卖爆|稳定|省)/;

  function polarity(s) {
    var n = (String(s).match(NEG_CUE) || []).length;
    var p = (String(s).match(POS_CUE) || []).length;
    if (n > p) return -1;
    if (p > n) return 1;
    return 0;
  }

  function splitPC(list) {
    var pos = [], neg = [], mid = [];
    list.forEach(function (s) {
      var v = polarity(s);
      if (v > 0) pos.push(s);
      else if (v < 0) neg.push(s);
      else mid.push(s);
    });
    return { pos: pos, neg: neg, mid: mid };
  }

  function briefOf(s, max) {
    var t = stripPunct(String(s));
    max = max || 26;
    if (t.length <= max) return t;
    var win = t.slice(0, max);
    /* 只在前 60% 之后找断点。断在句首那个逗号上，会把整句压成
       「更关键的是，一杯 9.9 元的拿铁。」这种没说完的废话。 */
    var at = -1;
    for (var i = win.length - 1; i >= Math.floor(max * 0.6); i--) {
      if (/[，、；]/.test(win.charAt(i))) { at = i; break; }
    }
    if (at > 0) return t.slice(0, at);
    var next = t.slice(max).search(/[，。；、]/);
    if (next > -1 && next < 26) return t.slice(0, max + next);
    /* 找不到像样的断点就整句留着，宁长不残 */
    return t;
  }

  /* 模型/引擎加的过渡词，摆在分点或小标题下面会很突兀，统一剥掉 */
  var LEAD_CONN = /^(更关键的是|从已披露的信息看|再往前一步|数字也能说明问题[：:]|实际看下来|但有一点得说清楚[：:]|另外一个细节是|这里要泼盆冷水[：:]|说到底|换句话说|再往下说|有意思的是|问题来了|你发现没有|更现实的一点是|但这里有个前提[：:]|然而|但|不过|可是)[，,：:]?/;

  function deLead(s) {
    return String(s || '').replace(LEAD_CONN, '');
  }

  function takeN(arr, n, fallback) {
    var out = arr.slice(0, n);
    if (out.length < n && fallback) {
      fallback.forEach(function (x) {
        if (out.length < n && out.indexOf(x) < 0) out.push(x);
      });
    }
    return out;
  }

  function uniqList(arr) {
    var out = [];
    (arr || []).forEach(function (x) { if (x && out.indexOf(x) < 0) out.push(x); });
    return out;
  }

  /* 一句值不值得留：数字、引语、因果、人物说话都加分。
     以前按位置取前几句，5000 字的长稿永远只用开头，后面的料全废。 */
  function infoScore(x) {
    var t = String(x || '');
    var sc = 0;
    if (/\d/.test(t)) sc += 2.4;
    if (/[“”「」]/.test(t)) sc += 1.6;
    if (/(因为|由于|导致|所以|结果|原因|意味着|来源|此前|随后|之后|最终)/.test(t)) sc += 1.5;
    if (/(表示|指出|称|说|认为|介绍|透露|回忆|解释|承认)/.test(t)) sc += 1.2;
    if (/(记者|创始人|负责人|经理|教授|主任|工程师|用户|居民|工人|员工)/.test(t)) sc += 1.2;
    if (t.length >= 18 && t.length <= 70) sc += 0.8;
    if (t.length < 10) sc -= 1.2;
    return sc;
  }

  /* 在一段里找连续 k 句、信息量最大的一块 */
  function densest(list, k) {
    if (!list.length) return [];
    if (k >= list.length) return list.slice();
    var best = -1e9, from = 0;
    for (var i = 0; i + k <= list.length; i++) {
      var sc = 0;
      for (var j = i; j < i + k; j++) sc += infoScore(list[j]);
      if (sc > best) { best = sc; from = i; }
    }
    return list.slice(from, from + k);
  }

  /* 按预算取料，同时保证覆盖全文：把句子切成分段，每段取最密的连续两三句。
     只挑「最精彩的几句」会把人物来历和因果挑断，读起来就成了「某某说过什么」，
     所以宁可每段连留两三句，也不隔句跳着摘。 */
  function takeBlocks(list, k) {
    if (!list || !list.length || k <= 0) return [];
    if (k >= list.length) return list.slice();
    var per = k >= 6 ? 3 : 2;
    var parts = Math.max(1, Math.round(k / per));
    var size = list.length / parts;
    var out = [];
    for (var i = 0; i < parts; i++) {
      var from = Math.floor(i * size);
      var to = (i === parts - 1) ? list.length : Math.floor((i + 1) * size);
      var seg = list.slice(from, to);
      if (!seg.length) continue;
      var take = Math.min(per, Math.max(1, Math.round(k / parts)));
      densest(seg, take).forEach(function (x) {
        if (out.indexOf(x) < 0) out.push(x);
      });
    }
    /* 还原成原文顺序，读者才不会觉得时间线被打乱 */
    out.sort(function (a, b) { return list.indexOf(a) - list.indexOf(b); });
    /* 「行业里的判断也在变。」这种总起句被摘到末尾，后面没有下文，读着像断了 */
    while (out.length > 1) {
      var last = stripPunct(out[out.length - 1]);
      if (infoScore(out[out.length - 1]) < 0.4 || (last.length < 16 && !/\d/.test(last))) out.pop();
      else break;
    }
    return out;
  }

  function buildBody(style, sents, kws, ctx, opts) {
    var a = ctx.analysis || analyze(sents.join(''), sents, kws);
    var plan = ctx.plan || planFor(a, opts, style);
    var plat = PLAT[(opts && opts.platform) || 'toutiao'] || PLAT.toutiao;
    var t1 = pickTopic(kws);
    var t2 = secondTopic(kws, t1);
    if (!t2 || t2 === t1) t2 = (kws[1] && kws[1] !== t1) ? kws[1] : (kws[2] || t1);
    /* 把整句标题当关键词，会拼出「把良率和一条光学模组产线的三年放在一起看」这种病句 */
    if (t2 && (t2.length > 10 || /[，。、；]/.test(t2))) t2 = '';
    /* 主角是人名时，「真正的变量在周建国」是病句 */
    var subj0 = subjectOf(sents[0] || '');
    if (t2 && subj0 && (t2 === subj0 || subj0.indexOf(t2) === 0 || t2.indexOf(subj0) > -1)) t2 = '';
    if (t2 && isPersonName(t2, sents.join(''))) t2 = '';
    var catTags = (D.TAG_BY_CAT[opts.cat] || []).slice(0, 2);
    var center = a.center || sents[0] || '';
    var seed = Math.abs(ctx.seed || 0);
    /* 目标字数换算成「写多少句、每句留多长」，所有结构共用 */
    var budget = plan.budget || Math.max(4, Math.round((plan.target || 700) / 52));
    var detailCap = plan.detail || 46;
    var written = [];

    var seenSent = {};
    /* 长稿里 0.52 太狠：「周建国说」开头的两句本来就像，但讲的是两件事。
       目标越长，阈值越松，只在几乎重复时才删。 */
    var dupTh = (plan.target || 0) > 1500 ? 0.74 : (plan.target || 0) > 800 ? 0.62 : 0.52;
    function dedupe(list) {
      var keep = [];
      list.forEach(function (x) {
        if (!x || seenSent[x]) return;
        var dup = false;
        for (var i = 0; i < written.length; i++) {
          if (similarity(x, written[i]) > dupTh) { dup = true; break; }
        }
        if (dup) return;
        seenSent[x] = 1;
        written.push(x);
        keep.push(x);
      });
      return keep;
    }
    function say(list) {
      var keep = dedupe(list);
      if (!keep.length) return '';
      return flow(keep, ctx).join('');
    }
    function isOpinion(x) {
      return /^[^，]{0,6}(业内人士|分析师|观察人士|评论员|专家)/.test(x) || (/认为|判断/.test(x) && !/\d/.test(x));
    }
    function rest(arr, skip) {
      return arr.filter(function (x) { return x !== skip; });
    }

    /* ---------------- 头条 / 百家号 ----------------
       头条：前 40 字给结果，后面按「原因—细节—跟普通人有什么关系」走。
       百家：搜索读者，先补齐 5W，再讲背景和影响，全程第三人称。 */
    if (plan.mode === 'report') {
      var lead = (sents[0] && !isOpinion(sents[0])) ? sents[0] : center;
      var p0 = flow([lead], ctx).join('').replace(/[。！？]$/, '');
      var ro = [];
      if (plat.name === '百家号') {
        var when = (String(center).match(/(今天|昨天|近日|日前|本周|今年|去年|\d+月\d+日)/) || [''])[0];
        ro.push((when ? when + '，' : '') + stripPunct(transform(lead, ctx)) + '。这件事的来龙去脉，值得完整说一遍。');
      } else {
        ro.push(p0 + '。' + judgeLine(a, t1, t2, seed));
      }
      var facts = rest(sents, lead).filter(function (x) { return !isOpinion(x); });
      var ops = rest(sents, lead).filter(isOpinion);
      var perPara = Math.max(plat.para[1], Math.min(5, Math.round(budget / 14)));
      groupN(takeBlocks(facts, Math.max(3, Math.round(budget * 0.85))), perPara).forEach(function (g) {
        var t = say(g);
        if (t) ro.push(t);
      });
      var opsReal = ops.filter(function (x) { return stripPunct(x).length >= 14; });
      if (opsReal.length) {
        var o1 = say(opsReal.slice(0, 1));
        if (o1) ro.push(o1);
      }
      if (plat.name === '百家号' && a.nums.length) {
        ro.push('把' + a.nums.slice(0, 3).join('、') + '这几个数字放在一起，能看出变化不是单点，而是整条链路上的连锁反应。');
      }
      ro.push(plat.name === '百家号'
        ? '对普通读者来说，' + t1 + '的变化最终会体现在价格、选择和体验上，后续进展仍要看' + (t2 || '供给端') + '。'
        : endLine(a, t1, t2, plan.target > 1500 ? '' : 'ask'));
      return varyOpeners(ro.filter(Boolean)).join('\n\n');
    }

    /* ---------------- 公众号 / B站专栏 ----------------
       两边都吃长文，但公众号要「判断」，B站要「信息量 + 一点梗」。 */
    if (plan.mode === 'essay') {
      var bili = plat.name === 'B站专栏';
      var o = [];
      var eLead = (sents[0] && !isOpinion(sents[0])) ? sents[0] : center;
      if (bili) {
        o.push('先说结论：' + stripPunct(transform(eLead, ctx)) + '。');
        o.push('下面把这件事拆成三块，能省流的地方我直接给结论。');
      } else {
        var wLead = stripPunct(transform(eLead, ctx));
        o.push(wLead + '。' + (a.tone === 'negative' ? '这件事值得多说两句。' : '这件事值得拆开看看。'));
      }
      var pool = rest(sents, eLead);
      var sec = [];
      /* 3000 字的长稿分三节，每节近千字，读着累；按字数给到四节 */
      var nSec = plan.target >= 2400 ? 4 : 3;
      for (var si = 0; si < nSec; si++) {
        var f0 = Math.floor(pool.length * si / nSec);
        var f1 = si === nSec - 1 ? pool.length : Math.floor(pool.length * (si + 1) / nSec);
        sec.push(pool.slice(f0, f1));
      }

      var heads = bili
        ? ['一、' + t1 + '这次到底变了什么', '二、真正的分水岭是' + (t2 || '成本'), '三、普通人该关心什么', '四、还有什么没解决']
        : ['一、' + t1 + '到底发生了什么', '二、真正的变量在' + (t2 || '别处'), '三、接下来盯什么', '四、还有什么没解决'];
      heads.forEach(function (h, i) {
        var g = sec[i] || [];
        if (!g.length) return;
        o.push('## ' + h);
        var txt = deLead(say(takeBlocks(g, Math.max(2, Math.round(budget * 0.8 / 3)))));
        if (i === 1 && a.nums.length && /\d/.test(txt)) txt = txt.replace(/。$/, '') + '，这个数字是理解整件事的钥匙。';
        if (txt) o.push(txt);
        if (!bili && txt && txt.length < 130) {
          o.push([
            '表面看是' + t1 + '，往下追一层，是' + (t2 || '供给端') + '在重新排位。',
            '换句话说，' + (t2 || '成本') + '决定了这轮变化能走多远。',
            '接下来要看的不是口号，而是' + (t2 || '落地') + '能不能跟上。'
          ][i]);
        }
      });
      if (bili) {
        o.push('## 省流');
        o.push(stripPunct(center) + '。短期看' + (t2 || '成本') + '，长期看这件事能不能复制到更多场景。');
        o.push('评论区聊聊，你更在意哪一点？');
      } else {
        o.push('## 最后说一句');
        o.push(endLine(a, t1, t2));
      }
      return varyOpeners(o.filter(Boolean)).join('\n\n');
    }

    /* ---------------- 小红书：钩子 + 三条 + 感受 ---------------- */
    if (plan.mode === 'note') {
      var n = [];
      var head = String(center).split(/[，,]/)[0];
      if (head.length > 24) head = head.slice(0, 22);
      var numHook = a.nums.length && String(center).indexOf(a.nums[0]) < 0 ? a.nums[0] : '';
      if (numHook && head.replace(/\s/g, '').indexOf(numHook) > -1) numHook = '';
      var hookSrc = (numHook ? numHook + '，' : '') + stripPunct(head) + '。';
      if (!/[。！？]$/.test(hookSrc)) hookSrc += '';
      n.push(hookSrc.replace(/。+$/, '。'));
      /* 分点数量跟目标字数走：600 字给 3–4 条，2000 字给 8 条以上，
         每条也可以用两三句把事说完整，而不是一句截断。 */
      /* 条数按目标字数反推：一条分点大约 70 字，900 字给 12 条就够，
         用 budget 推会多出一倍，整篇散掉。 */
      var nPts = Math.max(3, Math.min(18, Math.round(plan.target / 75)));
      var perPt = plan.target >= 2400 ? 4 : plan.target >= 1800 ? 3 : plan.target >= 900 ? 2 : 1;
      var pool = rest(sents, center).filter(function (x) { return !isOpinion(x); });
      var blocks = takeBlocks(pool, nPts * perPt);
      var pts = [];
      for (var bi = 0; bi < blocks.length && pts.length < nPts; bi += perPt) {
        var grp = blocks.slice(bi, bi + perPt);
        var txt = grp.map(function (x) { return deLead(transform(x, ctx)); }).join('');
        if (stripPunct(txt).length < 8) continue;
        pts.push(briefOf(txt, detailCap * perPt));
      }
      if (pts.length < 3) {
        pool.slice(0, 3 - pts.length).forEach(function (x) {
          pts.push(briefOf(deLead(transform(x, ctx)), detailCap));
        });
      }
      pts.forEach(function (t) {
        n.push('· ' + stripPunct(t) + '。');
      });
      var feel = a.tone === 'negative'
        ? '说真的，' + t1 + '这波热闹背后，先扛不住的往往是最底下的那批人。'
        : a.tone === 'positive'
          ? '说真的，' + t1 + '这波下来，普通人的选择确实变多了。'
          : '说真的，我更关心的不是热闹，是' + (t2 || t1) + '能不能落到日常。';
      n.push(feel + '你们那边是什么情况？');
      var tags = ['#' + t1, '#' + t2].concat(catTags).filter(Boolean).slice(0, Math.max(3, plat.tags || 3));
      n.push(tags.map(function (t) { return '#' + String(t).replace(/^#/, ''); }).join(' '));
      return varyOpeners(n).join('\n\n');
    }

    /* ---------------- 抖音口播：一句一个信息 ---------------- */
    if (plan.mode === 'script') {
      var v = [];
      v.push('（0—3 秒）' + (a.nums.length ? a.nums[0] + '，这就是现在的' + t1 + '。' : questionOf(center, t1)));
      var list = rest(sents, center).filter(function (x) { return !isOpinion(x); });
      var merged = [];
      list.forEach(function (x) {
        var t = transform(x, ctx).replace(/^(从[^，]{2,14}看|更关键的是|问题来了|你发现没有|实际看下来|换句话说|再往下说|但这里有个前提)[，,]/, '');
        if (merged.length && /(表示|指出|称|说|认为|介绍|透露|强调|预计)$/.test(stripPunct(merged[merged.length - 1]))) {
          merged[merged.length - 1] = stripPunct(merged[merged.length - 1]) + '，' + t;
        } else {
          merged.push(t);
        }
      });
      takeBlocks(merged, Math.max(6, Math.min(22, budget))).forEach(function (t) {
        var q = stripPunct(t);
        /* 口播一句一口气：34 字以内整句念完；超了只在逗号处断，
           没有逗号就整句保留。以前按字数硬切，会切出「…千。」「元附近」。 */
        while (q.length > 34) {
          var cut = -1;
          for (var i = 16; i <= 30; i++) { if (/[，；]/.test(q.charAt(i))) { cut = i; break; } }
          if (cut < 0) {
            /* 没有逗号：退到 30 字，再往回让开虚词，别切出「…的。」 */
            cut = 30;
            while (cut > 20 && /[的了和与在是把被对为就也还都很更将已]/.test(q.charAt(cut - 1))) cut -= 1;
          }
          if (cut < 1) break;
          v.push(q.slice(0, cut).replace(/[，；]$/, '') + '。');
          q = q.slice(cut).replace(/^[，；]/, '');
        }
        if (q.length >= 4) v.push(q + '。');
      });
      v.push('（转折）' + (a.tone === 'negative' ? '但代价也得说清楚。' : '但真正的变化不在这。'));
      v.push('（结尾）' + endLine(a, t1, t2, 'ask'));
      return v.slice(0, 18).join('\n');
    }

    /* ---------------- 知乎：结论 + 三条论据 + 边界 ---------------- */
    if (plan.mode === 'answer') {
      var z = [];
      z.push('先说结论：' + stripPunct(center) + '。');
      var zs = rest(sents, center).filter(function (x) { return !isOpinion(x); });
      var heads = ['第一，', '第二，', '第三，', '第四，', '第五，', '第六，', '第七，'];
      var nArg = Math.max(3, Math.min(7, Math.round(budget * 0.34)));
      takeBlocks(zs, nArg).forEach(function (x, i) {
        z.push((heads[i] || ('第' + (i + 1) + '，')) + stripPunct(transform(x, ctx)) + '。');
      });
      if (a.nums.length > 1) {
        z.push('把' + a.nums.slice(0, 3).join('、') + '放在一起看，方向是一致的，单独拎一个数字容易误判。');
      }
      z.push('这件事之所以值得讨论，不是因为' + t1 + '本身有多新，而是它把' + (t2 || '成本') + '的问题摆到了台面上。');
      z.push('对普通人来说，短期影响在价格和选择，中期影响在' + (t2 || '体验') + '。');
      z.push('以上判断基于目前公开的信息。如果后续口径变化，结论需要重估。');
      return varyOpeners(z).join('\n\n');
    }

    /* ---------------- 酷安：结论 + 优点 + 槽点 + 谁该买 ----------------
       酷友最烦「参数复读 + 通篇夸」。所以优点必须落到场景，
       槽点必须说代价，最后一定要给「买不买」的明确态度。 */
    if (plan.mode === 'review') {
      var rv = [];
      var rpool = rest(sents, center).filter(function (x) { return !isOpinion(x); });
      var pc = splitPC(rpool);
      var withNum = function (x) { return /\d/.test(x); };
      rv.push('先说结论：' + briefOf(center, 32) + '。' + (a.tone === 'negative'
        ? '东西不是不能买，是现在这个节点买不划算。'
        : '方向是对的，但别指望一步到位。'));
      var pros = uniqList(pc.pos.filter(withNum).concat(pc.pos))
        .slice(0, Math.max(3, Math.min(8, Math.round(budget * 0.3))));
      if (pros.length < 2) {
        pros = pros.concat(uniqList(pc.mid).filter(function (x) {
          return !/(代价|问题|增加|增多|延长|压缩|下降|压力)/.test(x);
        })).slice(0, 2);
      }
      if (pros.length) {
        rv.push('值得肯定的地方：');
        pros.forEach(function (x, i) {
          rv.push((i + 1) + '. ' + briefOf(deLead(transform(x, ctx)), detailCap) + '。');
        });
      }
      var cons = uniqList(pc.neg).slice(0, Math.max(2, Math.min(6, Math.round(budget * 0.2))));
      rv.push('槽点也摆出来：');
      if (cons.length) {
        cons.forEach(function (x) {
          rv.push('· ' + briefOf(deLead(transform(x, ctx)), detailCap) + '。');
        });
      } else {
        rv.push('· 原文没给长期使用的数据，稳定性还得打个问号。');
        rv.push('· 价格是不是长期价、售后跟不跟得上，这两点也没交代。');
      }
      /* 目标字数明显超过「优点 + 槽点」能撑的量时，把中性的过程/背景
         补进来，别让 2000 字的酷安稿只有 600 字。 */
      if (plan.target > 1100) {
        var mids = takeBlocks(uniqList(pc.mid), Math.max(3, Math.round(budget * 0.4)));
        if (mids.length) {
          rv.push('还有几点值得记一笔：');
          mids.forEach(function (x) {
            rv.push('· ' + briefOf(deLead(transform(x, ctx)), detailCap) + '。');
          });
        }
      }
      var isGoods = /(元|款|机型|配置|续航|性能|芯片|镜头|屏幕|克)/.test(center + sents.join(''));
      rv.push(isGoods
        ? '谁该买：本来就在等' + t1 + '降价的，可以再等一轮；刚需现在就用的，挑口碑稳的那款，别冲首发。'
        : '谁该关注：如果你是' + t1 + '的从业者或常客，这轮变化值得盯紧；只是围观的话，先看' + (t2 || '价格') + '会不会真的松动。');
      rv.push(isGoods ? '以上基于公开信息，真机体验还得等第一批用户反馈。' : '以上基于公开信息，实际效果还得看落地。');
      return varyOpeners(rv.filter(Boolean)).join('\n\n');
    }

    /* ---------------- 网易小蜜蜂：评分 + 锐评 + 观察 + 抛问题 ----------------
       这是个生活社区，不是媒体。先给态度和分数，再摆两三条具体观察，
       最后把话头递给别人，评论区才接得下去。 */
    if (plan.mode === 'buzz') {
      var bz = [];
      var score = 6 + (a.tone === 'positive' ? 1 : 0) + (a.nums.length ? 1 : 0) + (a.tone === 'negative' ? -1 : 0);
      score = Math.max(4, Math.min(9, score));
      bz.push('我先打个分：' + score + '/10。');
      bz.push(a.tone === 'negative'
        ? '态度摆在这：热闹是他们的，代价最后还是要普通人来付。'
        : a.tone === 'positive'
          ? '态度摆在这：这次不是画饼，普通人确实能捞到点实在的。'
          : '态度摆在这：先别急着站队，把几件事看清楚再说。');
      var obs = uniqList(rest(sents, center).filter(function (x) { return !isOpinion(x); }))
        .sort(function (x, y) { return (/\d/.test(y) ? 1 : 0) - (/\d/.test(x) ? 1 : 0); })
        .slice(0, Math.max(3, Math.min(6, Math.round(budget * 0.36))));
      if (obs.length) {
        bz.push('几个具体观察：');
        obs.forEach(function (x) {
          bz.push('· ' + briefOf(deLead(transform(x, ctx)), detailCap) + '。');
        });
      }
      var badPool = splitPC(rest(sents, center).filter(function (x) { return obs.indexOf(x) < 0; })).neg;
      var bad = badPool[0];
      bz.push('最想吐槽的一点：' + (bad
        ? briefOf(transform(bad, ctx), 34).replace(LEAD_CONN, '') + '，这条在宣传里基本不会提。'
        : '通篇都在讲好处，可最关键的那个问题一直没人回答。'));
      bz.push('你们会给这事打几分？评论区聊聊。');
      var bzTags = ['#' + t1, '#今日话题'].filter(Boolean).slice(0, Math.max(2, plat.tags || 2));
      bz.push(bzTags.join(' '));
      return varyOpeners(bz).join('\n\n');
    }

    /* ---------------- 微博 / 评论：一段话说清态度 ---------------- */
    var c = [];
    var stance = a.tone === 'negative' ? '这事没那么简单，' : (a.tone === 'positive' ? '这次是真变化，' : '先把事实摆清楚，');
    c.push(stance + stripPunct(center) + '。');
    var fresh = a.nums.filter(function (x) { return String(center).indexOf(x) < 0; });
    if (fresh.length) c.push('一个数字就够说明问题：' + fresh.slice(0, 2).join('、') + '。');
    if (a.quotes.length) c.push('原话是「' + a.quotes[0].slice(0, 46) + '」，比转述可信。');
    var extra = dedupe(rest(sents, center).filter(function (x) {
      return x !== sents[0] && similarity(x, center) < 0.45;
    })).slice(0, 1);
    if (extra.length) c.push(stripPunct(transform(extra[0], ctx)) + '。');
    c.push(a.tone === 'negative' ? '所以别急着叫好，先看代价谁承担。' : '所以别急着下结论，先看下一步怎么落地。');
    var ctext = c.join('');
    if (style === 'weibo' || plan.mode === 'weibo') ctext += '\n\n#' + t1 + '# #' + (t2 || t1) + '#';
    return ctext;
  }

  function stripPunct(s) {
    return String(s).replace(/[。！？；，、]+$/, '');
  }

  function hookOf(core) {
    return '最近被' + core + '刷屏了，我认真看了一遍，发现重点根本不在表面。';
  }

  function questionOf(core, kw) {
    return core.replace(/[。！？]$/, '') + '，到底意味着什么？';
  }

  /* ---------- 相似度 / 原创度 ---------- */

  function grams(text) {
    var t = String(text).replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g, '');
    var set = new Set();
    for (var i = 0; i + 3 <= t.length; i++) set.add(t.substr(i, 3));
    return set;
  }

  function similarity(a, b) {
    var A = grams(a), B = grams(b);
    if (!A.size) return 0;
    var inter = 0;
    A.forEach(function (g) { if (B.has(g)) inter++; });
    return inter / A.size;
  }

  /* 长片段重合：8 字连续重合才计入，更接近"连续照搬"的判定 */
  function longSim(a, b, n) {
    var A = gramsN(a, n || 8), B = gramsN(b, n || 8);
    if (!A.size) return 0;
    var inter = 0;
    A.forEach(function (g) { if (B.has(g)) inter++; });
    return inter / A.size;
  }

  function gramsN(text, n) {
    var t = String(text).replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g, '');
    var set = new Set();
    for (var i = 0; i + n <= t.length; i++) set.add(t.substr(i, n));
    return set;
  }

  /* ---------- 评论：像真人，不像总结 ----------
     原则：一条评论只说一件事；必须带原文里的具体细节；不总结全文、不夸作者、
     不用「首先/其次/总之/不得不说」。不同条之间角度要岔开。 */
  var CM_TPL = {
    warm: [
      '看到「{d}」，突然想起我身边也差不多是这样。',
      '{n}这个数字比我想的大，之前完全没概念。',
      '别的都好说，「{d}」真能做到吗？',
      '看完就一个感觉：{d}。别的不好评价。',
      '有点好奇后面会怎么走，蹲个后续。',
      '这事我信一半，「{d}」说得太满。',
      '「{d}」这个细节挺打动我，比大道理有用。',
      '我倒觉得没必要上价值，就是件挺平常的事。',
      '先别急着感动，{d}之后谁来收尾？',
      '身边正好有做这行的，实际情况比写的还麻烦。'
    ],
    sharp: [
      '「{d}」这句我保留意见，现实里基本行不通。',
      '{n}也好意思拿出来说？这数据站不住。',
      '通篇都在说好听的，可最该回答的问题一个字没提。',
      '别光说好听的，{d}的代价谁承担？',
      '看着挺热闹，落到具体人身上还是老样子。',
      '这种话听太多了。然后呢？',
      '真要较真，{n}这个数先解释清楚。',
      '我不同意，「{d}」不是这么回事。',
      '一句话：别把个例当成万能答案。'
    ],
    info: [
      '补一个信息：这块各地口径不一样，别一概而论。',
      '{n}这个数我查过，统计范围只覆盖了一部分。',
      '做过这行的来说一句，「{d}」只是理想情况。',
      '提醒一下，这里还牵涉到资质问题，不是想做就能做。',
      '原文没提的是，类似的事去年已经试过一轮。',
      '「{d}」背后其实有个前提，缺了这条就不成立。',
      '我手上刚好有相反的例子，实际情况没那么顺。',
      '时间线捋一下，{d}是后发生的，因果反了。'
    ]
  };

  function comments(input, opts) {
    opts = opts || {};
    var text = String(input || '').trim();
    var n = Math.max(1, Math.min(8, Number(opts.n || 4)));
    var tone = CM_TPL[opts.tone] ? opts.tone : 'warm';
    var sents = splitSentences(text).filter(function (x) { return x.length >= 8; });
    var core = sents.slice().sort(function (a, b) { return b.length - a.length; })[0] || text.slice(0, 60);
    var nums = (text.match(/\d+(?:\.\d+)?%?/g) || []).filter(function (x) { return x.length <= 6; });

    /* 关键词只认词典里的真词，n-gram 会切出「市里的文」这种半截话 */
    var kws = [];
    D.TERMS.forEach(function (t) {
      if (t.length >= 2 && t.length <= 6 && text.indexOf(t) > -1) kws.push(t);
    });
    kws = kws.filter(function (t, i) { return kws.indexOf(t) === i; }).slice(0, 8);

    /* 细节取完整小句，不硬截：截一半比空泛更假 */
    var clauses = text.split(/[，。！？；、\n]/)
      .map(function (x) { return x.replace(/^[^，。]{0,4}[：:]/, '').trim(); })
      .filter(function (x) { return x.length >= 6 && x.length <= 18; });

    var rnd = mulberry32(hashStr(text.slice(0, 240) + tone + n + (opts.variant || 0)));
    var out = [], used = {};

    function pick(arr) {
      if (!arr.length) return '';
      return arr.splice(Math.floor(rnd() * arr.length), 1)[0];
    }
    function fill(tpl) {
      var d = pick(clauses.slice()) || core.slice(0, 14);
      var num = pick(nums.slice());
      return tpl.replace(/\{d\}/g, d).replace(/\{n\}/g, num || '')
        .replace(/\s+/g, ' ').trim();
    }

    var pool = CM_TPL[tone].filter(function (t) {
      return nums.length || t.indexOf('{n}') < 0;
    });
    for (var i = 0; i < n * 4 && out.length < n; i += 1) {
      if (!pool.length) break;
      var c = fill(pick(pool));
      if (!c || c.length < 8) continue;
      var key = c.slice(0, 8);
      if (used[key]) continue;
      used[key] = 1;
      out.push(c);
    }
    return out;
  }

  /* ---------- 主流程 ---------- */

  var OPENERS = [
    ['过去一年', '这一年'], ['过去两年', '近两年'], ['过去三年', '这三年'],
    ['这两年', '这几年'], ['过去几年', '最近几年'], ['最近一年', '近一年']
  ];

  function rewrite(input, opts) {
    opts = opts || {};
    input = String(input || '').replace(/^[ \t]*(补充|备注|注|原文|素材)[:：][ \t]*/gm, '').trim();
    var style = opts.style || 'news';
    var strength = Number(opts.strength || 2);
    var variant = Number(opts.variant || 0);
    var seed = hashStr(String(input).slice(0, 400) + style + strength + variant);
    var rnd = mulberry32(seed);

    var sents = splitSentences(input);
    if (sents.length < 3) {
      sents = sents.concat(['这件事的影响还在扩散。', '目前能看到的信息仍然有限。', '但方向已经比较清楚。']);
    }

    var ctx = {
      rnd: rnd,
      style: style,
      pairs: pickPairs(style),
      usedConnect: {},
      sinceConn: 9,
      /* 同义替换只是最后一道润色，权重刻意压低；结构靠上面的思考层 */
      synProb: [0, 0.28, 0.42, 0.55][strength] || 0.4,
      splitProb: [0, 0.16, 0.3, 0.42][strength] || 0.28,
      connectProb: [0, 0.08, 0.16, 0.24][strength] || 0.16,
      seed: seed
    };

    var kws = keywords(input, 6).filter(function (k) { return !isPersonName(k, input); });
    /* 标题主语优先，避免把「供应链」「AI」当成文章主角 */
    var ent = entityOf((opts && opts.sourceTitle) || sents[0] || '');
    if (ent) {
      kws = [ent].concat(kws.filter(function (k) {
        return k !== ent && k.indexOf(ent) < 0 && ent.indexOf(k) < 0;
      }));
    }
    var core = trimCore(sents[0]);
    ctx.analysis = analyze(input, sents, kws);
    ctx.plan = planFor(ctx.analysis, opts, style);
    /* 长稿句子多，同义替换的覆盖率会被稀释，重合率反而更高；

    if (ctx.plan.target > 1400) ctx.synProb = Math.min(0.62, ctx.synProb + 0.12);
    /* 长稿里每三句一个「更关键的是」会很吵，拉开到五六句 */
    ctx.connGap = ctx.plan.target > 2400 ? 7 : ctx.plan.target > 1400 ? 5 : 3;
    var body = humanize(buildBody(style, sents, kws, ctx, opts));
    /* 同义替换用的 \u0001/\u0002 占位符，极端情况下可能没还原干净 */
    body = body.replace(/\u0001\d*\u0001?|\u0002\d*\u0002?/g, '');
    var titles = buildTitles(style, kws, core, input, sents, opts.platform).filter(function (t, i, arr) {
      return t && arr.indexOf(t) === i;
    });
    if (opts && opts.sourceTitle) {
      var st = String(opts.sourceTitle).replace(/\s*[|｜]\s*.*$/, '').trim();
      /* 原标题只作备选，不再顶掉平台专用标题 */
      if (st.length >= 6 && st.length <= 34 && titles.indexOf(st) === -1) {

    var summary = summarySrc.length > 78 ? summarySrc.slice(0, 78) + '…' : summarySrc;

    var plain = stripMd(body);
    var outSents = splitSentences(plain);
    var dupes = 0;
    outSents.forEach(function (s) {
      if (s.length > 12 && longSim(s, input) > 0.72) dupes++;
    });

    var overlap = longSim(plain, input, 12);
    var score = Math.max(35, Math.min(96, Math.round(100 - overlap * 100)));

    });
    catTags.forEach(function (t) { if (tags.indexOf(t) === -1) tags.push(t); });

      titles: titles,
      body: body,
      summary: summary,

  function merge(a, b) {
    var A = splitSentences(a), B = splitSentences(b);
    var out = [];
    var seen = [];
    function push(s) {
      for (var i = 0; i < seen.length; i++) {
        if (similarity(s, seen[i]) > 0.55) return;
      }
      seen.push(s);
      out.push(s);
    }
    A.forEach(push);
    B.forEach(function (s) {
      // 只补充与原素材重合度低、且带新信息的句子
      if (similarity(s, a) < 0.4) push(s);
    });
    if (out.length < 6) out = out.concat(B.slice(0, 3));
    return out.slice(0, 16).join('');
  }

  /* ---------- Markdown 渲染 ---------- */

  function inline(s) {
    var x = esc(s);
    x = x.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    x = x.replace(/(^|\s)(#[^\s#<>]+)/g, '$1<span class="hash">$2</span>');
    x = x.replace(/^（(\d+—\d+\s*秒|结尾|开头)）/, '<span class="cue">（$1）</span>');
    return x;
  }

  function mdToHtml(md) {
    var lines = String(md).split('\n');
    var html = [], list = null, ol = null, para = [];

    function flushPara() {
      if (para.length) { html.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; }
    }
    function flushList() {
      if (list) { html.push('<ul>' + list.map(function (li) { return '<li>' + inline(li) + '</li>'; }).join('') + '</ul>'); list = null; }
      if (ol) { html.push('<ol>' + ol.map(function (li) { return '<li>' + inline(li) + '</li>'; }).join('') + '</ol>'); ol = null; }
    }

    lines.forEach(function (raw) {
      var line = raw.trim().replace(/^＃+/, function (m) { return '#'.repeat(m.length); });
      if (!line) { flushPara(); flushList(); return; }
      /* 一到六级标题都要认。以前只认「## 」，模型偶尔写「### 优点」，
         页面上就原样露出三个井号，复制出去也是一样。 */
      if (/^#{1,6}\s+/.test(line)) {
        flushPara(); flushList();
        html.push('<h3>' + inline(line.replace(/^#{1,6}\s+/, '')) + '</h3>');
        return;
      }
      if (/^>\s?/.test(line)) {
        flushPara(); flushList();
        html.push('<blockquote>' + inline(line.replace(/^>\s?/, '')) + '</blockquote>');
        return;
      }
      if (/^[·\-*]\s?/.test(line)) {
        flushPara();
        if (ol) { html.push('<ol>' + ol.map(function (li) { return '<li>' + inline(li) + '</li>'; }).join('') + '</ol>'); ol = null; }
        if (!list) list = [];
        list.push(line.replace(/^[·\-*]\s?/, ''));
        return;
      }
      if (/^\d{1,2}[.、)]\s*/.test(line)) {
        flushPara();
        if (list) { html.push('<ul>' + list.map(function (li) { return '<li>' + inline(li) + '</li>'; }).join('') + '</ul>'); list = null; }
        if (!ol) ol = [];
        ol.push(line.replace(/^\d{1,2}[.、)]\s*/, ''));
        return;
      }
      flushList();
      para.push(line);
    });
    flushPara(); flushList();
    return html.join('');
  }

  /* 模型偶尔不听话：给小红书加「### 优点」，给头条加三级标题，或者用星号当项目符号。
     这里统一收一遍：多级标题压成「## 」，星号列表换成「· 」，多余的井号清掉。
     不这么做，复制到平台编辑器里就是一堆 #，用户还得逐行删。 */
  function tidyBody(md) {
    return String(md || '')
      .replace(/\r\n?/g, '\n')
      .replace(/^[ \t]*[#＃]{2,6}[ \t]*/gm, '## ')
      .replace(/^[ \t]*[#＃][ \t]+/gm, '')
      .replace(/^[ \t]*[*+][ \t]+/gm, '· ')
      .replace(/[ \t]+$/gm, '')
      .replace(/\n{3,}/g, '\n\n')
      .trim();
  }

  /* 复制、导出用的纯文本：把 markdown 记号全部去掉。
     公众号/头条/小红书的编辑器都不认 ##，粘进去就是一堆井号，用户还得手删。 */
  function toPlain(md) {
    return String(md || '')
      .replace(/\r\n?/g, '\n')
      /* 只清标题记号：井号后面带空格的，或者连写两个以上的。
         单个「#AI眼镜」是话题标签，不能把井号也吃掉。 */
      .replace(/^[ \t]*[#＃]{1,6}[ \t]+/gm, '')
      .replace(/^[ \t]*[#＃]{2,6}(?=[^\s#＃])/gm, '')
      .replace(/^[ \t]*[-*+][ \t]+/gm, '· ')
      .replace(/^[ \t]*>[ \t]?/gm, '')
      .replace(/\*\*([^*\n]+)\*\*/g, '$1')
      .replace(/`([^`\n]+)`/g, '$1')
      .replace(/[ \t]+$/gm, '')
      .replace(/\n{3,}/g, '\n\n')
      .trim();
  }

    place: ['place', 'vehicle', 'people', 'stage'],
    finance: ['finance', 'place', 'object'],
    stage: ['stage', 'people', 'tech'],
    object: ['object', 'pack', 'food', 'home']
  };

  function visObjects(scan, title) {
    var out = [];
    for (var i = 0; i < VIS_OBJ.length; i++) {
      var o = VIS_OBJ[i];
      if (!o[0].test(scan)) continue;
      var uniq = [];
      (scan.match(new RegExp(o[0].source, 'g')) || []).forEach(function (k) {
        if (uniq.indexOf(k) < 0) uniq.push(k);
      });
      var n = uniq.length;
      /* 出现次数也算分：一篇稿子反复讲瓶子，就别让一次「晚宴」抢走主体 */
      var w = o[4] + (o[0].test(title) ? 6 : 0) + Math.min(n - 1, 4);
      out.push({ cn: o[1], en: o[2], g: o[3], w: w, expect: o[5], short: o[6], at: scan.search(o[0]), hits: uniq.slice(0, 3) });
    }
    out.sort(function (a, b) { return b.w - a.w || a.at - b.at; });
    return out;
  }

  /* 类目按分数定：标题命中算 4 分，正文每命中一次算 1 分。
     以前是「谁排在前面谁赢」，于是正文里一个「经济损失」就能把整篇拉进财经。 */
  function visCatOf(title, body) {
    var best = 'place', bestScore = 0;
    for (var i = 0; i < VIS_ROUTE.length; i++) {
      var re = VIS_ROUTE[i][0];
      var t = (title.match(new RegExp(re.source, 'gi')) || []).length;
      var b = (body.match(new RegExp(re.source, 'gi')) || []).length;
      var sc = t * 4 + b;
      if (sc > bestScore) { bestScore = sc; best = VIS_ROUTE[i][1]; }
    }
    return best;
  }


  return {
    rewrite: rewrite,
    comments: comments,
    merge: merge,
    mdToHtml: mdToHtml,
    toPlain: toPlain,
    tidyBody: tidyBody,
    stripMd: stripMd,

    platformBrief: platformBrief,
    platformHint: platformHint,
    platformCheck: platformCheck,
    autoWords: autoWords,
    lenTip: lenTip,
    platTags: platTags
  };
})();

    var fast = route.filter(function (r) { return r.k !== 'imsyy'; });

     2026 年 10 月起，DeepSeek 提供 POST /v1/tools/fetch：丢一个 URL，回 { title, content }，
     content 是洗干净的正文字（Markdown），公众号也能抓。
     关键是这家给浏览器发 CORS 头（预检回 Access-Control-Allow-Origin），
     所以不用部署任何中转就能在手机浏览器里直接解析——这正是这个 App 一直缺的那一环。
     这是可选通道，默认不启用；内置免费节点已能覆盖大多数场景。 */
  var DS_KEY = 'wj.ds.key';
  var DS_API = 'https://api.deepseek.com/v1/tools/fetch';

  function dsKey() {
    try { return String(localStorage.getItem(DS_KEY) || '').trim(); } catch (e) { return ''; }
  }
  function setDsKey(k) {

  /* Markdown → 纯文本 + 图片地址。抓回来是 "# 标题\n\n正文![](图)" 这种，
     直接喂给改写提示词会带一堆 # 和 **，先转干净。 */
  function mdToText(md) {
    var imgs = [];
    var t = String(md || '');
    t = t.replace(/!\[[^\]]*\]\(([^)\s]+)[^)]*\)/g, function (_, u) {
      if (u && !/^data:/.test(u) && imgs.indexOf(u) < 0) imgs.push(u);
      return '';
    });
    t = t.replace(/\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g, '$1');
    t = t.replace(/^#{1,6}\s*/gm, '');
    t = t.replace(/^\s*[-*+]\s+/gm, '· ');
    t = t.replace(/^\s*>\s?/gm, '');
    t = t.replace(/(\*\*|__)(.*?)\1/g, '$2');
    t = t.replace(/`{1,3}([^`]*)`{1,3}/g, '$1');
    t = t.replace(/^\s*[-*_]{3,}\s*$/gm, '');
    return { text: clean(t), images: imgs.slice(0, 8) };
  }

  async function dsFetch(url, ms) {
    var k = dsKey();
    if (!k) {
      var e0 = new Error('没有填 DeepSeek Key');
      e0.code = 'NO_DS';
      throw e0;
    }
    var tk = timeout(ms || 45000);
    var r, d;
    try {
      r = await fetch(DS_API, {
        method: 'POST',
        signal: tk.signal,
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + k },
        cache: 'no-store',
        body: JSON.stringify({ url: url })
      });
      d = await r.json().catch(function () { return null; });
    } finally { tk.done(); }
    if (!r.ok) {
      var msg = (d && d.error && (d.error.message || d.error.code)) || ('HTTP ' + r.status);
      var e = new Error(msg);
      e.status = r.status;
      if (r.status === 401) e.message = 'DeepSeek Key 无效或已失效';
      else if (r.status === 402) e.message = 'DeepSeek 余额不足，请到平台充值或改用内置免费节点';
      else if (r.status === 403) e.message = '被目标站点安全策略拒绝（' + msg + '）';
      else if (r.status === 404) e.message = '这个页面抓不到内容（可能要登录，或页面没有正文）';
      else if (r.status === 429) e.message = '抓取太频繁（每秒 5 次上限），缓一下再试';
      throw e;
    }
    var content = String((d && d.content) || '');
    if (content.replace(/\s/g, '').length < 30) {
      var e2 = new Error('页面抓回来几乎是空的（可能要登录，或是纯图片页）');
      e2.status = 404;
      throw e2;
    }
    var conv = mdToText(content);
    return { title: String((d && d.title) || ''), text: conv.text.slice(0, 20000), chars: conv.text.length, images: conv.images, via: 'deepseek' };
  }

  /* 把底层错误翻译成人话：502 是解析服务掉线，abort 是超时，Failed to fetch 多半被网络拦了 */
  function errMsg(e) {
    var m = String((e && e.message) || '失败');
    if (/HTTP 50[234]/.test(m)) return '解析服务离线（' + m + '）';
    if (/HTTP 45[0-9]/.test(m)) return '被站点风控拦下（' + m + '）';
    if (/abort/i.test(m)) return '超时没响应';
    if (/Failed to fetch|NetworkError|load failed|fetch failed/i.test(m)) return '连不上（可能被网络拦截）';
    if (/HTTP 404/.test(m)) return '接口不存在';
    return m;
  }

      tasks.forEach(function (t) {

          .then(function () { return t.run(); })
          .then(function (r) {
            if (done) return;
            done = true; clearTimeout(timer);
            resolve({ data: r, task: t });

          .catch(function (err) {

              var e = new Error('所有通道都没成功');
              e.detail = errs.join('\n');

  function extractHtml(html) {
    var doc;
    try {
      doc = new DOMParser().parseFromString(html, 'text/html');
    } catch (e) {
      return null;
    }
    if (!doc) return null;
    var title =
      (doc.querySelector('meta[property="og:title"]') || {}).content ||
      (doc.querySelector('h1') || {}).textContent ||
      (doc.title || '');
    title = String(title || '').replace(/\s+/g, ' ').trim();

    var nodes = doc.querySelectorAll('script,style,noscript,iframe,svg,form,nav,footer,header');
    for (var i = 0; i < nodes.length; i++) nodes[i].remove();

    var pools = ['#js_content', '#paragraph', 'article', '.rich_media_content', '.post_content', '.artical-content', '.article-content', '.entry-content',
      '.post-content', '.content', '#content', '.main-content', 'main'];
    var best = null, bestLen = 0;
    pools.forEach(function (sel) {
      var el = doc.querySelector(sel);
      if (!el) return;
      var txt = (el.innerText || el.textContent || '').trim();
      if (txt.length > bestLen) { bestLen = txt.length; best = txt; }
    });
    if (!best || bestLen < 180) {
      var ps = doc.querySelectorAll('p');
      var buf = [];
      for (var j = 0; j < ps.length; j++) {
        var t = (ps[j].textContent || '').trim();
        if (t.length > 18 && !NOISE.test(t.slice(0, 30))) buf.push(t);
      }
      var joined = buf.join('\n');
      if (joined.length > bestLen) best = joined;
    }

  }

  function clean(t) {

      .replace(/\r/g, '')
      .replace(/[ \t\u00a0]+/g, ' ')

      .split('\n')

      .filter(function (l) { return l && !NOISE.test(l.slice(0, 24)); })

  function pickUrl(input) {

  function bareUrl(u) {

    if (/mp\.weixin\.qq\.com/.test(s)) return 'wechat';

  function baseDeadMap() {
    try {
      var m = JSON.parse(localStorage.getItem('wj.base.dead') || '{}');

    } catch (e) { return {}; }

    var t = baseDeadMap()[hostOf(b) || b];

  /* 话题下的帖子清单（二级页面）。
     三条路，按可靠性排：① 配好的解析服务（数据最全）；② 公共通道——头条直连
     头图 + 帖子流过代理，微博过 RSSHub 镜像；③ 本机上次实时 / 仓库缓存兜底。
     三跳都是现取的，所以标题能写「实时」；只有第 ③ 条才标「缓存 + 时间」。 */
  var TP_SNAP = 'data/hot.json';
  var tpMem = null;

  var tpP = null;
  async function topicSnapshot() {
    if (tpMem && Date.now() - tpMem.at < 4 * 60000) return tpMem.data;
    if (tpP) return tpP;

  }

  async function loadTopicSnapshot() {
    /* 构建时已经内联了一份：直接用它，别再为点开一个话题去下 200KB */
    if (typeof window !== 'undefined' && window.__WJ_SNAP__ && window.__WJ_SNAP__.topics) {

      return tpMem.data;
    }
    var d = null;

    try {
      var raw = await getJSON(withShare(TP_SNAP), 15000);
      if (raw && raw.topics) d = raw.topics;
    } catch (e) { /* 本地文件 / 还没生成 */ }

      } catch (e) { /* 兼容旧文件 */ }
    }

    }

    if ((!d || (!d.weibo && !d.toutiao)) && typeof window !== 'undefined') {

  /* 头条的链接长这样：/trending/7710490430710776329/?... —— 数字就是话题 id */
  function topicId(url) {
    var m = String(url || '').match(/\/trending\/(\d{8,})/);
    return m ? m[1] : '';
  }

  /* 开机后台预热一次：把 data/hot.json 里的 topics 读进内存。
     这样点开话题时用的是 15 分钟内的数据，而不是构建时内联的那份（可能几小时前）。 */
  var tpWarm = null;
  function warmTopics() {
    if (tpWarm) return tpWarm;
    tpWarm = getJSON(withShare(TP_SNAP), 15000)
      .then(function (d) {
        if (d && d.topics) {
          tpMem = { at: Date.now(), data: d.topics };
          try { localStorage.setItem('wj.topics.snap', JSON.stringify(d.topics)); } catch (e) { /* ignore */ }
        }
        return tpMem && tpMem.data;
      })
      .catch(function () { return null; });
    return tpWarm;
  }

  function pickTopic(snap, src, title, id) {
    if (!snap) return null;
    if (src === 'toutiao') {
      if (id && snap.toutiao && snap.toutiao[id]) return snap.toutiao[id];
      var t = String(title || '').trim();
      if (t && snap.toutiao) {
        var hit = Object.keys(snap.toutiao).filter(function (k) { return snap.toutiao[k].title === t; })[0];
        if (hit) return snap.toutiao[hit];
      }
      return null;
    }
    var key = String(title || '').replace(/^#+|#+$/g, '').trim();
    var all = (snap.weibo || {});
    if (all[key]) return all[key];
    var loose = Object.keys(all).filter(function (k) {
      return k && (k.indexOf(key) > -1 || key.indexOf(k) > -1);
    })[0];
    return loose ? all[loose] : null;
  }

  /* ---------------- 二级页：话题下的帖子 ----------------

     微博、头条的话题接口都不给 CORS 头，浏览器直连一定失败。所以分三层：

     1. 配了解析服务（Cloudflare Worker / 自建 VPS）→ 服务端实时抓，最完整；
     2. 头条还有一条「公共线路」：官方 topic_innerflow 接口本身不需要登录，
        只是缺 CORS，套一层公共代理就能实时读到，实测可用；
     3. 都没有才用仓库里的缓存（Action 生成），标成「缓存」+ 时间。

     微博没有第 2 条路：它的搜索接口要访客 Cookie，浏览器既拿不到也带不上，
     这部分只能靠解析服务，UI 里会直说。 */

  function ttParse(flow, head) {
    var items = [];
    var data = (flow && flow.data) || [];
    for (var k = 0; k < data.length; k++) {
      var c = data[k] && data[k].content;
      if (typeof c === 'string') {
        try { c = JSON.parse(c); } catch (e) { c = null; }
      }
      if (!c) continue;
      var text = plainText(c.content || c.abstract || '');
      var title = plainText(c.title || '');
      if (!text && !title) continue;
      var imgs = [];
      var cl = c.detail_cover_list || [];
      for (var j = 0; j < cl.length; j++) {
        var u = (cl[j] && (cl[j].url || (cl[j].url_list && cl[j].url_list[0] && cl[j].url_list[0].url))) || '';
        if (u) imgs.push(String(u).replace(/^http:/, 'https:'));
      }
      var gid = String(c.group_id || ((c.schema || '').match(/group_id=(\d+)/) || [])[1] || '');
      items.push({
        id: gid,
        url: gid ? 'https://www.toutiao.com/w/' + gid + '/' : '',
        author: (c.user && c.user.name) || plainText(c.source || ''),
        avatar: ((c.user && c.user.avatar_url) || '').replace(/^http:/, 'https:'),
        title: title,
        text: (text || title).slice(0, 500),
        images: imgs.slice(0, 6),
        at: c.create_time ? new Date(c.create_time * 1000).toISOString() : '',
        likes: c.digg_count || 0,
        comments: c.comment_count || 0,
        reposts: c.share_count || 0
      });
      if (items.length >= 20) break;
    }
    var banner = head && head.banner_urls && head.banner_urls[0] ? String(head.banner_urls[0]).replace(/^http:/, 'https:') : '';
    return {
      items: items,
      header: {
        title: (head && head.topic_title) || '',
        banner: banner,
        readCount: (head && head.read_count) || 0,
        talkCount: (head && head.talk_count) || 0
      }
    };
  }

  function plainText(s) {
    return String(s || '')
      .replace(/<br\s*\/?>/gi, '\n')
      .replace(/<[^>]+>/g, '')
      .replace(/&nbsp;/g, ' ')
      .replace(/&amp;/g, '&')
      .replace(/&lt;/g, '<')
      .replace(/&gt;/g, '>')
      .replace(/&quot;/g, '"')
      .replace(/&#\d+;/g, '')
      .replace(/\u200b/g, '')
      .trim();
  }

  /* 任意结果竞速：和 raceList 一样，只是返回值可以是对象 */
  function raceAny(tasks, budget) {
    return new Promise(function (resolve, reject) {
      var left = tasks.length, done = false, errs = [];
      if (!left) return reject(new Error('没有可用的取数通道'));
      var timer = setTimeout(function () {
        if (done) return;
        done = true;
        var e = new Error('取数通道都没响应');
        e.detail = errs.join('；');
        reject(e);
      }, budget || 10000);
      tasks.forEach(function (t) {
        Promise.resolve()
          .then(function () { return t.run(); })
          .then(function (v) {
            if (done) return;
            done = true;
            clearTimeout(timer);
            resolve({ value: v, prov: t.label });
          })
          .catch(function (err) {
            errs.push(t.label + '：' + errMsg(err));
            if (--left === 0 && !done) {
              done = true;
              clearTimeout(timer);
              var e = new Error('取数通道都没成功');
              e.detail = errs.join('；');
              reject(e);
            }
          });
      });
    });
  }

  /* ---------------- 公共取数通道池 ----------------

     浏览器读别人的 JSON/XML 会被 CORS 拦（对方不给 access-control-allow-origin）。
     国内能直接用的几条公开通道都不稳定，还会按 IP 限流，所以这里不指望「某一条永远在」，
     而是把它们做成一个带健康记忆的池子：

       · 成功的记一笔，下次排前面；429 / 403 的冷却 5 分钟，别硬撞；
       · 一次只打 2 条，谁先给出合格内容就用谁，不把三家一起打爆；
       · 同一个 URL 90 秒内只取一次，反复点同一条话题不再重复请求。 */

  var PX_KEY = 'wj.px.v1';
  var PX_COOL = 5 * 60000;

  var PX = [
    { id: 'corslol', label: 'cors.lol', wrap: function (u) { return 'https://api.cors.lol/?url=' + encodeURIComponent(u); } },
    { id: 'allorigins', label: 'allorigins', wrap: function (u) { return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u); } },
    { id: 'codetabs', label: 'codetabs', wrap: function (u) { return 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u); } },
    { id: 'corsfix', label: 'corsfix', wrap: function (u) { return 'https://proxy.corsfix.com/?' + u; } },
    { id: 'cors_eu', label: 'cors.eu.org', wrap: function (u) { return 'https://cors.eu.org/' + u; } },
    { id: 'thing', label: 'thingproxy', wrap: function (u) { return 'https://thingproxy.freeboard.io/fetch/' + u; } }
  ];

  function pxMap() {
    try {
      var m = JSON.parse(localStorage.getItem(PX_KEY) || '{}');
      return (m && typeof m === 'object') ? m : {};
    } catch (e) { return {}; }
  }

  function pxSave(m) {
    try { localStorage.setItem(PX_KEY, JSON.stringify(m)); } catch (e) { /* ignore */ }
  }

  /* 排序：能用的先上（成功次数多、上次成功近），冷却中的排到队尾而不是扔掉——
     宁可最后再试一次，也别因为「全都刚被限流」就直接失败。 */
  function pxOrder() {
    var m = pxMap(), now = Date.now();
    var list = PX.slice();
    list.sort(function (a, b) {
      var sa = m[a.id] || {}, sb = m[b.id] || {};
      var ca = (sa.until && sa.until > now) ? 1 : 0;
      var cb2 = (sb.until && sb.until > now) ? 1 : 0;
      if (ca !== cb2) return ca - cb2;
      if (ca) return (sa.until || 0) - (sb.until || 0);
      var ra = sa.ok || 0, rb = sb.ok || 0;
      if (ra !== rb) return rb - ra;
      return (sb.last || 0) - (sa.last || 0);
    });
    return list;
  }

  function pxMark(id, ok, status) {
    var m = pxMap(), s = m[id] || { ok: 0, fail: 0 };
    if (ok) {
      s.ok = (s.ok || 0) + 1;
      s.last = Date.now();
      delete s.until;
      s.fail = 0;
    } else {
      s.fail = (s.fail || 0) + 1;
      /* 429 是限流，半分钟就恢复；403 是被这个站点挡了，先别撞十分钟 */
      if (status === 429) s.until = Date.now() + 45000;
      else if (status === 403) s.until = Date.now() + 10 * 60000;
      else if (status === 503) s.until = Date.now() + 2 * 60000;
      else if (s.fail >= 3) s.until = Date.now() + 60000;

    pxSave(m);

  /* 带状态码的取文本：CORS 被拦时 fetch 直接 TypeError（没有 status），

  async function pxFetchText(url, ms) {
    var tk = timeout(ms || 12000);

      var r = await fetch(url, { signal: tk.signal, cache: 'no-store' });
      var body = '';
      try { body = await r.text(); } catch (e2) { /* ignore */ }
      if (!r.ok) {
        var err = new Error('HTTP ' + r.status);
        err.status = r.status;
        err.body = body;
        throw err;

      return body;
    } finally { tk.done(); }

  /* 判断代理到底有没有把内容拿回来：200 也可能是「Rate limit exceeded」这种纯文本 */
  function pxDecode(body, kind) {
    var s = String(body || '').trim();
    if (!s) return null;
    if (kind === 'xml') return (/<item[\s>]|<entry[\s>]/i.test(s) ? s : null);
    if (kind === 'html') return (s.length > 300 && /<\w+[\s>]/.test(s) ? s : null);
    try { return JSON.parse(s); } catch (e) { /* 有的代理会在前面加一行日志 */ }
    var i = s.indexOf('{');
    if (i > -1) {
      try { return JSON.parse(s.slice(i)); } catch (e2) { /* ignore */ }
    }
    return null;
  }

  var pxMemo = {};

  /* 一批（默认 2 条）同时发车，谁先给出合格内容就用谁 */
  function pxRace(batch, url, kind, ms, detail) {
    return new Promise(function (resolve, reject) {
      var left = batch.length, done = false;
      var timer = setTimeout(function () {
        if (done) return;
        done = true;
        detail.push(batch.map(function (p) { return p.label + '：超时'; }).join('、'));
        reject(new Error('超时'));
      }, ms + 300);
      batch.forEach(function (p) {
        pxFetchText(p.wrap(url), ms).then(function (body) {
          var v = pxDecode(body, kind);
          if (v === null) {
            var bad = new Error('返回的不是' + (kind === 'xml' ? ' RSS' : kind === 'html' ? '网页' : ' JSON'));
            bad.status = 200;
            throw bad;
          }
          if (done) return;
          done = true;
          clearTimeout(timer);
          pxMark(p.id, true);
          resolve({ data: v, from: p.label });
        }).catch(function (err) {
          pxMark(p.id, false, err && err.status);
          detail.push(p.label + '：' + errMsg(err));
          if (--left === 0 && !done) {
            done = true;
            clearTimeout(timer);
            reject(new Error('这一批都没成功'));
          }
        });
      });
    });
  }

  /* 依次打若干批，直到拿到合格内容或预算用完 */
  async function pxGet(url, opts) {
    opts = opts || {};

    var ms = opts.ms || 12000;
    var budget = opts.budget || Math.min(ms * 2 + 4000, 30000);
    var ck = kind + ' ' + url;

    if (c && Date.now() - c.at < (opts.ttl || 90000)) return { data: c.data, from: c.from, cached: true };

    var list = pxOrder();
    if (!list.length) {
      var e0 = new Error('没有可用的公共通道');
      e0.code = 'NO_PROXY';
      throw e0;
    }

    var started = Date.now(), idx = 0, detail = [];
    var width = opts.width || 3;
    while (idx < list.length) {
      var left = budget - (Date.now() - started);
      if (left < 1500) break;
      var batch = list.slice(idx, idx + width);
      idx += batch.length;
      try {
        var got = await pxRace(batch, url, kind, Math.min(ms, left), detail);
        pxMemo[ck] = { at: Date.now(), data: got.data, from: got.from };
        return got;
      } catch (e) { /* 换下一批 */ }
    }

    var err = new Error('公共通道都没成功');
    err.detail = detail.join('；');
    throw err;
  }

  /* 头条话题：头图接口本身带 CORS，浏览器能直连；
     帖子流（topic_innerflow）只要请求里带 Origin 就 403，必须过一层公共通道。 */
  async function ttTopicLive(id, n) {
    var headUrl = 'https://api.toutiaoapi.com/api/trending/topic/' + id + '/?rank=';
    var feedUrl = 'https://api.toutiaoapi.com/api/feed/topic_innerflow/v1/?query_id=' + id +
      '&offset=0&count=10&aid=13&category=topic_innerflow&ttfrom=amos_land_normal' +
      '&stream_api_version=88&client_extra_params=' + encodeURIComponent('{"is_webview":"1"}');

    var headP = getJSON(headUrl, 6000).catch(function () { return null; });
    var feed = await pxGet(feedUrl, { kind: 'json', ms: 16000, width: 2, ttl: 120000 });
    var out = ttParse(feed.data, await headP);
    if (!out.items.length && !out.header.banner) throw new Error('这个话题暂时没有内容');
    out.items = out.items.slice(0, n || 20);
    out.from = '头条 · ' + feed.from;
    return out;
  }

  /* ---------------- 微博：不用自己部署也能实时 ----------------

     微博的搜索接口要访客 Cookie（genvisitor2 换 SUB），浏览器拿不到也带不上，
     所以「直连」这条路永远是死的。但微博关键词搜索被做成了 RSS：
     公共 RSSHub 镜像 /weibo/keyword/xxx 每次请求都是现抓微博，返回带作者、正文、
     原帖链接和发布时间 —— 这就是话题下别人刚发的帖子。

     镜像本身不一定给 CORS 头，所以再套一层公共通道读 RSS。整条链路
     浏览器 → 公共通道 → RSSHub 镜像 → 微博，全部是现取的，没有仓库缓存参与。 */

  var RSSHUB = [
    'https://rsshub.woodland.cafe',
    'https://rsshub.rssforever.com',
    'https://hub.slarker.me'
  ];

  function rsshubList() {
    var arr = null;
    try { arr = JSON.parse(localStorage.getItem('wj.rsshub') || 'null'); } catch (e) { arr = null; }
    if (!Array.isArray(arr) || !arr.length) arr = RSSHUB.slice();
    var out = [];
    arr.forEach(function (x) {
      var s = tidyBase(x);
      if (s && out.indexOf(s) < 0) out.push(s);
    });
    return out;
  }

  function rssItems(xml) {

  function plainText(s) {

      .replace(/<br\s*\/?>/gi, '\n')
      .replace(/<[^>]+>/g, '')

      .replace(/&amp;/g, '&')
      .replace(/&lt;/g, '<')

      tasks.forEach(function (t) {

          .then(function () { return t.run(); })
          .then(function (v) {

       · 成功的记一笔，下次排前面；429 / 403 的冷却 5 分钟，别硬撞；
       · 一次只打 2 条，谁先给出合格内容就用谁，不把三家一起打爆；
       · 同一个 URL 90 秒内只取一次，反复点同一条话题不再重复请求。 */

  var PX_KEY = 'wj.px.v1';
  var PX_COOL = 5 * 60000;

  var PX = [
    { id: 'corslol', label: 'cors.lol', wrap: function (u) { return 'https://api.cors.lol/?url=' + encodeURIComponent(u); } },
    { id: 'allorigins', label: 'allorigins', wrap: function (u) { return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u); } },
    { id: 'codetabs', label: 'codetabs', wrap: function (u) { return 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u); } },
    { id: 'corsfix', label: 'corsfix', wrap: function (u) { return 'https://proxy.corsfix.com/?' + u; } },
    { id: 'cors_eu', label: 'cors.eu.org', wrap: function (u) { return 'https://cors.eu.org/' + u; } },
    { id: 'thing', label: 'thingproxy', wrap: function (u) { return 'https://thingproxy.freeboard.io/fetch/' + u; } }
  ];

  function pxMap() {
    try {
      var m = JSON.parse(localStorage.getItem(PX_KEY) || '{}');
      return (m && typeof m === 'object') ? m : {};
    } catch (e) { return {}; }
  }

  function pxSave(m) {
    try { localStorage.setItem(PX_KEY, JSON.stringify(m)); } catch (e) { /* ignore */ }
  }

  /* 排序：能用的先上（成功次数多、上次成功近），冷却中的排到队尾而不是扔掉——
     宁可最后再试一次，也别因为「全都刚被限流」就直接失败。 */
  function pxOrder() {
    var m = pxMap(), now = Date.now();
    var list = PX.slice();
    list.sort(function (a, b) {
      var sa = m[a.id] || {}, sb = m[b.id] || {};
      var ca = (sa.until && sa.until > now) ? 1 : 0;
      var cb2 = (sb.until && sb.until > now) ? 1 : 0;
      if (ca !== cb2) return ca - cb2;
      if (ca) return (sa.until || 0) - (sb.until || 0);
      var ra = sa.ok || 0, rb = sb.ok || 0;
      if (ra !== rb) return rb - ra;
      return (sb.last || 0) - (sa.last || 0);
    });
    return list;
  }

  function pxMark(id, ok, status) {
    var m = pxMap(), s = m[id] || { ok: 0, fail: 0 };
    if (ok) {
      s.ok = (s.ok || 0) + 1;
      s.last = Date.now();
      delete s.until;
      s.fail = 0;
    } else {
      s.fail = (s.fail || 0) + 1;
      /* 429 是限流，半分钟就恢复；403 是被这个站点挡了，先别撞十分钟 */
      if (status === 429) s.until = Date.now() + 45000;
      else if (status === 403) s.until = Date.now() + 10 * 60000;
      else if (status === 503) s.until = Date.now() + 2 * 60000;
      else if (s.fail >= 3) s.until = Date.now() + 60000;

  async function pxFetchText(url, ms) {

      try { body = await r.text(); } catch (e2) { /* ignore */ }

    if (kind === 'html') return (s.length > 300 && /<\w+[\s>]/.test(s) ? s : null);

  function pxRace(batch, url, kind, ms, detail) {
    return new Promise(function (resolve, reject) {
      var left = batch.length, done = false;
      var timer = setTimeout(function () {
        if (done) return;
        done = true;
        detail.push(batch.map(function (p) { return p.label + '：超时'; }).join('、'));
        reject(new Error('超时'));
      }, ms + 2000);
      batch.forEach(function (p) {
        pxFetchText(p.wrap(url), ms).then(function (body) {
          var v = pxDecode(body, kind);
          if (v === null) {
            var bad = new Error('返回的不是' + (kind === 'xml' ? ' RSS' : kind === 'html' ? '网页' : ' JSON'));
            bad.status = 200;
            throw bad;

          done = true;
          clearTimeout(timer);
          pxMark(p.id, true);
          resolve({ data: v, from: p.label });

    var ms = opts.ms || 12000;
    var budget = opts.budget || Math.min(ms * 2 + 4000, 30000);
    var ck = kind + ' ' + url;
    var c = pxMemo[ck];
    if (c && Date.now() - c.at < (opts.ttl || 90000)) return { data: c.data, from: c.from, cached: true };

    var list = pxOrder();
    if (!list.length) {
      var e0 = new Error('没有可用的公共通道');
      e0.code = 'NO_PROXY';

    var started = Date.now(), idx = 0, detail = [];
    var width = opts.width || 2;

      var left = budget - (Date.now() - started);
      if (left < 1500) break;
      var batch = list.slice(idx, idx + width);
      idx += batch.length;
      try {
        var got = await pxRace(batch, url, kind, Math.min(ms, left), detail);
        pxMemo[ck] = { at: Date.now(), data: got.data, from: got.from };
        return got;
      } catch (e) { /* 换下一批 */ }
    }

    var err = new Error('公共通道都没成功');
    err.detail = detail.join('；');
    throw err;
  }

  function saveLocalTopic(k, items, header) {
    try {
      localStorage.setItem(k, JSON.stringify({ at: Date.now(), items: items, header: header }));
      var keys = [];
      for (var i = 0; i < localStorage.length; i++) {
        var kk = localStorage.key(i);
        if (kk && kk.indexOf('wj.tp.') === 0) keys.push(kk);
      }
      if (keys.length > 24) {
        keys.slice(0, keys.length - 24).forEach(function (x) { try { localStorage.removeItem(x); } catch (e) { /* ignore */ } });
      }
    } catch (e) { /* 配额满了就算了 */ }
  }

  function readLocalTopic(k) {
    try {
      var o = JSON.parse(localStorage.getItem(k) || 'null');
      if (o && o.at && Date.now() - o.at < 30 * 60000 && o.items && o.items.length) return o;
    } catch (e) { /* ignore */ }
    return null;
  }

  /* 只看本地：本机上次实时 + 仓库缓存，不发任何实时请求。
     用来点开话题时先把内容铺上，实时结果回来再换。 */
  async function topicCached(src, id, title, n) {
    src = src || 'weibo';
    var mine = readLocalTopic(localTopicKey(src, id, title));
    if (mine) return { items: mine.items.slice(0, n || 12), header: mine.header || null, via: 'cache', at: mine.at, from: '本机上次实时' };
    var snap = await topicSnapshot();
    var hit = pickTopic(snap, src, title, id);
    if (hit && ((hit.items && hit.items.length) || hit.banner)) {
      return {
        items: (hit.items || []).slice(0, n || 12),
        header: { title: hit.title || title, banner: hit.banner || '', readCount: hit.readCount || 0, talkCount: hit.talkCount || 0 },
        via: 'cache',
        at: hit.at || (snap.updatedAt ? new Date(snap.updatedAt).getTime() : 0),
        from: '仓库缓存'
      };
    }
    return null;
  }

  async function topic(src, id, title, n, opts) {
    src = src || 'weibo';
    var budget = (opts && opts.budget) || 12000;
    var bases = parseBases().filter(function (b) { return !isBaseDead(b); });
    if (await hasServer()) bases = [''].concat(bases);

    var deadline = Date.now() + budget;

    /* 第一梯队：配置好的解析服务 + 头条直连。数据最全（正文、配图、互动数）。 */
    var prefer = bases.map(function (b) {
      return {
        label: '解析服务',
        run: function () {
          return getJSON(apiUrl(b, '/api/topic', { src: src, id: id || '', title: title || '', n: n || 12 }), 14000)
            .then(function (d) {
              if (d && d.ok) { markBaseDead(b, false); return { items: d.items || [], header: d.header || null }; }
              throw new Error((d && d.error) || '没有返回内容');
            }, function (e) {
              /* 只有网络层失败才算「这个地址不通」；业务失败说明服务是活的 */
              if (e && !e.status) markBaseDead(b, true);
              throw e;
            });
        }
      };
    });

    /* 头条有一条公共线路，不配任何东西也能拿到此刻的帖子 */
    if (src === 'toutiao' && id) {
      prefer.push({ label: '头条实时', run: function () { return ttTopicLive(id, n); } });
    }

    /* 第二梯队：微博镜像。只有文字（微博的图在镜像里被换成了「[图片]」），
       所以配了解析服务时不让它抢——先让服务端那条跑，它挂了才用镜像。 */
    var fallback = [];
    if (src === 'weibo' && String(title || '').trim()) {
      fallback.push({
        label: '微博镜像',
        run: function () { return weiboRssTopic(title, n, Math.max(10000, Math.min(16000, deadline - Date.now()))); }
      });
    }

    var liveErr = null;
    var lk = localTopicKey(src, id, title);

    async function attempt(list, ms) {
      var got = await raceAny(list, ms);
      var live = { items: got.value.items || [], header: got.value.header || null };
      if (live.items.length) saveLocalTopic(lk, live.items, live.header);
      return { items: live.items, header: live.header, via: 'live', at: Date.now(), from: got.prov };
    }

    if (prefer.length) {
      try {
        return await attempt(prefer, budget);
      } catch (e) {
        liveErr = e;
      }
    }
    if (fallback.length) {
      try {
        return await attempt(fallback, Math.max(8000, deadline - Date.now()));
      } catch (e2) {
        if (!liveErr) liveErr = e2;
      }
    }

    /* 实时没成：把原因带上，界面才能说清是「限流了」还是「没配服务」 */
    var why = liveErr ? (liveErr.detail || liveErr.message || '') : '';

    var mine = readLocalTopic(lk);
    if (mine) {
      return { items: mine.items.slice(0, n || 12), header: mine.header || null, via: 'cache', at: mine.at, from: '本机上次实时', why: why };
    }

    var snap = await topicSnapshot();
    var hit = pickTopic(snap, src, title, id);
    if (hit && ((hit.items && hit.items.length) || hit.banner)) {
      return {
        items: (hit.items || []).slice(0, n || 12),
        header: { title: hit.title || title, banner: hit.banner || '', readCount: hit.readCount || 0, talkCount: hit.talkCount || 0 },
        via: 'cache',
        at: hit.at || (snap.updatedAt ? new Date(snap.updatedAt).getTime() : 0),
        why: why
      };
    }
    if (liveErr) throw liveErr;
    var e2 = new Error('没有配置解析服务');
    e2.code = 'NO_RELAY';
    throw e2;
  }

  async function posts(src, title, n, id) {
    var t = await topic(src, id, title, n);
    return t.items || [];
  }


  /* 新浪图床不认没有 referer 的请求，浏览器直接 <img> 会 403，走解析服务转一次 */
  function imgUrl(u) {
    var s = String(u || '');
    if (!s) return '';
    if (!/sinaimg\.cn|weibocdn\.com|sina\.com\.cn/i.test(s)) return s;
    var h = (typeof location !== 'undefined' && location.hostname) || '';
    /* 页面本身就跑在解析服务上（localhost / 自建域名）：同源转发，别绕公网 */
    if (/^(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])$/.test(h)) {
      return (location.origin || '') + '/api/img?u=' + encodeURIComponent(s);
    }
    var bases = parseBases();
    if (!bases.length) return s;
    return bases[0].replace(/\/+$/, '') + '/api/img?u=' + encodeURIComponent(s);
  }

  async function parseLink(raw, onStep, hintTitle) {
    var url = pickUrl(raw);
    if (!url) throw new Error('没有识别到以 http 开头的链接');
    var titleHint = String(hintTitle || '').trim();

    var cacheKey = 'wj.parse.v2.' + url;
    try {
      var cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
      if (cached && cached.text && Date.now() - cached.at < 36e5) return cached;
    } catch (e) { /* ignore */ }

    var isWx = urlKind(url) === 'wechat';
    var minLen = isWx ? 90 : 120;

    function shape(r, via) {
      var out = {
        title: r.title || '',
        text: r.text,
        chars: r.chars || (r.text || '').length,
        via: via,
        net: r.via || '',
        note: r.note || '',
        images: r.images || [],
        video: !!r.video,
        related: r.related || null,
        at: Date.now()
      };
      try { localStorage.setItem(cacheKey, JSON.stringify(out)); } catch (e) { /* ignore */ }
      return out;
    }

    /* 服务端失败一次就记下来：502 多半是实例刚重启，隔 600ms 再试一次通常就好了 */
    function viaServer(base, label) {
      return function () {
        return callBase(base, url, minLen, 18000, titleHint).catch(function (e) {
          if (!(e && e.status >= 500)) throw e;
          return new Promise(function (r) { setTimeout(r, 600); })
            .then(function () { return callBase(base, url, minLen, 15000, titleHint); });
        }).then(function (r) { return { data: r, label: label }; });
      };
    }

    var tasks = [];
    var bases = parseBases();
    var dsErr = null;

    /* 0) DeepSeek 官方抓取：不依赖中转，公众号也稳，配了 Key 就先走这条。
          它一家通，就不必再等公共通道那堆不确定的东西。 */
    if (dsKey()) {
      if (onStep) onStep('正在用 DeepSeek 抓取正文', 1, 1);
      try {
        var dsf = await dsFetch(url, 22000);
        return shape({ title: dsf.title, text: dsf.text, chars: dsf.chars, images: dsf.images, via: 'deepseek' }, 'deepseek');
      } catch (e) {
        dsErr = e;
        /* 401/402 是 Key 本身的问题，继续用别的通道也没意义，直接告诉用户 */
        if (e.status === 401 || e.status === 402) {
          var ke = new Error(e.message);
          ke.code = e.status === 401 ? 'DS_AUTH' : 'DS_PAID';
          ke.detail = '到「我的 → 解析服务」重新填 DeepSeek Key（platform.deepseek.com/api_keys 生成）。';
          ke.url = url;
          throw ke;
        }
      }
    }

    /* 连不上过一次的地址，先记 30 分钟别再等它。
       国内直连 workers.dev 基本必超时，每次失败都花 18 秒等一个注定不通的地址，是最伤的体验。 */
    function deadMap() {
      try { var m = JSON.parse(localStorage.getItem('wj.base.dead') || '{}'); return (m && typeof m === 'object') ? m : {}; } catch (e) { return {}; }
    }
    function baseKey(b) { return hostOf(b) || b; }
    function isDead(b) { var t = deadMap()[baseKey(b)]; return !!(t && Date.now() - t < 8 * 60000); }
    function markBase(b, dead) {
      try {
        var m = deadMap();
        if (dead) m[baseKey(b)] = Date.now(); else delete m[baseKey(b)];
        localStorage.setItem('wj.base.dead', JSON.stringify(m));
      } catch (e) { /* ignore */ }
    }

    var spare = [];
    bases.forEach(function (b) {
      if (isDead(b)) { spare.push(b); return; }
      tasks.push({ label: hostOf(b) || '解析服务', via: 'cloud', run: function () {
        /* 被墙域名只给 4 秒：SNI 阻断通常在握手阶段就失败，等 9 秒纯粹是让用户干瞪眼。
           自建云端节点给 16 秒：知乎这类站点服务端要用无头浏览器渲染，通常要 6-12 秒，
           9 秒会在服务端返回前就放弃，明明能解析却报失败。总预算仍是 20 秒。 */
        var budget = walledHost(b) ? 4000 : 16000;
        return callBase(b, url, minLen, budget, titleHint).then(
          function (r) { markBase(b, false); return r; },
          /* 只有网络层失败（超时/连不上）才记「不通」；业务失败说明服务是活的 */
          function (e) { if (!(e && e.status) && !(e && e.code)) markBase(b, true); throw e; }
        );
      } });
    });

    PROXIES.forEach(function (p) {
      tasks.push({ label: p.label, via: p.id, run: async function () {
        var target = p.wrap(url);
        if (p.text) {
          var body = await getText(target, 12000, { headers: { Accept: 'text/plain' } });
          body = body.replace(/^Title:.*$/gm, '').replace(/^URL Source:.*$/gm, '').trim();
          var text = clean(body);
          if (text.length < minLen) throw new Error('正文只有 ' + text.length + ' 字');
          return { title: '', text: text.slice(0, 12000), chars: text.length };
        }
        var html = await getText(target, 10000);
        var parsed = extractHtml(html);
        if (!parsed || parsed.text.length < minLen) {
          throw new Error('没取到正文（' + hostOf(url) + ' 可能要求登录或限制了抓取）');
        }
        return { title: parsed.title, text: parsed.text.slice(0, 12000), chars: parsed.text.length };
      } });
    });

    /* 地址填了但全被标成「不通」：不能骗用户说「没配置」。单独给一个错误码，
       界面提示「连不上，去检测一下」，并提供粘贴全文的退路。 */
    if (!tasks.length && bases.length) {
      var walled = bases.filter(function (b) { return !!walledHost(b); });
      var deadErr = new Error(walled.length ? '解析地址被国内网络拦了，这次没取到正文'
                                           : '解析服务连不上，这次没取到正文');
      deadErr.code = 'DEAD_BASE';
      deadErr.detail = bases.map(function (b) {
        return (hostOf(b) || b) + '：' + (walledHost(b) ? '域名在国内不可达（SNI 阻断）' : '最近一次请求超时或被网络拦截');
      }).join('\n') +
        (walled.length ? '\n' + WALLED_ADVICE : '\n到「我的 → 解析服务」点「保存并检测」看它是否还在线；地址失效就重新部署一个（页面里有一键部署）。');
      deadErr.walled = !!walled.length;
      deadErr.url = url;
      throw deadErr;
    }

    if (!tasks.length) {
      var none = new Error('没有配置解析服务，取不到网页正文');
      none.code = 'NO_CHANNEL';
      none.detail = '浏览器不能直接读别人的网页（跨域限制），要有一台服务器代抓。\n' +
        '两条路：① 到「我的 → 解析服务」填一个 Cloudflare Worker 地址（仓库 worker/ 里有一份，部署约 3 分钟）；' +
        '② 或在新建页点「直接粘全文」，把正文复制进来，改写效果一样。';
      none.url = url;
      throw none;
    }

    if (onStep) onStep('并发请求 ' + tasks.length + ' 条通道', 1, 1);

    async function attempt(list, budget) {
      var win = await firstSuccess(list, budget || 20000);
      return shape(win.data, win.task.via);
    }

    var serverOnly = tasks.filter(function (t) { return t.via === 'cloud' || t.via === 'server'; });

    try {
      /* 没配自己的服务时，公共线路给 12 秒就够了：再等下去只是让用户干瞪眼 */
      return await attempt(tasks, bases.length ? 20000 : 9000);
    } catch (e0) {
      /* 被标记「不通」的地址再给一次机会：可能刚换了网络 */
      if (spare.length) {
        var retryList = spare.map(function (b) {
          return { label: hostOf(b) || '解析服务', via: 'cloud', run: function () { return callBase(b, url, minLen, 8000, titleHint); } };
        });
        try { return await attempt(retryList, 9000); } catch (e1) { /* 继续 */ }
      }
      /* 云端实例睡觉或重启时会回 5xx，唤醒通常要几秒 */
      if (/HTTP 5\d\d/.test(String((e0 && e0.detail) || '')) && serverOnly.length) {
        if (onStep) onStep('解析服务正在唤醒，稍等重试', 1, 1);
        await new Promise(function (r) { setTimeout(r, 2500); });
        try { return await attempt(serverOnly, 20000); } catch (e2) { e0 = e2; }
      }

      /* 最后一招：去掉跟踪参数再取一次。小蜜蜂、头条、小红书的分享链接
         常带一长串 spss/utm 参数，个别站点按整条 URL 取会直接判失效，
         而正文其实只跟路径里的 ID 有关。 */
      var bare = bareUrl(url);
      if (bare) {
        if (onStep) onStep('换一条干净的链接再试', 1, 1);
        var bases2 = parseBases();
        for (var bi = 0; bi < bases2.length; bi++) {
          try {
            var rb = await callBase(bases2[bi], bare, minLen, 15000, titleHint);
            if (rb) return shape(rb, 'cloud');
          } catch (e3) { /* 换下一个 */ }
        }
      }
      var err = new Error((e0 && e0.code === 'DEAD' && e0.message) || '这个链接没取到正文');
      err.detail = (e0 && e0.detail) || (e0 && e0.message);
      /* 配了 workers.dev 这类国内不可达的地址：把「为什么」写在最前面，别让用户去猜配置 */
      var walledAll = bases.filter(function (b) { return !!walledHost(b); });
      if (walledAll.length) {
        err.detail = '配置的 ' + (hostOf(walledAll[0]) || walledAll[0]) + ' 在国内连不上。\n' + WALLED_ADVICE +
          (err.detail ? '\n\n其他通道：' + err.detail : '');
        err.walled = true;
      }
      if (dsErr) err.detail = 'DeepSeek 抓取：' + dsErr.message + '\n' + (err.detail || '');
      err.title = (e0 && e0.title) || titleHint;
      err.code = (e0 && e0.code) || '';
      /* 没有任何一条能用的通道：先把「最省事的办法」摆在最前面 */
      if (!bases.length && !dsKey()) {
        err.code = 'NO_CHANNEL';
        err.message = '这次没取到正文';
        err.detail = '两条免费的路：\n' +
          '① 直接点「粘贴全文」，把正文复制进来，改写效果完全一样；\n' +
          '② 到我「我的 → 解析服务」点「检测」，确认内置解析节点是否在线，或填一个自己的免费 Worker 地址。';
      } else if (!bases.length && dsErr) {
        err.message = 'DeepSeek 这次没抓到：' + dsErr.message;
      }
      /* 竞速层会把多个通道的失败拼成 detail，code 在这一层丢了，只能从文字里认 */
      if (!err.code && /已经失效|内容不存在|已被删除|分享链接过期/.test(String(err.detail || ''))) {
        err.code = 'DEAD';
        err.title = '';
        err.message = '这条链接已经失效：内容被删除，或分享链接过期。';
      }
      err.url = url;
      err.kind = urlKind(url);
      throw err;
    }
  }

  /* 各家「OpenAI 兼容」地址并不都是 /v1：
     智谱是 /api/paas/v4，阿里百炼是 /compatible-mode/v1，火山方舟是 /api/v3……
     以前一律补 /v1，用户只填域名时请求必然 404，看起来就像「配好了却用不了」。 */
  var BASE_FIX = [
    { re: /(^|\.)(open\.)?bigmodel\.cn$/i, path: '/api/paas/v4' },
    { re: /(^|\.)dashscope\.aliyuncs\.com$/i, path: '/compatible-mode/v1' },
    { re: /(^|\.)integrate\.api\.nvidia\.com$/i, path: '/v1' },
    { re: /(^|\.)openrouter\.ai$/i, path: '/api/v1' },
    { re: /(^|\.)api\.groq\.com$/i, path: '/openai/v1' },
    { re: /(^|\.)ark\.cn-beijing\.volces\.com$/i, path: '/api/v3' },
    { re: /(^|\.)api\.together\.xyz$/i, path: '/v1' },
    { re: /(^|\.)api\.fireworks\.ai$/i, path: '/inference/v1' }
  ];

  function normBase(base) {
    var b = String(base || '').trim().replace(/\/+$/, '');
    if (!b) return '';
    if (!/^https?:\/\//i.test(b)) b = 'https://' + b;
    var u;
    try { u = new URL(b); } catch (e) { return b; }
    var p = String(u.pathname || '').replace(/\/+$/, '');
    if (!p || p === '/') {
      for (var i = 0; i < BASE_FIX.length; i++) {
        if (BASE_FIX[i].re.test(u.hostname)) { p = BASE_FIX[i].path; break; }
      }
    }
    if (!p) p = '/v1';
    /* 少数聚合站把 OpenAI 兼容端点挂在 /openai 这类非版本路径上，补 /v1 反而 404 */
    else if (/(^|\.)text\.pollinations\.ai$/i.test(u.hostname)) p = p;
    else if (!/\/v\d+$/.test(p)) p += '/v1';
    return u.origin + p;
  }

  function headers(key) {
    var h = { 'Content-Type': 'application/json', Accept: 'application/json' };
    if (key) h.Authorization = 'Bearer ' + key;
    return h;
  }

  async function llmFetch(base, path, opts) {

          signal: tk2.signal,
          headers: { 'Content-Type': 'application/json' },
          cache: 'no-store',

    err.relayTried = list.length;
    err.host = host;
    err.detail = String((lastErr && lastErr.message) || '');

    { re: /gemini/i, name: 'Gemini 系', good: '超长上下文与多模态，适合整篇素材融合' },
    { re: /deepseek.*r1|deepseek.*reason/i, name: 'DeepSeek R1', good: '中文推理与成本优势明显，适合结构化改写' },
    { re: /deepseek/i, name: 'DeepSeek', good: '中文语感好、价格低，适合批量改写' },
    { re: /qwen|通义/i, name: 'Qwen 系', good: '中文理解扎实，长文本与电商文案见长' },
    { re: /glm|chatglm|cogview|智谱/i, name: 'GLM 系', good: '中文书面语规范，适合资讯与公文风格' },
    { re: /kimi|moonshot/i, name: 'Kimi', good: '长文档阅读与摘要，适合把长材料压缩成稿' },
    { re: /doubao|豆包|ep-202/i, name: '豆包', good: '中文口语化与短视频脚本自然' },
    { re: /ernie|文心/i, name: '文心', good: '中文资讯与营销文案，合规表达稳' },
    { re: /hunyuan|混元/i, name: '混元', good: '中文通用写作，风格中性' },
    { re: /llama/i, name: 'Llama 系', good: '开源通用能力，英文优于中文' },
    { re: /mistral|mixtral/i, name: 'Mistral', good: '开源系，英文稳，中文一般' },
    { re: /grok/i, name: 'Grok', good: '观点锐利，适合短评与社媒语气' },

    { re: /yi-|零一/i, name: 'Yi', good: '中英双语均衡' }
  ];

  /* 明显不是「文字对话」的模型，先在列表里剔掉，省得测几百个 */

  var VISION_RE = /(vision|-vl\b|vl-|v\d|4v\b|4o\b|omni|multimodal|internvl|pixtral|llava|minicpm-v|step-1v|glm-4v|qwen-vl|grok-vision|nemotron.*vl)/i;

      { id: 'glm-4-flash-250414', kind: 'chat' },
      { id: 'glm-4v-flash', kind: 'chat' },
      { id: 'glm-4.5-flash', kind: 'chat' },
      { id: 'glm-z1-flash', kind: 'chat' },

      { id: 'gpt-oss:20b', kind: 'chat' }

    var s = 0;

    if (m.kind === 'image') s += 10;
    if (m.free) s += 12;
    if (/gpt-4o|gpt-4\.1|gpt-5|claude.*sonnet|deepseek-chat|glm-4\.5|glm-4-flash|qwen-plus|qwen-max|qwen3|kimi|moonshot|gemini-2|doubao|hunyuan|ernie/.test(String(m.id).toLowerCase())) s += 8;

  }

    if (d && d.data && Array.isArray(d.data.models)) return d.data.models;

  }

  async function listModels(cfg) {

    var host = hostOf(base);
    var extra = KNOWN_FREE[host] || [];
    for (var k = 0; k < extra.length; k++) {

    if (FREE_ANON_ONLY.host === host && String(cfg.key || '') === FREE_ANON_ONLY.key) {

      FREE_ANON_ONLY.ids.forEach(function (id) { allow[id] = 1; });

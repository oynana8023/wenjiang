    if (!out.length) {
      var msg = (firstErr && (firstErr.message || firstErr)) || '接口没有返回模型列表';
      if (/Failed to fetch|NetworkError|Load failed/i.test(String(msg))) {
        msg = '浏览器直连被拦（跨域），中转也没走通。检查 Key、地址，或到「解析服务」里填一个能用的中转地址。';
      }
      throw new Error(msg);
    }

    out.sort(function (a, b) {
      var rk = function (m) { return m.kind === 'chat' ? 0 : m.kind === 'image' ? 1 : 2; };
      return rk(a) - rk(b) || rankOf(b) - rankOf(a) || a.id.localeCompare(b.id);
    });
    return out;
  }

  function bestChat(models, exclude) {
    var best = null, bs = -1e9;
    (models || []).forEach(function (m) {
      if (m.kind !== 'chat' || m.status === 'missing' || m.status === 'paid' || m.status === 'auth' || m.status === 'error') return;
      if (exclude && exclude.indexOf(m.id) > -1) return;
      /* 识图模型能聊，但写长稿通常更差，同等条件下排在纯文本模型后面 */
      var s = rankOf(m) + (m.status === 'ok' ? 100 : 0) - (VISION_RE.test(String(m.id).toLowerCase()) ? 30 : 0);
      if (s > bs) { bs = s; best = m; }
    });
    return best;
  }

  function bestImage(models) {
    var best = null, bs = -1e9;
    (models || []).forEach(function (m) {
      if (m.kind !== 'image' || m.status === 'missing' || m.status === 'paid' || m.status === 'auth' || m.status === 'error') return;
      if (VISION_RE.test(String(m.id).toLowerCase())) return;
      var s = rankOf(m) + (m.status === 'ok' ? 100 : 0);
      if (s > bs) { bs = s; best = m; }
    });
    return best;
  }

  /* 并发池：一次测几个，别把免费额度打爆，也别让用户干等 */
  async function pool(items, n, fn, onTick) {
    var i = 0, done = 0, total = items.length;
    async function run() {
      while (i < total) {
        var idx = i++;
        await fn(items[idx], idx);
        done++;
        if (onTick) onTick(done, total, items[idx]);
      }
    }
    var arr = [];
    for (var k = 0; k < Math.min(n, total); k++) arr.push(run());
    await Promise.all(arr);
    return done;
  }

  /* 真发一条极短的对话，通了才算可用。
     只测文字模型。 */
  /* 探测用的真实写作题：比「在吗」贵一点，但能筛掉「列表里有、实际写不出东西」的模型 */
  var PROBE_ASK = '用一句通顺的中文写「周末的早晨」，18 到 30 个字，只输出这一句，不要解释。';

  async function probeModels(cfg, models, opts) {
    opts = opts || {};
    var base = normBase(cfg.base);
    var list = (models || []).filter(function (m) { return m.kind === 'chat'; });
    if (opts.limit) list = list.slice(0, opts.limit);
    var stat = { ok: 0, paid: 0, missing: 0, auth: 0, limited: 0, slow: 0, error: 0, total: list.length };
    if (!list.length) return stat;
    var touched = [];

    await pool(list, opts.conc || 4, async function (m) {
      touched.push(m);
      if (opts.stop && opts.stop()) return;
      try {
        var d;
        try {
          d = await llmJSON(base, '/chat/completions', {
            key: cfg.key,
            ms: opts.ms || 20000,
            body: {
              model: m.id,
              messages: [{ role: 'user', content: PROBE_ASK }],
              max_tokens: 160,
              temperature: 0.2,
              stream: false
            }
          });
        } catch (e1) {
          /* o 系列 / gpt-5 不收 max_tokens 和 temperature，换个写法再试一次 */
          if (!(e1.status === 400 && /max_tokens|max_completion|temperature|unsupported|parameter/i.test(e1.message || ''))) throw e1;
          d = await llmJSON(base, '/chat/completions', {
            key: cfg.key,
            ms: opts.ms || 30000,
            body: {
              model: m.id,
              messages: [{ role: 'user', content: PROBE_ASK }],
              max_completion_tokens: 400
            }
          });
        }
        var msg = (d && d.choices && d.choices[0] && d.choices[0].message) || {};
        var txt = msgText(msg);
        /* 只回一个「在」不算可用：必须真的按题目写出成句的中文。
           这一步是「可用」这个标签的唯一依据——标了可用，就一定能出内容。 */
        var cn = (txt.match(/[\u4e00-\u9fa5]/g) || []).length;
        if (!txt || txt.length < 8 || cn < 5) {
          m.status = 'error';
          m.why = txt ? ('只回了「' + txt.slice(0, 12) + '」，写不出成句内容') : '返回了空内容';
          stat.error = (stat.error || 0) + 1;
          return;
        }
        m.status = 'ok';
        m.why = '';
        m.said = txt.slice(0, 30);
        stat.ok++;
      } catch (e) {
        var w = whyFail(e.status, e.message);
        m.status = w;
        m.why = String(e.message || '').slice(0, 120);
        stat[w] = (stat[w] || 0) + 1;
      }
    }, function (done, total, m) {
      if (opts.onTick) opts.onTick(done, total, m, stat);
    });

    if (stat.auth >= Math.max(1, Math.ceil(stat.total * 0.6))) {
      /* 整批都 401 = Key 的问题，不是模型的问题。把刚才打的「Key 无效」擦掉，
         免得用户补好 Key 之后这些模型还一直挂着红标。 */
      touched.forEach(function (m) {
        if (m.status === 'auth') { m.status = ''; m.why = ''; }
      });
      var ae = new Error('Key 没通过验证（' + stat.auth + '/' + stat.total + ' 个模型都返回 401/403）');
      ae.code = 'AUTH';
      throw ae;
    }
    return stat;
  }

  /* 用识图模型核对「图里到底有没有这个东西」。没有就重画，这是唯一能自动
     发现「提示词与成图不符」的办法，纯靠文本侧猜是猜不出来的。 */
  async function visionAsk(cfg, imageUrl, question) {
    var base = normBase(cfg.base);
    var d = await llmJSON(base, '/chat/completions', {
      key: cfg.key,
      ms: 35000,
      body: {
        model: cfg.model,
        messages: [{
          role: 'user',
          content: [
            { type: 'text', text: question },
            { type: 'image_url', image_url: { url: imageUrl } }
          ]
        }],
        max_tokens: 60,
        temperature: 0
      }
    });
    var txt = d && d.choices && d.choices[0] && (d.choices[0].message || {}).content;
    if (!txt) return '';
    if (Array.isArray(txt)) txt = txt.map(function (p) { return p && p.text || ''; }).join(' ');
    return String(txt).trim();
  }

  async function testModel(cfg, model) {
    var base = normBase(cfg.base);
    var d = await llmJSON(base, '/chat/completions', {
      key: cfg.key,
      ms: 40000,
      body: {
        model: model || cfg.model,
        messages: [{ role: 'user', content: PROBE_ASK }],
        max_tokens: 160,
        temperature: 0.1,
        stream: false
      }
    });
    var txt = d && d.choices && d.choices[0] && (d.choices[0].message || {}).content;
    return { ok: true, text: String(txt || '').trim() || '已连通', usage: d.usage || null };
  }

  /* ---------------- 多服务商：按顺序降级 ---------------- */

  /* list: [{ id, name, base, key, model, imageModel, models }]
     默认服务商失败（401 / 429 / 超时 / 余额）就自动换下一家，返回是谁接的活 */
  /* ============================================================
     统一动态模型路由（v2.27）
     把所有能用的模型聚合进一个候选池，按「实时健康度」动态择优：
       1) 健康记忆：每个 host|model 记成功/失败与冷却截止，写进 localStorage，
          跨会话记住谁 429 / 超时 / Key 失效，一段时间内不再尝试，不浪费用户时间。
       2) 动态排名：每次调用前按冷却、历史失败、历史耗时给候选打分排序，
          稳的、快的排前面；冷却中的直接跳过。
       3) 阶梯竞速：对前几名并发发起（错峰 900ms），谁先写出正文就用谁，
          其余在途请求立即中止，不让慢的、卡住的拖累整体。
       4) 自动切换：429 / 超时 / 不可用自动记冷却让位；全部失败才报错。
     改写 / 原创 / 二创都走这一个入口，不再各写一套兜底。
     ============================================================ */
  var HEALTH_KEY = 'wj.model.health';
  var healthMemo = null;

  function healthMap() {
    if (healthMemo) return healthMemo;
    try { healthMemo = JSON.parse(localStorage.getItem(HEALTH_KEY) || '{}') || {}; }
    catch (e) { healthMemo = {}; }
    return healthMemo;
  }

  function saveHealth() {
    try { localStorage.setItem(HEALTH_KEY, JSON.stringify(healthMemo || {})); }
    catch (e) { /* ignore */ }
  }

  function hkey(p) {
    return hostOf(normBase(p.base)) + '|' + (p.model || '');
  }

  /* 失败原因 → 冷却时长（毫秒）。auth/paid/missing 是硬伤，冷得久；
     limited(429)/slow(超时) 是软伤，指数退避但有上限。 */
  function coolFor(reason, fail) {
    var n = Math.max(1, fail || 1);
    if (reason === 'auth' || reason === 'paid' || reason === 'missing') return 6 * 60 * 60 * 1000;
    if (reason === 'limited') return Math.min(15 * 1000 * n, 2 * 60 * 1000);
    if (reason === 'slow') return Math.min(30 * 1000 * n, 5 * 60 * 1000);
    return Math.min(12 * 1000 * n, 90 * 1000);
  }

  function markGood(p, ms) {
    var m = healthMap(), k = hkey(p), h = m[k] || {};
    h.fail = 0;
    h.until = 0;
    h.ok = (h.ok || 0) + 1;
    h.lastMs = ms || h.lastMs || 0;
    h.at = Date.now();
    m[k] = h;
    saveHealth();
  }

  function markBad(p, e) {
    var m = healthMap(), k = hkey(p), h = m[k] || {};
    var reason = whyFail(e && e.status, (e && e.message) || '');
    h.fail = (h.fail || 0) + 1;
    h.reason = reason;
    h.until = Date.now() + coolFor(reason, h.fail);
    h.at = Date.now();
    m[k] = h;
    saveHealth();
    return reason;
  }

  /* 健康分：越高越优先。冷却中直接排除；成功过的降级程度小，
     失败次数越多分越低，历史耗时越久越靠后。 */
  function scoreOf(p) {
    var m = healthMap(), h = m[hkey(p)] || {};
    var now = Date.now();
    if (h.until && h.until > now) return -1e9;           /* 冷却中，跳过 */
    var s = 100;
    s -= (h.fail || 0) * 22;
    s += Math.min((h.ok || 0) * 6, 30);
    if (h.lastMs) s -= Math.min(h.lastMs / 1500, 25);
    return s;
  }

  /* 按健康度排序；原本 activeProvider 排在前的保持优先（同分时稳定） */
  function rankCandidates(list) {
    return (list || []).map(function (p, i) { return { p: p, i: i, s: scoreOf(p) }; })
      .sort(function (a, b) { return (b.s - a.s) || (a.i - b.i); })
      .map(function (x) { return x.p; });
  }

  function coolingInfo(list) {
    var m = healthMap(), now = Date.now(), out = [];
    (list || []).forEach(function (p) {
      var h = m[hkey(p)] || {};
      if (h.until && h.until > now) out.push({ name: p.name || hkey(p), sec: Math.ceil((h.until - now) / 1000), reason: h.reason || '' });
    });
    return out;
  }

  async function chatChain(list, messages, opts) {
    var ordered = rankCandidates(list);
    if (!ordered.length) {
      var e0 = new Error('还没有可用的模型服务商，去「我的 → 模型服务」加一个');
      e0.code = 'NO_MODEL';
      throw e0;
    }
    var errs = [];

    /* 阶梯竞速：最多同时放行 RACE 条，每条错峰 400ms。
       首选先发 400ms 独占窗口；若它是慢通道（如 llm7 约 20 秒），
       第二条 400ms 后跟上，快的那条先返回就中止其余——用户不用陪首选干等。
       错峰而非全并发，是为了不把免费额度一次性打爆。 */
    var RACE = Math.min(ordered.length, 3);
    var first = await raceBatch(ordered.slice(0, RACE), messages, opts, 18000);
    if (first.ok) {
      first.value.switched = first.index > 0;
      first.value.from = first.index;
      return first.value;
    }
    errs = errs.concat(first.errs);

    /* 前几名全军覆没：剩下的按健康度继续分批竞速（此时健康分已因刚才的失败下降）。
       冷门候选只在热门全挂时才轮到，不浪费它们的免费额度。 */
    var rest = rankCandidates(list).filter(function (p) { return ordered.slice(0, RACE).indexOf(p) === -1; });
    while (rest.length) {
      var batch = rest.slice(0, RACE);
      var r = await raceBatch(batch, messages, opts, 18000);
      if (r.ok) {
        r.value.switched = true;
        return r.value;
      }
      errs = errs.concat(r.errs);
      rest = rest.slice(RACE);
    }

    var err = new Error('所有模型服务商都没调通');
    var cool = coolingInfo(list);
    err.detail = errs.join('\n') + (cool.length ? '\n冷却中：' + cool.map(function (c) { return c.name + ' ' + c.sec + 's'; }).join('、') : '');
    err.code = 'ALL_FAIL';
    throw err;
  }

  /* 一批候选阶梯竞速：谁先出正文谁赢，其余在途 AbortController 全部中止。 */
  function raceBatch(batch, messages, opts, ms) {
    return new Promise(function (resolve) {
      var ctrls = [], timers = [], errs = [], settled = false;
      function stop() {
        settled = true;
        timers.forEach(function (t) { clearTimeout(t); });
        ctrls.forEach(function (c) { try { c.abort(); } catch (e) {} });
      }
      batch.forEach(function (p, idx) {
        var timer = setTimeout(function () {
          if (settled) return;
          var ctrl = new AbortController();
          ctrls.push(ctrl);
          var o = Object.assign({}, opts, { race: true, ms: ms, signal: ctrl.signal });
          var t0 = Date.now();
          chat({ base: p.base, key: p.key, model: p.model }, messages, o)
            .then(function (txt) {
              if (settled) return;              /* 别人已赢，丢弃这条结果 */
              markGood(p, Date.now() - t0);
              stop();
              resolve({ ok: true, value: { text: txt, provider: p, model: p.model }, index: idx });
            }, function (e) {
              if (settled) return;
              e = e || new Error('调用失败');
              e._reason = markBad(p, e);
              var msg = (e.message || '调用失败');
              if (e._reason === 'auth') msg += '（Key 无效或没权限）';
              if (e._reason === 'limited') msg += '（触发限流，已临时冷却）';
              if (e._reason === 'paid') msg += '（余额不足/需订阅，已冷却）';
              if (e._reason === 'slow') msg += '（超时，已临时冷却）';
              errs.push((p.name || hkey(p)) + '：' + msg);
              if (errs.length >= batch.length) {
                stop();
                resolve({ ok: false, errs: errs });
              }
            });
        }, idx * 400);
        timers.push(timer);
      });
    });
  }

  /* 推理模型（gpt-oss / o 系 / R1 / GLM-Z1）经常把正文写进 reasoning_content，
     content 留空。旧版直接判「模型没有返回内容」，于是这类模型全被标成「写不出内容」
     从列表里删掉——用户看到的就是「配好的模型全不能用」。这里统一取文。 */
  function msgText(m) {
    if (!m) return '';
    var t = String(m.content == null ? '' : m.content).trim();
    if (t) return t;
    var r = String(m.reasoning_content || m.reasoning || '').trim();
    if (!r) return '';
    /* 推理过程常混着英文自问自答，只取中文起始的一段 */
    var cn = r.match(/[\u4e00-\u9fa5][\s\S]*$/);
    return (cn ? cn[0] : r).trim();
  }

  async function chat(cfg, messages, opts) {
    var base = normBase(cfg.base);
    var model = (opts && opts.model) || cfg.model;
    /* 竞速模式下用短超时 + 关掉直连重试：单条最多等 opt.ms（默认 18 秒），
       到点就判这条失败、让位给其他候选。串行兜底仍用原来的 90 秒。 */
    var race = !!(opts && opts.race);
    var ms = (opts && opts.ms) || (race ? 18000 : 90000);
    var fast = race || !!(opts && opts.fast);
    var d;
    try {
      d = await llmJSON(base, '/chat/completions', {
        key: cfg.key,
        ms: ms,
        fast: fast,
        signal: opts && opts.signal,
        body: {
          model: model,
          messages: messages,
          temperature: (opts && opts.temperature) != null ? opts.temperature : 0.8,
          max_tokens: (opts && opts.maxTokens) || 2400,
          stream: false
        }
      });
    } catch (e) {
      /* 推理模型（o1/o3/gpt-5 一类）只认 max_completion_tokens */
      if (!(e.status === 400 && /max_tokens|max_completion|temperature|unsupported|parameter/i.test(e.message || ''))) throw e;
      d = await llmJSON(base, '/chat/completions', {
        key: cfg.key,
        ms: race ? ms : 120000,
        fast: fast,
        signal: opts && opts.signal,
        body: {
          model: model,
          messages: messages,
          max_completion_tokens: (opts && opts.maxTokens) || 2400
        }
      });
    }
    var ch = (d && d.choices && d.choices[0]) || {};
    var txt = msgText(ch.message || {}) || String(ch.text || '').trim();
    if (!txt) {
      var e2 = new Error(ch.finish_reason === 'length' ? '模型输出被长度限制截断，没写出正文' : '模型没有返回内容');
      e2.code = 'EMPTY';
      throw e2;
    }
    return String(txt);
  }

  /* 榜单封面：微博/抖音/头条这类条目只有搜索页，图片要到榜单接口里按标题匹配 */
  async function cover(src, title) {
    if (!src || !title) return '';
    var call = async function (b) {
      var d = await getJSON(apiUrl(b, '/api/cover', { src: src, title: title }), 18000);
      if (!d || !d.ok || !d.head) throw new Error('没有封面');
      /* 新浪图床只认 weibo.com 的 Referer，浏览器改不了，走服务端转发一次 */
      if (d.proxy) return apiUrl(b, '/api/img', { u: d.head });
      return d.head;
    };
    var bases = parseBases();
    try {
      if (await hasServer()) {
        try { return await call(''); } catch (e) { /* 站内没有就继续走云端 */ }
      }
      if (bases.length) return await raceCall(bases, call);
    } catch (e) { return ''; }
    return '';
  }

  return {
    SOURCES: SOURCES,
    hot: hot,
    parseLink: parseLink,
    pickUrl: pickUrl,
    meta: meta,
    cover: cover,
    parseBase: parseBase,
    setParseBase: setParseBase,
    parseBases: parseBases,
    setParseBases: setParseBases,
    parseKey: parseKey,
    setParseKey: setParseKey,
    checkBases: checkBases,
    probeBase: probeBase,
    invalidateProbe: invalidateProbe,
    cloudHealth: cloudHealth,
    pingBase: pingBase,
    CLOUD_DEFAULT: CLOUD_DEFAULT,
    urlKind: urlKind,
    hostOf: hostOf,
    walledHost: walledHost,
    WALLED_ADVICE: WALLED_ADVICE,
    hasServer: hasServer,
    posts: posts,
    topic: topic,
    topicCached: topicCached,
    weiboRssTopic: weiboRssTopic,
    weiboFromRss: weiboFromRss,
    rssItems: rssItems,
    pxGet: pxGet,
    pxOrder: pxOrder,
    clearHotMemo: clearHotMemo,
    ttTopicLive: ttTopicLive,
    topicId: topicId,
    topicSnapshot: topicSnapshot,
    warmTopics: warmTopics,
    imgUrl: imgUrl,
    listModels: listModels,
    testModel: testModel,
    probeModels: probeModels,
    bestChat: bestChat,
    bestImage: bestImage,
    rankOf: rankOf,
    whyFail: whyFail,
    presets: PRESETS,
    relayOverride: relayOverride,
    setRelayOverride: setRelayOverride,
    chat: chat,
    chatChain: chatChain,
    rankCandidates: rankCandidates,
    coolingInfo: coolingInfo,
    healthMap: healthMap,
    resetHealth: function () { healthMemo = {}; try { localStorage.removeItem(HEALTH_KEY); } catch (e) {} },
    visionAsk: visionAsk,
    annotate: annotate,
    normBase: normBase,
    dsKey: dsKey,
    setDsKey: setDsKey,
    dsFetch: dsFetch,
    mdToText: mdToText,
    corsBlockedName: corsBlockedName,
    CORS_FRIENDLY: CORS_FRIENDLY,
    clearDirect: clearDirect
  };
})();

</script>

  var P = {

  function ic(name, size, sw) {
    var d = P[name] || P.sparkle;
    return '<svg width="' + (size || 18) + '" height="' + (size || 18) + '" viewBox="0 0 24 24" fill="none" ' +
      'stroke="currentColor" stroke-width="' + (sw || 1.6) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      d + '</svg>';
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function fmtHot(n) {
    n = Number(n) || 0;
    if (n >= 1e8) return (n / 1e8).toFixed(1).replace(/\.0$/, '') + '亿';
    if (n >= 1e4) return (n / 1e4).toFixed(1).replace(/\.0$/, '') + '万';
    return String(Math.round(n));
  }

  function fmtClock(ts) {
    var d = new Date(ts || Date.now());
    var pad = function (n) { return ('0' + n).slice(-2); };
    return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  function fmtTime(ts) {
    var d = new Date(ts || Date.now());
    var hh = ('0' + d.getHours()).slice(-2);
    var mm = ('0' + d.getMinutes()).slice(-2);
    return hh + ':' + mm;
  }

  function ago(ts) {
    if (!ts) return '未更新';
    var s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return '刚刚';
    if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
    if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
    return Math.floor(s / 86400) + ' 天前';
  }

  /* 客户端分类：原文元信息拿不到时也要有个像样的标签，不靠服务端 */
  var CATS = [
    ['科技数码', /(AI|人工智能|大模型|芯片|手机|苹果|iPhone|华为|小米|鸿蒙|安卓|iOS|发布|系统|相机|电池|屏幕|显卡|机器人|算力|算法|卫星|SpaceX|马斯克|电脑|平板|耳机|智能|科技|数码|App|软件)/i],
    ['财经商业', /(股价|市值|融资|营收|财报|上市|IPO|裁员|涨价|降价|价格|消费|市场|经济|品牌|电商|直播带货|销量|亏损|投资|基金|黄金|房|贷款|利率)/],
    ['汽车出行', /(汽车|新车|车型|车企|比亚迪|特斯拉|理想|蔚来|小鹏|问界|续航|智驾|充电|电池车|油价|航班|高铁|地铁)/],
    ['娱乐影视', /(电影|剧集|电视剧|综艺|明星|歌手|演唱会|票房|导演|主演|官宣|恋爱|结婚|离婚|塌房|演员|网剧|动画)/],
    ['体育赛事', /(比赛|冠军|夺冠|球队|球员|联赛|奥运|世界杯|篮球|足球|国足|NBA|CBA|中超|网球|乒乓|马拉松|运动员)/],
    ['游戏电竞', /(游戏|版本|玩家|主机|电竞|开服|手游|Steam|任天堂|索尼|PlayStation|关卡|联机)/],
    ['教育职场', /(高考|考研|考公|招聘|薪资|裁员|职场|大学生|就业|学校|老师|专业|毕业|简历)/],
    ['健康医疗', /(医院|医生|疾病|药品|疫苗|医保|健康|减肥|睡眠|养生|癌症|流感|体检)/],
    ['社会民生', /(警方|通报|事故|天气|台风|暴雨|高温|寒潮|交通|快递|物业|小区|火灾|失联|救援|游客|收费|新规)/]
  ];

  var SRC_CAT = {
    weibo: '全网热点', zhihu: '问答热议', toutiao: '资讯热点', baidu: '全网热搜',
    douyin: '短视频热点', bilibili: '社区热门', '36kr': '商业创投',
    sspai: '数字生活', ithome: '科技数码', geekpark: '科技前沿'
  };

  function catOf(title, srcId) {
    var t = String(title || '');
    var best = '', score = 0;
    for (var i = 0; i < CATS.length; i++) {
      var m = t.match(new RegExp(CATS[i][1].source, 'gi'));
      var n = m ? m.length : 0;
      if (n > score) { score = n; best = CATS[i][0]; }
    }
    return score >= 1 ? best : (SRC_CAT[srcId] || '热点');
  }

  function sourceName(id) {
    for (var i = 0; i < window.WJLive.SOURCES.length; i++) {
      if (window.WJLive.SOURCES[i].id === id) return window.WJLive.SOURCES[i].name;
    }
    return id;
  }

  /* ---------------- 通用块 ---------------- */

  function brand() {
    return '<div class="brand"><div class="mark">匠</div><div class="bt"><b>文匠</b><small>rewrite studio</small></div></div>';
  }

  function quotaPill(state) {
    var left = Math.max(0, state.quota.total - state.quota.used);
    return '<button class="quota" data-act="open-quota">' + ic('zap', 12) +
      ' 今日剩余 <b>' + left + '</b> / ' + state.quota.total + '</button>';
  }

  function liveBadge(src) {
    if (!src || !src.ok) return '<span class="badge plain">未连接</span>';
    if (src.via === 'live') return '<span class="badge live"><i class="dot" style="width:4px;height:4px;box-shadow:none"></i>实时</span>';
    /* 缓存一定要带上「多久以前」。只写「缓存」两个字，用户没法判断这份榜是十分钟前还是昨天的。 */
    return '<span class="badge sample">缓存 · ' + (src.at ? ago(src.at) : '时间未知') + '</span>';
  }

  function rankRow(item, i, srcId) {
    return '<button class="rank' + (i < 3 ? ' top' : '') + '" data-act="hot-item" data-src="' + esc(srcId) + '" data-i="' + i + '">' +
      '<span class="no">' + (i + 1 < 10 ? '0' + (i + 1) : i + 1) + '</span>' +
      '<span class="body"><span class="t">' + esc(item.title) + '</span>' +
      '<span class="m">' + (item.hot ? '<span class="hot">' + fmtHot(item.hot) + '</span>' : '') +
      '<span>' + esc(sourceName(srcId)) + '</span></span></span>' +
      '<span class="go">' + ic('edit', 13) + '</span></button>';
  }

  function emptyState(icon, title, desc, action) {
    return '<div class="empty"><div class="ei">' + ic(icon, 22) + '</div><b>' + esc(title) + '</b><p>' + desc + '</p>' +
      (action || '') + '</div>';
  }

  /* ---------------- 首页 ---------------- */

  function home(state) {
    /* 首页只做一件事：把「这个 App 能做什么」摆清楚，点一下就进。
       热榜、作品库都走底部导航，不在首页铺内容。 */
    var h = '<div class="hero">';
    h += '<div class="hero-row"><i class="dot pulse"></i>' +
      '<span class="eyebrow">文匠 · 二创工作台</span></div>';
    h += '<h1 class="h1">把一条链接<br>写成<em>你的</em>稿</h1>';
    h += '<p class="lead">粘一条链接，选一种语气，拿到可以直接发布的成稿。原文、观点、配图，一次给全。</p>';
    h += '</div>';

    h += '<div class="entries">';
    h += '<button class="entry primary" data-act="tab" data-tab="create">' +
      '<span class="ico">' + ic('wand', 18) + '</span>' +
      '<span class="etxt"><b>接任务原创</b><span>贴活动帖，拆任务、联网查证，写出自己的稿</span></span>' +
      '<span class="arrow">' + ic('right', 16) + '</span></button>';
    h += '<button class="entry" data-act="start" data-mode="link">' +
      '<div class="ico">' + ic('link', 16) + '</div>' +
      '<div class="etxt"><b>链接二创</b><span>公众号、头条、新闻链接，抓正文改写</span></div></button>';
    h += '<button class="entry" data-act="start" data-mode="text">' +
      '<div class="ico">' + ic('text', 16) + '</div>' +
      '<div class="etxt"><b>文案改写</b><span>已有稿子，换风格换平台</span></div></button>';
    h += '<button class="entry" data-act="start" data-mode="merge">' +
      '<div class="ico">' + ic('layers', 16) + '</div>' +
      '<div class="etxt"><b>双素材融合</b><span>两篇合一，做出信息增量</span></div></button>';
    h += '<button class="entry" data-act="comment-start">' +
      '<div class="ico">' + ic('message', 16) + '</div>' +
      '<div class="etxt"><b>写条评论</b><span>贴链接或正文，只出评论，挑一条就发</span></div></button>';
    h += '</div>';

    h += '<button class="entry mt-m" data-act="tab" data-tab="rank">' +
      '<div class="ico">' + ic('fire', 16) + '</div>' +
      '<div class="etxt"><b>看实时热榜</b><span>微博、抖音、知乎等平台当下热搜，点底部「热榜」也可进入</span></div>' +
      '<span class="arrow">' + ic('right', 16) + '</span></button>';

    h += '<div class="ver">WENJIANG · ' + (state.version || 'v2.0') + '</div>';
    return '<div class="screen">' + h + '</div>';
  }

  /* ---------------- 热榜页 ---------------- */

  function rank(state) {
    var active = state.hot.active || 'weibo';
    var src = state.hot.bySrc[active];
    var list = (src && src.items) || [];

    var h = '<div class="screen">';
    h += '<div style="padding-top:6px"><div class="eyebrow">Live board</div>' +
      '<h1 class="h1" style="font-size:27px">热榜</h1></div>';

    h += '<div class="hscroll mt-m">' +
      window.WJLive.SOURCES.map(function (s) {
        var st = state.hot.bySrc[s.id];
        return '<button class="chip' + (s.id === active ? ' on' : '') + '" data-act="hot-src" data-src="' + s.id + '">' +
          esc(s.name) + '<span class="c">' + (st && st.items ? st.items.length : '·') + '</span></button>';
      }).join('') + '</div>';

    var isLive = src && src.via === 'live';
    h += '<div style="display:flex;align-items:center;gap:10px;margin:16px 0 6px">' +
      liveBadge(src) +
      '<span class="sec-sub">' + (src && src.at
        ? (isLive ? '更新于 ' + fmtClock(src.at) + ' · 每分钟自动刷新' : '缓存于 ' + fmtTime(src.at) + ' · ' + ago(src.at))
        : '正在连接') + '</span>' +
      '<div class="spacer"></div>' +
      '<button class="mini-btn" data-act="hot-reload">' + ic('refresh', 13) + ' 刷新</button></div>';

    if (state.hot.loading && !list.length) {
      h += '<div class="panel" style="padding:16px">' + new Array(6).fill('<div class="sk" style="margin-bottom:14px"></div>').join('') + '</div>';
    } else if (list.length) {
      h += '<div class="rank-list">' + list.map(function (it, i) { return rankRow(it, i, active); }).join('') + '</div>';
      if (src && src.via !== 'live') {
        h += '<div class="note warn mt-m">' + ic('clock', 14) +
          '<div>实时接口这会儿没通（' + (src.error || '被限流') + '），下面是 <b>' + fmtTime(src.at) + '</b> 的缓存。点「刷新」再要一次实时值。</div></div>';
      }
    } else {
      h += emptyState('alert', '没抓到数据', '换个源试试，或稍后刷新。接口偶尔会限流。',
        '<button class="btn btn-soft mt-m" data-act="hot-reload">' + ic('refresh', 15) + ' 重试</button>');
    }

    /* 其它平台实时热榜速览：一次把已接通的平台都摊开，不再只盯着一个源。
       每个平台给前 6 条，点标题直接用那条去写；点平台名切过去看完整榜。 */
    var others = (window.WJLive.SOURCES || []).filter(function (s) {
      var o = state.hot.bySrc[s.id];
      return s.id !== active && o && o.ok && o.items && o.items.length && o.via === 'live';
    });
    if (others.length) {
      h += '<section class="sec mt-l"><div class="sec-head"><div class="h2">其他平台实时榜</div>' +
        '<span class="sec-sub">' + others.length + ' 个平台</span></div>';
      others.forEach(function (s) {
        var o = state.hot.bySrc[s.id];
        h += '<div class="pt-block"><div class="pt-head">' +
          '<button data-act="hot-src" data-src="' + s.id + '"><b>' + esc(s.name) + ' · ' + esc(s.nick || '热榜') + '</b>' + ic('right', 13) + '</button>' +
          '<span class="sec-sub">' + fmtClock(o.at) + ' · ' + o.items.length + ' 条</span></div>' +
          '<div class="rank-list compact">' + o.items.slice(0, 6).map(function (it, i) {
            return rankRow(it, i, s.id);
          }).join('') + '</div></div>';
      });
      h += '</section>';
    }

    h += '<div class="note mt-l">' + ic('globe', 14) +
      '<div>数据来自微博、知乎、头条、百度、抖音、B 站等公开榜单接口，仅保留标题与热度值，不做任何加工。抓取失败会明确显示，不会用假数据填充。</div></div>';

    /* 公众号：微信不提供公开热文榜，这里只做「贴链接取正文」 */
    h += '<div class="card mt-s" style="padding:16px">' +
      '<div style="font-size:14px;font-weight:600">公众号没有公开热榜</div>' +
      '<div class="sec-sub" style="margin-top:6px;line-height:1.65">微信不对外提供公众号热文榜，市面上号称「公众号热榜」的多是二手抓取。要看某篇公众号文章，把链接贴进来，点解析就能取到正文。</div>' +
      '<button class="btn btn-soft btn-block mt-m" data-act="wx-parse">' + ic('link', 15) + ' 粘贴公众号链接解析</button></div>';

    h += '</div>';
    return h;
  }

  /* ---------------- 创作页 ---------------- */

  function compose(state) {
    var c = state.compose;
    var h = '<div class="screen tight">';
    h += '<div style="padding-top:6px"><div class="eyebrow">New piece</div>' +
      '<h1 class="h1" style="font-size:27px">新建一篇</h1></div>';

    h += '<div class="seg mt-m" data-seg="mode">' +
      '<span class="thumb"></span>' +
      ['link|链接', 'text|文案', 'merge|双素材'].map(function (x) {
        var p = x.split('|');
        return '<button data-act="mode" data-mode="' + p[0] + '" class="' + (c.mode === p[0] ? 'on' : '') + '">' + p[1] + '</button>';
      }).join('') + '</div>';

    if (c.mode === 'link') {
      h += '<div class="field mt-m"><div class="field-head"><span class="lbl">Source URL</span>' +
        '<span class="cnt">' + (c.link1 ? '已粘贴' : '公众号 / 头条 / 新闻站') + '</span></div>' +
        '<textarea class="tall" style="min-height:92px;height:92px" data-field="link1" placeholder="https://mp.weixin.qq.com/s/...">' + esc(c.link1) + '</textarea>' +
        '<div class="foot"><button class="mini-btn" data-act="paste">' + ic('copy', 12) + ' 从剪贴板</button>' +
        (c.link1 ? '<button class="mini-btn" data-act="clear-compose">' + ic('close', 12) + ' 清空</button>' : '') +
        '<button class="mini-btn" data-act="preview-link">' + ic('search', 12) + ' 先解析看看</button>' +
        '<button class="mini-btn" data-act="start" data-mode="text">' + ic('text', 12) + ' 直接粘全文</button>' +
        '<div class="spacer"></div><span class="sec-sub">解析不通就直接粘全文，改写效果一样</span></div></div>';
    if (c.preview) {
      h += '<div class="pv">' +
        '<div class="pv-h"><b>' + esc(c.preview.title || '已取到正文') + '</b>' +
        '<span class="pv-m">' + c.preview.chars + ' 字 · ' + (c.preview.images.length ? c.preview.images.length + ' 张图' : '无配图') + '</span></div>' +
        (c.preview.note ? '<div class="pv-n">' + esc(c.preview.note) + '</div>' : '') +
        (c.preview.images.length ? '<div class="pv-imgs">' + c.preview.images.slice(0, 4).map(function (u) {
          return '<img src="' + esc(window.WJLive.imgUrl(u)) + '" alt="" loading="lazy">';
        }).join('') + '</div>' : '') +
        '</div>';
    }
    } else if (c.mode === 'text') {
      h += '<div class="field mt-m"><div class="field-head"><span class="lbl">Raw text</span>' +
        '<span class="cnt"><span data-cnt="text1">0</span> 字</span></div>' +
        '<textarea class="tall" data-field="text1" placeholder="把原文粘进来，至少 30 字。观点、数据、案例都可以。">' + esc(c.text1) + '</textarea>' +
        '<div class="foot"><button class="mini-btn" data-act="paste-clip">' + ic('copy', 12) + ' 读剪贴板</button>' +
        '<button class="mini-btn" data-act="example">' + ic('sparkle', 12) + ' 用示例素材</button>' +
        (c.text1 ? '<button class="mini-btn" data-act="clear-compose">' + ic('close', 12) + ' 清空</button>' : '') +
        '<div class="spacer"></div><span class="sec-sub">不会上传到任何服务器</span></div></div>';
    if (c.sourceImages && c.sourceImages.length) {
      h += '<div class="pv"><div class="pv-h"><b>原文配图</b>' +
        '<span class="pv-m">' + c.sourceImages.length + ' 张，已带进成稿</span></div>' +
        '<div class="pv-imgs">' + c.sourceImages.slice(0, 4).map(function (u) {
          return '<img src="' + esc(window.WJLive.imgUrl(u)) + '" alt="" loading="lazy">';
        }).join('') + '</div></div>';
    }
    if (c.sourceNote) {
      h += '<div class="note mt-s">' + ic('info', 13) + '<div>' + esc(c.sourceNote) + '</div></div>';
    }
    } else {
      h += '<div class="field mt-m"><div class="field-head"><span class="lbl">Material A</span>' +
        '<span class="cnt"><span data-cnt="text1">0</span> 字</span></div>' +
        '<textarea data-field="text1" placeholder="第一篇素材：事实、数据、时间线">' + esc(c.text1) + '</textarea></div>';
      h += '<div class="field mt-s"><div class="field-head"><span class="lbl">Material B</span>' +
        '<span class="cnt"><span data-cnt="text2">0</span> 字</span></div>' +
        '<textarea data-field="text2" placeholder="第二篇素材：不同角度、补充案例">' + esc(c.text2) + '</textarea></div>';
      h += '<div class="note mt-s">' + ic('layers', 13) +
        '<div>融合两篇的主旨与新事实，输出第三篇。这是产生<b>信息增量</b>的做法，不是换词洗稿。</div></div>';
    }

    /* 风格 */
    h += '<div class="sec"><div class="sec-head"><div class="h2" style="font-size:15px">风格</div>' +
      '<span class="sec-sub" data-style-tip>' + esc(styleDesc(c.style)) + '</span></div>';
    h += '<div class="hscroll" style="padding-bottom:2px">' + D.STYLES.map(function (s) {
      return '<button class="stylecard' + (c.style === s.key ? ' on' : '') + '" data-act="style" data-style="' + s.key + '">' +
        '<i>' + ic(s.icon, 15) + '</i><b>' + esc(s.short) + '</b><span>' + esc(s.tone) + '</span></button>';
    }).join('') + '</div></div>';

    /* 强度 */
    h += '<div class="sec"><div class="sec-head"><div class="h2" style="font-size:15px">改写强度</div>' +
      '<span class="sec-sub">' + esc(strengthDesc(c.strength)) + '</span></div>';
    h += '<div class="seg" data-seg="strength"><span class="thumb"></span>' +
      D.STRENGTHS.map(function (s) {
        return '<button data-act="strength" data-strength="' + s.key + '" class="' + (c.strength === s.key ? 'on' : '') + '">' + esc(s.name) + '</button>';
      }).join('') + '</div></div>';

    /* 平台 */
    h += '<div class="sec"><div class="sec-head"><div class="h2" style="font-size:15px">发布平台</div>' +
      '<span class="sec-sub">决定结构、句长与语气</span></div>';
    h += '<div class="hscroll">' + D.PLATFORMS.map(function (p) {
      return '<button class="chip' + (c.platform === p.key ? ' on' : '') + '" data-act="platform" data-platform="' + p.key + '">' + esc(p.name) + '</button>';
    }).join('') + '</div>';
    h += '<div class="sec-sub" style="margin-top:8px;line-height:1.6">' +
      esc(window.WJEngine.platformHint(c.platform)) + '</div></div>';

    /* 目标字数：用户定，不让平台替他决定 */
    var lenTipText = window.WJEngine.lenTip(c.text1, c.words);
    h += '<div class="sec"><div class="sec-head"><div class="h2" style="font-size:15px">目标字数</div>' +
      '<span class="sec-sub" data-lentip>' + esc(lenTipText) + '</span></div>';
    h += '<div class="hscroll">' + D.LENGTHS.map(function (l) {
      return '<button class="chip' + (Number(c.words) === l.key ? ' on' : '') + '" data-act="words" data-words="' + l.key + '">' + esc(l.name) + '</button>';
    }).join('') + '</div></div>';

    /* 高级 */
    h += '<div class="sec"><button class="row" data-act="toggle-adv" style="border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface)">' +
      '<span class="ri">' + ic('settings', 15) + '</span>' +
      '<span class="rt"><b>更多控制</b><small>' + (c.adv ? '已展开' : '自定义要求 · 去 AI 味 · 保真') + '</small></span>' +
      '<span class="chev" style="transform:rotate(' + (c.adv ? '90' : '0') + 'deg);transition:transform .3s">' + ic('right', 15) + '</span></button>';

    if (c.adv) {
      h += '<div class="field mt-s"><div class="field-head"><span class="lbl">Extra instruction</span></div>' +
        '<textarea style="min-height:64px" data-field="extra" placeholder="例如：结尾加一句提问；不要出现「赋能」「闭环」这类词">' + esc(c.extra) + '</textarea></div>';

      h += '<div class="rows mt-s">' +
        rowSwitch('sparkle', '去 AI 味', '删掉模板腔与排比句', c.deai, 'deai') +
        rowSwitch('shield', '事实保真', '数字、人名、引语不改', c.faithful, 'faithful') +
        '</div>';
    }
    h += '</div>';

    h += '<div style="height:104px"></div></div>';

    /* 底部 CTA */
    var left = Math.max(0, state.quota.total - state.quota.used);
    h += '<div class="dock"><div class="dock-row" style="margin-bottom:8px;align-items:center">' +
      quotaPill(state) +
      '<div class="spacer"></div>' +
      '<span class="sec-sub">' + esc(styleName(c.style)) + ' · ' + esc(strengthName(c.strength)) + '</span></div>' +
      '<button class="btn btn-primary btn-lg btn-block" data-act="generate"' + (left <= 0 ? ' disabled' : '') + '>' +
      ic('sparkle', 17) + (left <= 0 ? '今日额度已用完' : '开始改写') + '</button></div>';

    return h;
  }

  function rowSwitch(icon, title, desc, on, act) {
    return '<div class="row"><span class="ri">' + ic(icon, 14) + '</span>' +
      '<span class="rt"><b>' + title + '</b><small>' + desc + '</small></span>' +
      '<button class="sw' + (on ? ' on' : '') + '" data-act="toggle" data-key="' + act + '"></button></div>';
  }

  function styleName(k) {
    for (var i = 0; i < D.STYLES.length; i++) if (D.STYLES[i].key === k) return D.STYLES[i].name;
    return '';
  }
  function styleDesc(k) {
    for (var i = 0; i < D.STYLES.length; i++) if (D.STYLES[i].key === k) return D.STYLES[i].tone;
    return '';
  }
  function strengthName(k) {
    for (var i = 0; i < D.STRENGTHS.length; i++) if (D.STRENGTHS[i].key === Number(k)) return D.STRENGTHS[i].name;
    return '';
  }
  function strengthDesc(k) {
    for (var i = 0; i < D.STRENGTHS.length; i++) if (D.STRENGTHS[i].key === Number(k)) return D.STRENGTHS[i].desc;
    return '';
  }

  /* ---------------- 评论页 ---------------- */

  function commentView(state) {
    var c = state.comment;
    var h = '<div class="screen tight">';
    h += '<div style="padding-top:6px"><div class="eyebrow">Reply like a human</div>' +
      '<h1 class="h1" style="font-size:27px">写评论</h1></div>';
    h += '<div class="sec-sub" style="margin-top:8px;line-height:1.7">只出评论，不改写。粘一条链接或一段正文，' +
      '按普通读者的口气写几条，挑一条复制就能发。</div>';

    h += '<div class="seg mt-m" data-seg="cmode"><span class="thumb"></span>' +
      ['link|链接', 'text|正文'].map(function (x) {
        var p2 = x.split('|');
        return '<button data-act="cmode" data-mode="' + p2[0] + '" class="' + (c.mode === p2[0] ? 'on' : '') + '">' + p2[1] + '</button>';
      }).join('') + '</div>';

    if (c.mode === 'link') {
      h += '<div class="field mt-m"><div class="field-head"><span class="lbl">Source URL</span>' +
        '<span class="cnt">' + (c.link ? '已粘贴' : '微博 / 小红书 / 公众号 / 抖音') + '</span></div>' +
        '<textarea class="tall" style="min-height:84px;height:84px" data-field="clink" placeholder="https://...">' + esc(c.link) + '</textarea>' +
        '<div class="foot"><button class="mini-btn" data-act="cpaste">' + ic('copy', 12) + ' 从剪贴板</button>' +
        (c.link ? '<button class="mini-btn" data-act="cclear">' + ic('close', 12) + ' 清空</button>' : '') +
        '<div class="spacer"></div><span class="sec-sub">解析后只用来写评论</span></div></div>';
    } else {
      h += '<div class="field mt-m"><div class="field-head"><span class="lbl">Raw text</span>' +
        '<span class="cnt">' + ((c.text || '').trim().length || '') + (c.text ? ' 字' : '') + '</span></div>' +
        '<textarea class="tall" style="min-height:140px" data-field="ctext" placeholder="把要评论的帖子正文粘进来，至少 30 字。">' + esc(c.text) + '</textarea></div>';
    }

    h += '<div class="sec"><div class="sec-head"><div class="h2" style="font-size:15px">要几条</div>' +
      '<span class="sec-sub">够挑就行，不用刷屏</span></div>' +
      '<div class="seg" data-seg="cnum"><span class="thumb"></span>' +
      [2, 4, 6].map(function (n) {
        return '<button data-act="cnum" data-n="' + n + '" class="' + (c.n === n ? 'on' : '') + '">' + n + ' 条</button>';
      }).join('') + '</div></div>';

    h += '<div class="sec"><div class="sec-head"><div class="h2" style="font-size:15px">口气</div>' +
      '<span class="sec-sub">' + esc(c.tone === 'sharp' ? '不客气，但讲道理' : c.tone === 'info' ? '补充信息，像内行' : '有共鸣，不肉麻') + '</span></div>' +
      '<div class="hscroll">' +
      [['warm', '真诚共鸣'], ['sharp', '犀利一点'], ['info', '补充内情']].map(function (x) {
        return '<button class="chip' + (c.tone === x[0] ? ' on' : '') + '" data-act="ctone" data-tone="' + x[0] + '">' + x[1] + '</button>';
      }).join('') + '</div></div>';

    if (c.err) h += '<div class="note warn mt-m">' + ic('alert', 14) + '<div>' + esc(c.err) + '</div></div>';

    if (c.list && c.list.length) {
      h += '<div class="sec-head mt-m"><div class="h2" style="font-size:15px">可以这么评</div>' +
        '<span class="sec-sub">' + c.list.length + ' 条 · 点整条复制</span></div>';
      h += c.list.map(function (x) {
        return '<button class="cm" data-act="copy" data-text="' + esc(x) + '">' +
          '<span class="cm-t">' + esc(x) + '</span>' +
          '<span class="cm-cp">' + ic('copy', 13) + '</span></button>';
      }).join('');
      h += '<div class="row2 mt-s"><button class="btn btn-soft" data-act="cm-again">' + ic('refresh', 15) + ' 换一批</button>' +
        '<button class="btn btn-soft" data-act="cm-copy-all">' + ic('copy', 15) + ' 全部复制</button></div>';
    }

    h += '<div style="height:104px"></div></div>';

    h += '<div class="dock"><div class="dock-row" style="margin-bottom:8px;align-items:center">' +
      quotaPill(state) + '<div class="spacer"></div><span class="sec-sub">' + c.n + ' 条 · 真人语气</span></div>' +
      '<button class="btn btn-primary btn-lg btn-block" data-act="cmake"' + (c.busy ? ' disabled' : '') + '>' +
      ic('sparkle', 17) + (c.busy ? '正在写…' : '生成评论') + '</button></div>';
    return h;
  }

  /* ---------------- 结果页 ---------------- */

  function result(state) {
    var r = state.result;
    if (!r) return '<div class="screen">' + emptyState('alert', '没有结果', '回到创作页重新生成。') + '</div>';
    var tab = state.resultTab || 'body';
    var C = 2 * Math.PI * 27;

    var h = '<div class="screen tight">';
    h += '<div class="score-row">';
    h += '<div class="ring"><svg viewBox="0 0 62 62">' +
      '<circle class="bgc" cx="31" cy="31" r="27" fill="none" stroke-width="3.5"/>' +
      '<circle class="fgc" cx="31" cy="31" r="27" fill="none" stroke-width="3.5" ' +
      'stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + C.toFixed(1) + '" data-score="' + r.score + '"/>' +
      '</svg><span class="val">0</span></div>';
    var lvl = r.score >= 60 ? ['较大', 'live'] : r.score >= 45 ? ['中等', 'plain'] : ['偏小', 'sample'];
    h += '<div class="score-meta"><div class="t">改写幅度' +
      '<span class="badge ' + lvl[1] + '">' + lvl[0] + '</span></div>' +
      '<div class="d">' + (r.score || 0) + '% 的文字与原文不重合；另有 ' + (r.sim || 0) + '% 是连续 12 字以上的重合片段。' +
      '本机统计，与平台判定无关。</div></div></div>';

    if ((!r.modelName || r.modelName === '本机引擎') && r.words > 600) {
      h += '<div class="note mt-s">' + ic('alert', 14) +
        '<div>这篇 ' + r.words + ' 字。本机引擎对长文只能做轻度改写，段落几乎照原顺序走；<b>接模型后差别会很明显</b>。</div></div>';
    }
    if (!r.modelName || r.modelName === '本机引擎') {
      h += '<button class="note mt-s" data-act="open-model" style="width:100%;text-align:left;align-items:center">' +
        ic('cpu', 14) + '<div style="flex:1">当前用的是<b>本机规则引擎</b>。接一个自己的模型，改写幅度通常能再高一大截。<span style="color:var(--acc)">去配置 →</span></div></button>';
    }

    h += '<div class="metrics">' +
      '<div class="metric"><div class="k">字数</div><div class="v">' + r.words +
        (r.target ? '<small>/' + r.target + '</small>' : '') + '</div></div>' +
      '<div class="metric"><div class="k">重合率</div><div class="v">' + (r.sim || 0) + '<small>%</small></div></div>' +
      '<div class="metric"><div class="k">重复句</div><div class="v">' + (r.dupes || 0) + '</div></div></div>';

    h += '<div style="display:flex;align-items:center;gap:8px;margin-top:18px">' +
      '<span class="badge ai">AI 生成</span><span class="sec-sub">' + esc(r.styleName) + ' · ' + esc(r.platformName) + ' · ' + esc(r.modelName || '本机引擎') + '</span></div>';
    if (r.srcLen && r.target) {
      /* 保留率超过 100% 说明模型写超了：按 100% 封顶显示，另注一句「扩写」，
         不要出现「实际保留 350%」这种让人看不懂的数 */
      var keepRaw = Math.round(r.words / Math.max(1, r.srcLen) * 100);
      var keep = Math.min(100, keepRaw);
      var aim = '目标 ' + r.target + ' 字';
      if (r.want && r.want > r.target * 1.05) aim = '选了 ' + r.want + ' 字，原文只够 ' + r.target + ' 字';
      h += '<div class="sec-sub" style="margin-top:6px">原文 ' + r.srcLen + ' 字 · ' + aim +
        ' · 信息覆盖 ' + keep + '%' + (keepRaw > 105 ? '（成稿比原文长，属扩写）' : '') + '（人物、时间线、因果不删）</div>';
    }
    if (r.selfCheck) {
      h += '<div class="sec-sub" style="margin-top:6px">' + esc(r.selfCheck) + '</div>';
    }

    h += '<button class="btn btn-soft btn-block mt-s" data-act="result-comments">' +
      ic('message', 15) + ' 读者会怎么评 · 生成 3 条</button>';

    if (tab === 'body') {
      h += '<h1 class="result-title">' + esc(r.title) + '</h1>';
      h += '<div class="prose mt-m">' + window.WJEngine.mdToHtml(r.body) + '</div>';
      h += '<div class="note mt-m">' + ic('shield', 14) +
        '<div>发布时建议勾选平台的「AI 辅助创作」声明。<b>复制全文会自动附带声明</b>（可在「我的」关闭）。</div></div>';
    } else if (tab === 'titles') {
      h += '<div class="sec-head mt-m"><div class="h2" style="font-size:15px">标题候选</div><span class="sec-sub">点一下替换</span></div>';

      '3) research：为了弄懂任务、收集创作素材，你准备联网搜的问题，4-6 条。' +
      '注意不是去搜"这个活动本身"（原帖已经有），而是搜"这个概念是什么/真人怎么做/有什么真实体验和素材"。' +
      '比如有 NoSpend 就搜"NoSpend 是什么 真实体验""NoSpend 挑战 怎么坚持 心得""不消费挑战 普通人 收获"。\n\n' +
      '只输出 JSON：{"understanding":"","concepts":[{"term":"","why":""}],"research":[]}\n\n' +
      '活动标题：' + (title || '未知') + '\n活动正文（请读到最后一行）：\n' + String(text || '');
    return [{ role: 'system', content: sys }, { role: 'user', content: user }];
  }

  function parseJSON(text) {
    var t = String(text || '').trim();
    var m = t.match(/\{[\s\S]*\}/);
    if (!m) return null;
    try { return JSON.parse(m[0]); } catch (e) {
      /* 模型偶尔在 JSON 里带换行或尾逗号 */
      var s = m[0].replace(/,\s*([}\]])/g, '$1');
      try { return JSON.parse(s); } catch (e2) { return null; }
    }
  }

  function normalizeTask(o, fallback) {
    var f = fallback || {};
    var ways = Array.isArray(o.ways) && o.ways.length ? o.ways : f.ways || [];
    ways = ways.slice(0, 6).map(function (w, i) {
      return {
        id: 'w' + i,
        name: String(w.name || w.title || '方式 ' + (i + 1)).slice(0, 60),
        desc: String(w.desc || w.detail || '').slice(0, 300),
        need: String(w.need || '').slice(0, 120)
      };
    });
    var tags = (o.hashtags || f.hashtags || []).map(function (x) { return String(x).replace(/^#/, '').trim(); }).filter(Boolean).slice(0, 6);
    return {
      platform: f.platform || '',
      platformName: String(o.platformName || f.platformName || '活动页').slice(0, 20),
      title: String(o.title || f.title || '').slice(0, 90),
      brand: String(o.brand || f.brand || '').slice(0, 30),
      deadline: String(o.deadline || f.deadline || '').slice(0, 60),
      hashtags: tags,
      ways: ways,
      awards: (o.awards || f.awards || []).map(String).slice(0, 8),
      rules: (o.rules || f.rules || []).map(String).slice(0, 8),
      minWords: Number(o.minWords || f.minWords || 0) || 0,
      understanding: String(o.understanding || f.understanding || '').slice(0, 1200),
      concepts: (Array.isArray(o.concepts) && o.concepts.length ? o.concepts : f.concepts || []).slice(0, 8).map(function (x) {
        return { term: String(x.term || '').slice(0, 40), why: String(x.why || '').slice(0, 160) };
      }).filter(function (x) { return x.term; }),
      research: (Array.isArray(o.research) && o.research.length ? o.research : f.research || []).slice(0, 8).map(String).filter(Boolean).slice(0, 8),
      note: String(o.note || (o.by === 'ai' ? 'AI 从原帖提取，已保留原文出处' : f.note || '')).slice(0, 200),
      by: 'ai',
      raw: String(o.raw || '').slice(0, 200)
    };
  }

  /* 把全文要点压成一段紧凑 brief：标题、话题、全部参与方式、奖项、规则、时间都在，
     AI 据此就能"通读全文要点"地理解任务，而不用把上千字原文硬塞给处理长文本不稳的免费模型。 */
  function taskBrief(local, rawText) {
    var b = [];
    b.push('活动：' + (local.title || '未标明'));
    if (local.deadline) b.push('时间：' + local.deadline);
    if ((local.hashtags || []).length) b.push('话题：' + local.hashtags.map(function (x) { return '#' + x; }).join(' '));
    if ((local.ways || []).length) b.push('参与方式：\n' + local.ways.map(function (w, i) {
      return (i + 1) + '）' + w.name + (w.desc ? '——' + w.desc : '');
    }).join('\n'));
    if ((local.awards || []).length) b.push('奖项：' + local.awards.slice(0, 6).join('；'));
    if ((local.rules || []).length) b.push('规则：' + local.rules.slice(0, 6).join('；'));
    /* 正文里除结构化字段外可能还有"灵感/玩法说明"，补一段原文兜底，保证不漏下半部分 */
    var extra = String(rawText || '').replace(/\s+/g, ' ').slice(0, 700);
    if (extra) b.push('原文节选：' + extra);
    return b.join('\n').slice(0, 2600);
  }

  async function extractTask(text, title, url, chain) {
    /* 结构化字段本地提取：稳、不编数字。AI 只负责"像人一样理解"这一段。 */
    var local = localTask(text, title, url);
    local.by = 'ai';
    if (!chain || !chain.length) return local;
    var brief = taskBrief(local, text);
    var res = null, o = null;
    /* 免费通道偶发超时/限流，且长 JSON 容易被 maxTokens 截断。重试两次、给足 token，
       宁可多等一两秒，也要让"像人一样理解"这一步真正跑出来，而不是回退到本地拼接。 */
    for (var attempt = 0; attempt < 3; attempt++) {
      try {
        res = await L.chatChain(chain, taskMessages(brief, title, url), { temperature: 0.5, maxTokens: 1600 });
        o = parseJSON(res.text);
        if (o && (o.understanding || (o.research || []).length)) break;
        o = null;
      } catch (e) {
        o = null;
        if (attempt < 2) await sleep(600);
      }
    }
    try {
      if (!o || (!o.understanding && !(o.research || []).length)) return local;
      /* 合并：理解/概念/研究问题用 AI 的；时间话题奖项参与方式仍用本地的（不交模型，避免编数字）。 */
      if (o.understanding) local.understanding = String(o.understanding).slice(0, 1200);
      if (Array.isArray(o.concepts) && o.concepts.length) {
        local.concepts = o.concepts.slice(0, 8).map(function (x) {
          return { term: String(x.term || '').slice(0, 40), why: String(x.why || '').slice(0, 160) };
        }).filter(function (x) { return x.term; });
      }
      if (Array.isArray(o.research) && o.research.length) {
        local.research = o.research.slice(0, 8).map(function (q) {
          return String(q).replace(/^\s*\d+[\.、\)]\s*/, '').trim();
        }).filter(Boolean).slice(0, 8);
      }
      local.model = (res.provider && res.provider.name ? res.provider.name + ' · ' : '') + res.model;
      local.note = '理解由 AI 结合原帖形成，规则字段照原帖';
      return local;
    } catch (e) {
      local.note = 'AI 没连上，用本机规则理解：' + (e.message || '');
      return local;
    }
  }

  /* ---------------- 检索 ---------------- */

  function grams(q) {
    var s = String(q || '').replace(/[^\u4e00-\u9fa5a-z0-9]/gi, '').toLowerCase();
    var set = {};
    for (var i = 0; i < s.length - 1; i++) set[s.slice(i, i + 2)] = 1;
    return Object.keys(set);
  }

  function rel(q, text) {
    var g = grams(q);
    if (!g.length) return 0;
    var t = String(text || '').toLowerCase(), n = 0;
    for (var i = 0; i < g.length; i++) if (t.indexOf(g[i]) >= 0) n++;
    return n / g.length;
  }

  /* 任务的核心词组：品牌 + 事件词。用它判断一条检索结果到底跑没跑题，
     只看「小蜜蜂」三个字会把同名游戏的活动规则也算成相关。 */
  function coreOf(t) {
    var title = String((t && t.title) || '');
    var ev = (title.match(/(两周年|三周年|周年|生日|开学季|毕业季|大赛|挑战赛|征文|摄影|话题|周年庆)/) || [])[0] || '';
    return ((t && t.brand) || '') + ' ' + ev;
  }

  /* 搜索词 = AI 读懂任务后提出的研究问题。
     重点：搜的是「怎么理解/怎么完成/去哪找素材」，不是把原帖标题再搜一遍。
     原帖我们已经全文拿到了，再搜活动名只会得到同一条活动页，对创作毫无帮助。 */
  function queriesFor(task) {
    var out = [];
    var push = function (s) {
      s = String(s || '').replace(/\s+/g, ' ').trim();
      if (s && len(s) >= 2 && out.indexOf(s) < 0) out.push(s);
    };
    /* AI 研究问题优先：这些是"要弄懂这个任务和收集素材"而提出的问题 */
    (task.research || []).forEach(push);
    /* 概念补充：帖子里不懂的名词，逐个搜它的真实含义和玩法 */
    (task.concepts || []).forEach(function (c) {
      if (c && c.term) push(String(c.term) + ' 是什么 怎么做');
    });
    /* 兜底：完全没有研究问题时，围绕任务主体问"怎么回事/怎么做/真实体验" */
    if (!out.length) {
      var brand = cleanBrand(task.brand || task.title).split(' ').slice(0, 2).join(' ') || String(task.title || '').slice(0, 10);
      push(brand + ' 是什么意思 怎么参与');
      push(brand + ' 真实体验 心得');
      var tag = (task.hashtags || [])[0] || '';
      if (tag) push(tag + ' 小红书 高赞写法');
    }
    return out.slice(0, 8);
  }

  /* 必应结果页被解析成纯文本时，按「域名行」切块 */
  function parseBingText(text, q) {
    var lines = String(text || '').split(/\n+/).map(function (x) { return x.trim(); }).filter(Boolean);
    var items = [], cur = null;
    var isSite = function (s) {
      return /^(https?:\/\/)?[a-z0-9-]+(\.[a-z0-9-]+){1,3}(\/|$)/i.test(s) && s.length < 70 && s.indexOf(' ') < 0;
    };
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i];
      if (isSite(ln)) {
        if (cur) items.push(cur);
        cur = { site: ln.replace(/^https?:\/\//, '').replace(/\/.*$/, ''), title: '', snippet: '', url: '', date: '' };
        continue;
      }
      if (!cur) continue;
      if (!cur.title && ln.length > 6 && ln.length < 80) { cur.title = ln; continue; }
      if (cur.title && cur.snippet.length < 220 && !/^阅读更多$/.test(ln)) {
        cur.snippet += (cur.snippet ? ' ' : '') + ln;
      }
    }
    if (cur) items.push(cur);
    items.forEach(function (it) {
      if (!it.title) it.title = it.snippet.slice(0, 36);
      it.snippet = it.snippet.replace(/阅读更多/g, '').trim().slice(0, 220);
      it.from = 'parse';
    });
    return items.filter(function (it) { return rel(q, it.title + it.snippet) > 0; });
  }

  var deadBase = {};

  async function searchOne(q) {
    var list = bases();
    var lastErr = '';
    for (var i = 0; i < list.length; i++) {
      var b = list[i];
      if (deadBase[b]) continue;
      try {
        var d = await getJSON(apiUrl(b, '/api/search', { q: q, n: 10 }), 13000);
        if (d && d.ok && d.items && d.items.length) {
          return { items: d.items.map(function (x) { return Object.assign({ from: 'search' }, x); }), via: 'search', engine: d.engine || '' };
        }
        if (d && d.error) lastErr = d.error;
      } catch (e) {
        /* 连不上的地址记下来，后面几组词不再等它 */
        deadBase[b] = 1;
        lastErr = e.message || '';
      }
    }
    /* 老版解析服务只有 /api/parse：把必应结果页当普通网页抓回来 */
    for (var j = 0; j < list.length; j++) {
      var b2 = list[j];
      if (deadBase[b2]) continue;
      try {
        var qurl = 'https://cn.bing.com/search?q=' + encodeURIComponent(q) + '&count=10&setlang=zh-Hans&ensearch=0';
        var r = await getJSON(apiUrl(b2, '/api/parse', { url: qurl }), 17000);
        if (r && r.ok && r.text) {
          var items = parseBingText(r.text, q);
          if (items.length) return { items: items, via: 'parse', engine: 'bing-text' };
        }
        if (r && r.error) lastErr = r.error;
      } catch (e2) {
        deadBase[b2] = 1;
        lastErr = e2.message || lastErr;
      }
    }
    return { items: [], via: '', error: lastErr };
  }

  async function searchAll(queries, onStep) {
    var all = [], channels = {}, errs = [], fails = 0;
    for (var i = 0; i < queries.length; i++) {
      if (onStep) onStep('检索第 ' + (i + 1) + '/' + queries.length + ' 组：' + queries[i]);
      var r;
      try { r = await searchOne(queries[i]); } catch (e) { r = { items: [], via: '' }; }
      if (r.via) { channels[r.via] = (channels[r.via] || 0) + 1; fails = 0; }
      if (r.error) errs.push(r.error);
      if (!r.via && !(r.items || []).length) {
        fails += 1;
        /* 连续两组都查不动，说明通道不通，不必把剩下的词挨个等超时 */
        if (fails >= 2) break;
      }
      (r.items || []).forEach(function (it) {
        it.q = queries[i];
        it.rel = rel(queries[i], (it.title || '') + ' ' + (it.snippet || ''));
        all.push(it);
      });
      if (i < queries.length - 1) await sleep(400);
    }

    /* 去重：同域名同标题只留一条 */
    var seen = {}, out = [];
    all.sort(function (a, b) { return (b.rel || 0) - (a.rel || 0); });
    all.forEach(function (it) {
      var k = (it.url || (it.site + '|' + it.title)).replace(/[#?].*$/, '').slice(0, 120);
      if (seen[k]) return;
      seen[k] = 1;
      out.push(it);
    });
    return { items: out.slice(0, 12), channels: channels, error: errs[0] || '' };
  }

  /* ---------------- 素材：图片 / 视频 ---------------- */

  function fileToDataUrl(file) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { resolve(String(fr.result || '')); };
      fr.onerror = function () { reject(new Error('读取文件失败')); };
      fr.readAsDataURL(file);
    });
  }

  function shrink(dataUrl, max) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.onload = function () {
        var w = img.width, h = img.height, m = max || 1024;
        if (w > m || h > m) {
          var r = Math.min(m / w, m / h);
          w = Math.round(w * r); h = Math.round(h * r);
        }
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        var ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve({ url: cv.toDataURL('image/jpeg', 0.82), w: w, h: h });
      };
      img.onerror = function () { resolve({ url: dataUrl, w: 0, h: 0 }); };
      img.src = dataUrl;
    });
  }

  async function addImage(file, chain) {
    var raw = await fileToDataUrl(file);
    var small = await shrink(raw, 1024);
    var out = { id: uid(), thumb: small.url, w: small.w, h: small.h, name: file.name || '图片', desc: '' };
    var vis = visionChain(chain);
    if (vis) {
      try {
        out.desc = String(await L.visionAsk(vis, small.url,
          '用中文客观描述这张图：场景、人物（数量/动作/穿着）、物品、画面里的文字。只描述看到的，不要推测。80 字以内。')).trim().slice(0, 240);
      } catch (e) { out.desc = ''; out.err = e.message || ''; }
    }
    return out;
  }

  function visionChain(chain) {
    var re = /(vision|-vl\b|4v\b|4o\b|glm-4v|omni|qwen-vl|internvl|pixtral|gemini)/i;
    for (var i = 0; i < (chain || []).length; i++) if (re.test(chain[i].model || '')) return chain[i];
    return null;
  }

  async function readVideo(file, chain) {
    var url = URL.createObjectURL(file);
    var v = document.createElement('video');
    v.src = url;
    v.muted = true;
    v.playsInline = true;
    v.preload = 'auto';
    await new Promise(function (resolve, reject) {
      v.onloadedmetadata = function () { resolve(); };
      v.onerror = function () { reject(new Error('这个视频浏览器解不开')); };
      setTimeout(function () { resolve(); }, 6000);
    });
    var dur = Number(v.duration) || 0;
    var frames = [];
    var vis = visionChain(chain);
    var n = vis ? 4 : 0;
    for (var i = 0; i < n; i++) {
      var t = dur ? Math.min(dur - 0.1, dur * (0.12 + i * 0.24)) : i;
      try {
        await new Promise(function (resolve) {
          var done = false;
          v.onseeked = function () { if (!done) { done = true; resolve(); } };
          v.currentTime = t;
          setTimeout(function () { if (!done) { done = true; resolve(); } }, 1800);
        });
        var w = v.videoWidth, h = v.videoHeight;
        if (!w || !h) continue;
        var scale = Math.min(1, 720 / Math.max(w, h));
        var cv = document.createElement('canvas');
        cv.width = Math.round(w * scale);
        cv.height = Math.round(h * scale);
        cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height);
        var data = cv.toDataURL('image/jpeg', 0.8);
        var desc = '';
        if (vis) {
          try {
            desc = String(await L.visionAsk(vis, data,
              '这是视频里的一帧。用中文说明：画面内容、人物在做什么、出现的文字。40 字以内。')).trim().slice(0, 160);
          } catch (e) { /* ignore */ }
        }
        frames.push({ at: t, url: data, desc: desc });
      } catch (e) { /* ignore */ }
    }
    try { URL.revokeObjectURL(url); } catch (e) { /* ignore */ }
    return { id: uid(), name: file.name || '视频', dur: dur, frames: frames, desc: '' };
  }

  /* ---------------- 写作 ---------------- */

  function genreBrief(k) {
    var g = GENRES.filter(function (x) { return x.key === k; })[0] || GENRES[0];
    return g;
  }

  function toneBrief(k) {
    return {
      warm: '真诚、具体，像跟朋友讲自己的经历，不喊口号',
      light: '轻快、有节奏，允许玩笑，但别油腻',
      cool: '克制、少形容词，用事实和细节说话',
      sharp: '有明确判断，敢说哪里不好，但不攻击人'
    }[k] || '真诚、具体';
  }

  function evidenceBlock(ev) {
    var lines = [];
    (ev || []).forEach(function (e, i) {
      if (!e.on) return;
      var head = '[E' + (i + 1) + '] ' + (e.from === 'task' ? '任务原帖（官方说明，全文）' : (e.site || host(e.url) || '网页')) + '｜' + (e.date || '日期未知') + '｜' + (e.title || '');
      /* 原帖要点已经浓缩进 understanding，这里给模型看的是"足以核对事实"的一段，
         不必把上万字原文全塞进去撑爆免费模型的上下文；完整原帖在资料池里可随时查看。 */
      var cap = e.from === 'task' ? 3500 : 1400;
      var body = String(e.text || e.snippet || '').replace(/\s+/g, ' ').slice(0, cap);
      lines.push(head + '\n' + body);
    });
    return lines.join('\n\n') || '（没有可用的检索资料）';
  }

  function materialBlock(mat) {
    var out = [];
    (mat.images || []).forEach(function (im, i) {
      out.push('图片' + (i + 1) + '：' + (im.desc || '（未能识别内容）'));
    });
    if (mat.video) {
      out.push('视频 ' + Math.round(mat.video.dur || 0) + ' 秒：' + (mat.video.desc || '') +
        (mat.video.frames || []).map(function (f, i) { return f.desc ? (' 帧' + (i + 1) + '：' + f.desc) : ''; }).join(''));
    }
    if (mat.notes) out.push('我的想法：' + mat.notes);
    if (mat.text) out.push('我写的草稿/文案：' + mat.text);
    return out.join('\n') || '（用户没有提供素材）';
  }

  function buildMessages(p) {
    var t = p.task;
    var plat = (D.PLATFORMS.filter(function (x) { return x.key === p.platform; })[0] || {}).name || t.platformName || '小红书';
    var genre = genreBrief(p.genre);
    var target = Number(p.words) || 0;
    var minW = Number(t.minWords) || 0;
    var want = target || (minW ? Math.max(minW, 600) : (p.genre === 'script' ? 450 : p.genre === 'short' ? 260 : 700));

    var sys = '你是一个在' + plat + '上有真实粉丝的中文创作者，不是文案机器。' +
      '你写东西的顺序是：先把任务真正读懂——它想让人做什么、里面的概念和行为到底指什么（例如 NoSpend 是一种刻意不消费、重新审视欲望的生活方式实验，不是简单的省钱），' +
      '再想这条内容对谁有用、凭什么可信、读者看完能带走什么，最后才动笔。' +
      '每一句话都要像一个真人在认真表达，不要像说明书那样生硬，不要只按字面理解任务后机械执行。\n' +
      '铁律（违反任何一条都算失败）：\n' +

  function factCheck(body, corpus) {
    var text = String(body || '');
    var pool = String(corpus || '').replace(/[\s,，]/g, '');
    var re = /(\d{4}年\d{1,2}月\d{1,2}日|\d{1,2}月\d{1,2}日|\d+(?:\.\d+)?\s*(?:万|亿|元|块|%|％|名|位|人|天|年|月|日|岁|次|篇|个|份|箱|杯|折|倍|小时|分钟))/g;
    var seen = {}, out = [];
    var m;
    while ((m = re.exec(text))) {
      var tok = m[0].replace(/\s/g, '').replace(/％/g, '%');
      if (seen[tok]) continue;
      seen[tok] = 1;
      var ok = pool.indexOf(tok) >= 0;
      if (!ok) {
        /* 「10 名」和「10名」、「10000元」和「1万元」这类写法差异，放宽到数字本身 */
        var num = tok.match(/\d+(?:\.\d+)?/);
        if (num) {
          var n = num[0];
          if (pool.indexOf(n) >= 0) ok = true;
        }
      }
      out.push({ token: tok, ok: ok });
    }
    var bad = out.filter(function (x) { return !x.ok; });
    return { list: out, bad: bad, total: out.length, rate: out.length ? Math.round((out.length - bad.length) / out.length * 100) : 100 };
  }

  function quoteHits(body, corpus) {
    /* 话题标签是任务强制要带的，不能算照搬；先摘掉再比对 */
    var strip = function (x) { return String(x || '').replace(/#[^\s#]{1,30}/g, '').replace(/\s+/g, ''); };
    var src = strip(corpus);
    if (!src) return [];
    var hits = [];
    String(body || '').split(/[。！？\n]/).forEach(function (s) {
      var t = strip(s);
      if (t.length < 14) return;
      for (var i = 0; i + 14 <= t.length; i += 4) {
        var g = t.slice(i, i + 14);
        if (src.indexOf(g) >= 0) { hits.push(g); break; }
      }
    });
    return hits.slice(0, 4);
  }

  function checklist(t, body, tags, facts) {
    var out = [];
    var hasTag = function (x) {
      return (tags || []).some(function (y) { return y === x || y.indexOf(x) >= 0; }) || String(body).indexOf('#' + x) >= 0;
    };
    (t.hashtags || []).slice(0, 3).forEach(function (x) {
      out.push({ t: '带话题 #' + x, ok: hasTag(x), hint: hasTag(x) ? '' : '发布时补在正文末尾' });
    });
    if (t.minWords) out.push({ t: '不少于 ' + t.minWords + ' 字', ok: len(body) >= t.minWords, hint: '当前 ' + len(body) + ' 字' });
    out.push({ t: '数字/时间有出处', ok: !(facts && facts.bad && facts.bad.length), hint: facts && facts.bad && facts.bad.length ? '待核实：' + facts.bad.map(function (x) { return x.token; }).slice(0, 4).join('、') : '' });
    out.push({ t: '原创表达，不搬运', ok: true, hint: '发布前自己再读一遍，确认没有整段照搬' });
    if (t.deadline) out.push({ t: '在 ' + t.deadline + ' 前发布', ok: true, hint: '过期就作废' });
    out.push({ t: 'AI 辅助已标识', ok: true, hint: '活动允许 AI 辅助时也要标明' });
    return out;
  }

  async function writeGrounded(p, opts) {
    var chain = (opts && opts.chain) || [];
    if (!chain.length) {
      var err = new Error('还没有可用的模型服务商，去「我的 → 模型服务」加一个');
      err.code = 'NO_MODEL';
      throw err;
    }
    var msgs = buildMessages(p);
    var res = await L.chatChain(chain, msgs, { temperature: 0.86, maxTokens: 4096 });
    var o = parseJSON(res.text);
    if (!o || !o.body) throw new Error('模型没有按约定格式返回（可能被截断）');

    var corpus = [p.task.title, p.task.deadline, (p.task.hashtags || []).join(' '), (p.task.rules || []).join(' '), (p.task.awards || []).join(' ')]
      .concat((p.evidence || []).filter(function (e) { return e.on; }).map(function (e) { return (e.title || '') + ' ' + (e.text || e.snippet || ''); }))
      .concat([p.material.notes, p.material.text])
      .concat((p.material.images || []).map(function (x) { return x.desc || ''; }))
      .concat(p.material.video ? [p.material.video.desc || ''] : [])
      .join('\n');

    var facts = factCheck(o.body, corpus);
    var quotes = quoteHits(o.body, corpus);
    var rounds = 1;

    if ((facts.bad.length || quotes.length) && rounds < 2) {
      rounds = 2;
      var fix = [];
      if (facts.bad.length) fix.push('这些数字/时间在资料里找不到出处：' + facts.bad.map(function (x) { return x.token; }).slice(0, 8).join('、') + '。删掉，或改成资料支持的说法');
      if (quotes.length) fix.push('这几句和资料连续重合超过 14 字，属于照搬：' + quotes.join(' / ') + '。用自己的话重写');
      msgs = msgs.concat([
        { role: 'assistant', content: String(res.text).slice(0, 3000) },
        { role: 'user', content: '这稿有问题：' + fix.join('；') + '。请重写一稿，事实不许新增，只输出 JSON。' }
      ]);
      try {
        var res2 = await L.chatChain(chain, msgs, { temperature: 0.8, maxTokens: 4096 });
        var o2 = parseJSON(res2.text);
        if (o2 && o2.body) {
          o = o2; res = res2;
          facts = factCheck(o.body, corpus);
          quotes = quoteHits(o.body, corpus);
        }
      } catch (e) { /* 保留第一稿 */ }
    }

    var body = E.tidyBody ? E.tidyBody(String(o.body)) : String(o.body);
    var tags = (o.tags || []).map(function (x) { return String(x).replace(/^#/, '').trim(); }).filter(Boolean).slice(0, 6);
    var titles = (o.titles || []).map(String).filter(Boolean).slice(0, 3);
    var title = String(o.title || titles[0] || '').replace(/^[#＃\s]+/, '').trim();

    var withTags = ['xhs', 'bee', 'weibo', 'douyin', 'toutiao', 'coolapk'].indexOf(p.platform) > -1;
    var full = body;
    if (withTags && tags.length) full = body + '\n\n' + tags.map(function (x) { return '#' + x; }).join(' ');

    return {
      title: title || '未命名',
      titles: titles,
      body: full,
      plain: body,
      tags: tags,
      facts: (o.facts || []).map(function (f) { return { claim: String(f.claim || ''), src: String(f.src || '') }; }).filter(function (f) { return f.claim; }).slice(0, 12),
      why: String(o.why || ''),
      check: facts,
      quotes: quotes,
      rounds: rounds,
      words: E.countWords ? E.countWords(full) : len(full),
      platform: p.platform,
      genre: p.genre,
      model: (res.provider.name ? res.provider.name + ' · ' : '') + res.model,
      engine: 'api',
      at: Date.now()
    };
  }

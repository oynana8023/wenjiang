<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<meta name="description" content="文匠 AI — 把一条链接，写成你的稿。实时热榜、链接取正文、按平台重写、原创度自检、配图提示词。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="文匠">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<title>文匠 AI · 二创工作台</title>
<!--STYLE-->
</head>
<body>
<div class="app" id="app">
  <header class="topbar" id="topbar"></header>
  <div id="viewHost"></div>
  <div id="dockHost"></div>
  <nav class="nav" id="nav"></nav>
  <button class="fab" id="fab" aria-label="新建"></button>
  <div class="layer" id="layer"></div>
  <div class="toast" id="toast"></div>
</div>
<!--SNAPSHOT-->
<!--SCRIPTS-->
<noscript>
  <div style="position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:#08080a;color:#f0f0f0;font:16px/1.7 -apple-system,system-ui,'PingFang SC',sans-serif;padding:32px;text-align:center">
    这个页面需要开启 JavaScript 才能运行。
  </div>
</noscript>
<script>
/* 注册 Service Worker：装到主屏幕后断网也能打开。file:// 打开时自动跳过 */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* 不支持或被拦就安静降级 */ });
  });
}
</script>
<script>
/* 白屏兜底：脚本没跑起来时给出能看懂的提示，而不是一片黑 */
setTimeout(function () {
  var h = document.getElementById('viewHost');
  if (h && !h.children.length) {
    h.innerHTML =
      '<div style="padding:88px 26px;font:15px/1.75 -apple-system,system-ui,\'PingFang SC\',sans-serif;color:#f0f0f0">' +
      '<div style="font-size:21px;font-weight:600;letter-spacing:-.01em">页面没加载完</div>' +
      '<div style="margin-top:12px;color:#9b9b9b">这是单文件版本，正常不需要联网。请下拉刷新一次；' +
      '仍然空白的话，换系统浏览器打开（微信 / QQ 内置浏览器有时会拦截脚本）。</div></div>';
  }
}, 2500);
</script>
</body>
</html>

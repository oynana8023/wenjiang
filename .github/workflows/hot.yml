name: refresh-hot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/hot.yml"

permissions:
  contents: write

concurrency:
  group: refresh-hot
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch hot lists
        run: node scripts/fetch-hot.mjs

      - name: Commit snapshot
        run: |
          git config user.name "wenjiang-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hot.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore(data): refresh hot list [skip ci]"
            git push
          fi
